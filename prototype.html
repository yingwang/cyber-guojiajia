<title>赛博过家家</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: one phone-width column. Sticky shop header (search + aisles), a two-up shelf of toy-tagged goods,
   a fixed four-tab bar, and bottom sheets (scrolling body + pinned footer) for product, checkout, unboxing.
   Kraft parcels and yellow price tags carry the identity. */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --tile:#E1E7F1; --ink:#17203A; --muted:#5C6684; --line:#D2D9E6;
  --accent:#EE3F6B; --accent-ink:#FFFFFF; --tag:#FFC93A; --tag-ink:#2B2100; --kraft:#C79661; --kraft-dark:#9A6E3E; --ok:#169E70;
  --soft:#F4F6FA; --scrim:rgba(10,14,24,.45);
  --f-display:"ZCOOL KuaiLe","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-num:"Space Grotesk","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131D; --surface:#181E2D; --tile:#222A3D; --ink:#ECEFF7; --muted:#98A1BB; --line:#2B3349;
  --accent:#FF5C86; --accent-ink:#FFFFFF; --tag:#FFD153; --tag-ink:#2B2100; --kraft:#B78852; --kraft-dark:#8B6236; --ok:#31BE8C;
  --soft:#1E2536; --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F131D; --surface:#181E2D; --tile:#222A3D; --ink:#ECEFF7; --muted:#98A1BB; --line:#2B3349;
  --accent:#FF5C86; --accent-ink:#FFFFFF; --tag:#FFD153; --tag-ink:#2B2100; --kraft:#B78852; --kraft-dark:#8B6236; --ok:#31BE8C;
  --soft:#1E2536; --scrim:rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-size:28px;line-height:1;letter-spacing:1px}
.logo i{font-style:normal;color:var(--accent)}
.saved-pill{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}
.saved-pill b{font-family:var(--f-num);color:var(--ink);font-size:13px;margin-left:4px}
.search{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.search:focus-within{border-color:var(--accent)}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{border:0;outline:0;background:transparent;color:var(--ink);font:inherit;flex:1;min-width:0;height:100%}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-btn{flex:none;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 14px;font-size:14px}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* shelf */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;padding-top:6px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:18px}
.art{aspect-ratio:1;max-width:100%;background:var(--tile);border-radius:18px;display:grid;place-items:center;overflow:hidden;position:relative}
.art svg{width:76%;height:76%}
.flag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 7px}
.dots-c{position:absolute;right:8px;bottom:8px;display:flex;gap:3px}
.dots-c i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--surface)}
.nm{font-size:14px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{position:relative;display:inline-flex;align-items:baseline;background:var(--tag);color:var(--tag-ink);font-family:var(--f-num);font-weight:700;font-size:16px;line-height:1.3;padding:2px 10px 2px 17px;border-radius:4px 9px 9px 4px;font-variant-numeric:tabular-nums}
.tag::before{content:"";position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--bg)}
.sheet .tag::before{background:var(--surface)}
.tag small{font-size:11px;font-weight:500;margin-right:1px}
.tag.big{font-size:24px;padding:4px 14px 4px 22px}
.tag.big::before{left:8px;width:8px;height:8px;margin-top:-4px}
s{color:var(--muted);font-family:var(--f-num);font-size:12px}
.meta{font-size:12px;color:var(--muted)}
.none{padding:48px 0;text-align:center;color:var(--muted)}
.count{font-size:12px;color:var(--muted);margin:2px 0 8px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0;font-size:12px;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] svg{stroke:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-num);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* sheets: scrolling body + optional pinned footer */
.sheet-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.sheet{position:relative;width:100%;max-width:520px;max-height:92%;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;overflow:hidden;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);outline:none}
.sheet-wrap.show .scrim{opacity:1}
.sheet-wrap.show .sheet{transform:none}
.sh-body{flex:1 1 auto;min-height:0;overflow:auto;padding-block:10px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sh-body.has-foot{padding-block:10px 18px}
.sh-foot{flex:none;display:flex;gap:10px;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sh-art{background:var(--tile);border-radius:20px;aspect-ratio:16/10;max-width:100%;display:grid;place-items:center}
.sh-art svg{height:82%;width:auto;max-width:100%}
h2{font-family:var(--f-display);font-weight:400;font-size:25px;line-height:1.25;margin:14px 0 4px;text-wrap:balance}
h3{font-size:16px;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
h3 small{font-weight:400;color:var(--muted);font-size:13px}
.blurb{margin:0;color:var(--muted)}
.pricebar{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}

/* gallery */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:20px;background:var(--tile);scrollbar-width:none;overscroll-behavior-x:contain}
.gal::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/10;max-width:100%;position:relative}
.slide>svg{display:block;width:100%;height:100%}
.slide .lab{position:absolute;left:10px;bottom:10px;font-size:11px;background:var(--surface);color:var(--muted);border-radius:6px;padding:1px 8px}
.gdots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.gdots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s,background .2s}
.gdots i.on{width:16px;background:var(--ink)}
.sc-wall{fill:var(--tile)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.swatches span{font-size:13px;color:var(--muted);margin-right:4px}
.swc{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.swc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.swc:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* details */
.desc{margin:0;line-height:1.75}
.points{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.points li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.points li::before{content:"✓";flex:none;width:18px;height:18px;margin-top:2px;border-radius:50%;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);font-size:11px;font-weight:700;display:grid;place-items:center}
table.specs{width:100%;border-collapse:collapse;font-size:14px}
.specs th{width:34%;text-align:left;font-weight:400;color:var(--muted);padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.specs td{padding:8px 0;border-bottom:1px solid var(--line)}

/* compare */
.cmp-wrap{overflow-x:auto}
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th{font-weight:500;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.cmp td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.cmp tr.me td{background:var(--tile)}
.cmp tr.me td:first-child{border-radius:10px 0 0 10px}
.cmp tr.me td:last-child{border-radius:0 10px 10px 0}
.cmp tr[data-open]{cursor:pointer}
.cmp .d{display:block;font-size:11px}
.cmp .up{color:var(--accent)}
.cmp .down{color:var(--ok)}

/* reviews */
.rv-head{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:12px 14px}
.rv-score{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1}
.stars{color:var(--tag);letter-spacing:1px;font-size:13px}
.stars b{color:var(--line);font-weight:400}
.rv-note{font-size:12px;color:var(--muted);margin-top:2px}
.rv{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:#FFFFFF}
.rv-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rv-top b{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-meta{font-size:12px;color:var(--muted)}
.rv p{margin:4px 0 0;font-size:14px;line-height:1.6}
.follow{margin-top:8px;background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.55}
.follow em{font-style:normal;color:var(--accent);font-weight:500;margin-right:4px}

.actions{display:flex;gap:10px;margin-top:20px}
.btn{appearance:none;border:0;cursor:pointer;font-weight:700;border-radius:14px;padding:11px 18px;background:var(--accent);color:var(--accent-ink);flex:1;text-align:center;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:46px;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px;border-radius:10px;flex:none}
.btn.wide{width:100%;flex:none}
.btn[disabled]{opacity:.6;cursor:default}
.btn:focus-visible,.chip-btn:focus-visible,.opt:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cart */
.line{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .art{border-radius:12px}
.line .nm{min-height:0}
.line .meta{margin:2px 0 4px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;font-size:18px}
.step span{min-width:22px;text-align:center;font-family:var(--f-num)}
.sum{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:14px 14px 14px 18px;background:var(--surface);border-radius:18px;border:1px solid var(--line)}
.sum .total{font-family:var(--f-num);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.sum .label{font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:56px 0 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.empty svg{width:120px;height:auto}

/* checkout */
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.mini li span:last-child{font-family:var(--f-num);white-space:nowrap}
.mini li small{color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.opt b{font-size:14px}
.opt small{color:var(--muted);font-size:12px}
.opt[aria-checked="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.pay{position:relative;height:168px;margin-top:18px}
.cardface{position:absolute;top:0;left:50%;margin-left:-110px;width:220px;height:134px;border-radius:16px;padding:14px 16px;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),#FF8B55 58%,var(--tag));display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px rgba(23,32,58,.18);z-index:1}
.cardface .t{display:flex;justify-content:space-between;align-items:flex-start;font-family:var(--f-display);font-size:18px}
.cardface .t b{font-family:var(--f-num);font-size:30px;line-height:.9}
.cardface .num{font-family:var(--f-num);letter-spacing:2px;font-size:15px}
.cardface .lim{font-size:11px;opacity:.9}
.cardface.swipe{animation:swipe .95s ease-in-out}
@keyframes swipe{0%{transform:translateY(0)}45%{transform:translateY(62px)}100%{transform:translateY(0)}}
.reader{position:absolute;bottom:0;left:50%;margin-left:-125px;width:250px;height:50px;background:var(--ink);border-radius:12px 12px 16px 16px;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--bg);font-size:12px}
.reader::before{content:"";position:absolute;top:7px;left:18px;right:18px;height:4px;border-radius:2px;background:var(--bg);opacity:.35}
.reader i{width:11px;height:11px;border-radius:50%;background:var(--tag);transition:background .2s,box-shadow .2s}
.reader.ok i{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.fine{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0}
.ok-title{font-family:var(--f-display);font-size:28px;text-align:center;margin:8px 0 12px}
.receipt{background:var(--bg);border-radius:14px 14px 0 0;padding:14px 16px 18px;position:relative;margin-bottom:16px}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:radial-gradient(circle at 7px 10px,var(--surface) 6px,var(--bg) 6.5px) 0 0/14px 10px repeat-x}
.r-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.r-row:last-child{border-bottom:0}
.r-row span{color:var(--muted)}
.r-row b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.r-row.big b{font-size:24px;font-weight:700;color:var(--accent)}

/* parcels */
.sec-title{font-family:var(--f-display);font-weight:400;font-size:22px;margin:10px 0 4px}
.parcel{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;overflow:hidden}
.parcel::before{content:"";position:absolute;top:0;bottom:0;right:28px;width:30px;background:var(--kraft);opacity:.16}
.p-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative}
.no{font-family:var(--f-num);font-size:13px;color:var(--muted);letter-spacing:.5px;margin-right:auto}
.st{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--tile)}
.st.go{background:var(--tag);color:var(--tag-ink)}
.st.done{background:var(--ok);color:var(--accent-ink)}
.demo{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:0 6px}
.thumbs{display:flex;gap:8px;margin:12px 0 0;position:relative}
.thumbs .art{width:56px;border-radius:12px}
.bar{position:relative;height:8px;border-radius:4px;background:var(--tile);margin:30px 0 8px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--kraft);transition:width 1s linear}
.truck{position:absolute;top:-24px;width:32px;height:22px;transform:translateX(-50%);transition:left 1s linear}
.truck svg{display:block;width:100%;height:100%}
.kr{fill:var(--kraft)} .krd{fill:var(--kraft-dark)} .tink{fill:var(--ink)} .tapef{fill:var(--tag);opacity:.9}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));font-size:11px;color:var(--muted);text-align:center}
.stages li.done{color:var(--ink);font-weight:500}
.where{font-size:13px;margin:10px 0 0;color:var(--muted);position:relative}
.where b{color:var(--ink);font-weight:500}
.parcel .btn{margin-top:12px;position:relative}

/* unboxing */
.stage{position:relative;height:236px;width:220px;margin:4px auto 0}
.boxf,.lid,.pop,.glow{position:absolute}
.boxf{left:30px;bottom:0;width:160px;height:110px;z-index:2}
.lid{left:22px;bottom:104px;width:176px;height:32px;z-index:3;transform-origin:20% 100%}
.pop{left:50%;bottom:24px;z-index:1;display:flex;gap:6px;transform:translate(-50%,40px) scale(.45);opacity:0}
.pop svg{width:104px;height:104px}
.pop.many svg{width:72px;height:72px}
.glow{left:50%;top:10px;width:180px;height:180px;margin-left:-90px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--tag) 55%,transparent),transparent 65%);opacity:0;transform:scale(.6)}
.stage.open .lid{transform:translate(-26px,-74px) rotate(-30deg);opacity:0;transition:transform .55s cubic-bezier(.3,.7,.3,1),opacity .4s .25s}
.stage.open .pop{transform:translate(-50%,-84px) scale(1);opacity:1;transition:transform .75s .25s cubic-bezier(.2,1.4,.4,1),opacity .3s .25s}
.stage.open .glow{opacity:1;transform:scale(1);transition:opacity .6s .35s,transform .9s .35s}
.unbox-after{text-align:center}

/* home */
.jar{display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:8px}
.jar svg{width:88px;height:auto}
.glass{fill:var(--tile);stroke:var(--line);stroke-width:2}
.coins{fill:var(--tag)} .coin-edge{fill:none;stroke:var(--tag-ink);stroke-opacity:.16;stroke-width:1.5} .lidc{fill:var(--kraft)}
.label{font-size:13px;color:var(--muted)}
.big{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.subline{font-size:13px;color:var(--muted);margin-top:4px}
.owned{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.own{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.own .art{border-radius:12px}
.own .nm{min-height:0;font-size:13px}
.cool{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.cool b{font-family:var(--f-num);color:var(--ink);font-weight:500;white-space:nowrap}
.coolbar{height:4px;background:var(--tile);border-radius:2px;overflow:hidden}
.coolbar i{display:block;height:100%;background:var(--ok);transition:width 1s linear}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.keep{font-size:12px;color:var(--ok)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.setrow p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.sw{flex:none;cursor:pointer;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;border:0;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .2s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{left:23px}
.reset{margin-top:12px}
.coupon{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 14px;align-items:center;border:1.5px dashed var(--accent);border-radius:14px;padding:12px 16px;margin:16px 0}
.coupon .pct{grid-row:span 2;font-family:var(--f-display);font-size:32px;color:var(--accent);line-height:1}
.coupon b{font-family:var(--f-num);letter-spacing:1px}
.coupon small{color:var(--muted);font-size:12px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:40;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;transition-delay:0s!important}}

eviews":[{"nick":"厨房颜值党","stars":5,"ago":"10月5日","color":"粉蓝色","text":"粉蓝色太可爱了，放在白色台面上，每次进厨房都想多看两眼。","follow":"用了一个月，壶身没掉漆，水垢用柠檬酸一煮就掉。"},{"nick":"1***f","stars":5,"ago":"10月23日","color":"奶油色","text":"奶油色很温柔，和木头台面特别搭。","follow":"用了两周，每天早上烧水泡茶，壶嘴从没滴过水。"},{"nick":"小**壶","stars":3,"ago":"2 天前","color":"粉红色","text":"颜色好看，但烧水时声音有点大，壶身也会很烫，要小心别碰到。"},{"nick":"喝茶的老爸","stars":5,"ago":"昨天","color":"薄荷绿","text":"爸爸每天用来泡茶，说烧得快，壶嘴倒水很顺。"},{"nick":"w**k","stars":4,"ago":"3 天前","color":"粉蓝色","text":"有点重，装满水单手倒有点费劲，不过实在好看。"}]},"zoji":{"desc":"Zojirushy 电饭煲用压力 IH 加热，整个内胆均匀受热，煮出来的米饭粒粒分明，表面亮晶晶的，像会发光。白米、糙米、杂粮、煮粥都有对应模式，还能预约，早上起来就有热粥。适合讲究吃一口好米饭的人家。","points":["压力 IH 均匀加热","米饭粒粒有光泽","预约起床就有粥"],"specs":[["容量","1.8 升（约 10 杯米）"],["加热方式","压力 IH"],["内胆","厚釜涂层内胆"],["功能","白米、糙米、杂粮、煮粥、保温"],["产地","日本"]],"colors":[["米白色","#F2F0EA"],["香槟金","#D8C7A2"],["炭黑色","#2C2C2E"]],"reviews":[{"nick":"爱吃米饭的东北人","stars":5,"ago":"10月9日","color":"米白色","text":"煮出来的米饭真的会发亮，光吃白饭就能吃一碗。","follow":"用了一个月，家里人都说饭比以前香，其实米没换。"},{"nick":"h***y","stars":5,"ago":"5 天前","color":"香槟金","text":"预约煮粥很方便，早上起来粥是绵的。"},{"nick":"小**粒","stars":4,"ago":"10月12日","color":"米白色","text":"饭很好吃，就是按键上是日文，刚开始得对着说明书一个个认。"},{"nick":"三口之家","stars":5,"ago":"11月1日","color":"炭黑色","text":"黑色很有质感，煮一锅饭三个人刚好吃两顿。"},{"nick":"7***m","stars":4,"ago":"2 天前","color":"米白色","text":"煮一锅要四十多分钟，比我以前那个慢一些，不过等得值。"}]},"vitamix":{"desc":"Vitamex 破壁机马力很足，冰块、坚果、带皮的水果都能打得细腻顺滑。转速可以无级调节，从带颗粒的莎莎酱到绵密的坚果酱都能做，高速运转时的摩擦热还能直接打出一锅热汤。适合每天打果昔、做辅食的人，什么都打得碎。","points":["什么都打得碎","无级调速","摩擦生热直接出汤"],"specs":[["功率","约 1500W"],["容量","2 升杯"],["调速","10 档无级调速"],["刀片","不锈钢硬化刀片"],["保修","整机 7 年"]],"colors":[["经典黑","#2A2A2E"],["拉丝银","#B8BABD"],["石板灰","#5E6168"],["酒红色","#6E2230"]],"reviews":[{"nick":"果昔每天一杯","stars":5,"ago":"10月3日","color":"经典黑","text":"冻香蕉加燕麦，三十秒就打得像冰淇淋一样。","follow":"用了一个月，每天早上一杯，打完加点水空转一下就干净了。"},{"nick":"o***a","stars":5,"ago":"10月23日","color":"拉丝银","text":"打坚果酱一点不卡，比我以前那台强太多了。"},{"nick":"小**酱","stars":4,"ago":"3 天前","color":"经典黑","text":"效果没话说，就是声音像飞机起飞，早上打要关好厨房门。"},{"nick":"宝宝辅食","stars":5,"ago":"上周","color":"石板灰","text":"给宝宝打肉泥和菜泥，打得特别细，一点颗粒都没有。"},{"nick":"j***p","stars":3,"ago":"10月22日","color":"酒红色","text":"机器很好，但太高了，放不进吊柜下面，只能摆在台面角落。"}]},"balmuda":{"desc":"Balmudo 蒸汽烤面包机在烤之前往小水口倒 5 毫升水，蒸汽先在面包表面锁住水分，再用精准控温烤出焦脆的外壳。吐司烤出来外脆里软，隔夜的面包也能找回刚出炉的味道。方方正正的机身放在厨房里很耐看。","points":["5ml 水蒸汽烤","外脆里软","隔夜面包也复活"],"specs":[["功率","1300W"],["模式","吐司、奶酪吐司、法棍、点心、经典"],["温度","170°C 至 250°C"],["容量","可放 2 片吐司"],["尺寸","约 36 × 32 × 21 厘米"]],"colors":[["黑色","#2F2F33"],["白色","#EFEEEA"],["米灰色","#C9C2B4"]],"reviews":[{"nick":"早餐吐司控","stars":5,"ago":"10月6日","color":"黑色","text":"倒一小杯水进去，吐司外面脆、里面软，像刚从面包店买回来。","follow":"一个月下来，每天早上烤两片，厨房里总是香的。"},{"nick":"m***r","stars":5,"ago":"昨天","color":"白色","text":"白色很干净，放在厨房像个小家电模型。"},{"nick":"小**包","stars":4,"ago":"10月18日","color":"米灰色","text":"效果很好，但一次只能放两片吐司，一家四口早上要排队。"},{"nick":"隔夜面包拯救者","stars":5,"ago":"3 天前","color":"黑色","text":"隔夜的可颂放进去烤三分钟，又酥回来了。"},{"nick":"q**6","stars":4,"ago":"10月18日","color":"黑色","text":"旋钮转起来有种老物件的声音，很可爱。就是没有预约，要守在旁边。"}]},"mixer":{"desc":"KitchenAiid 厨师机是一台立式搅拌机，行星式搅拌让搅拌头一边自转一边绕着碗转，揉面、打发蛋白、拌饼干面糊都很均匀。5 升不锈钢碗一次能和一公斤面粉。十档调速，粉色机身往台面上一放，烘焙梦就开始了。","points":["行星式搅拌均匀","5 升大碗","十档调速"],"specs":[["碗容量","5 升不锈钢碗"],["功率","约 300W"],["档位","10 档"],["配件","揉面钩、打蛋器、扁平搅拌桨"],["重量","约 10 公斤"]],"colors":[["樱花粉","#E8B4B8"],["奶油色","#EFE5CC"],["帝国红","#B32630"],["开心果绿","#B9CFA0"]],"reviews":[{"nick":"周末烘焙","stars":5,"ago":"10月4日","color":"樱花粉","text":"揉十分钟面就出了手套膜，以前手揉要半小时。","follow":"一个月做了六次面包，手臂终于不酸了。"},{"nick":"y***x","stars":5,"ago":"6 天前","color":"奶油色","text":"奶油色太好看了，厨房的颜值一下就上去了。"},{"nick":"小**蛋","stars":4,"ago":"上周","color":"帝国红","text":"很好用，就是十公斤太重，搬上搬下不现实，只能一直摆在台面上。"},{"nick":"甜品店学徒","stars":5,"ago":"5 天前","color":"开心果绿","text":"打发蛋白两分钟就能打到硬性发泡，做戚风很稳。"},{"nick":"i***k","stars":4,"ago":"10月25日","color":"樱花粉","text":"高速档声音有点大，一开机家里的猫就躲起来。","follow":"后来猫习惯了，现在会蹲在旁边看我打蛋白。"}]},"sofa":{"desc":"IKEO 双人沙发是一张坐深够深的布艺沙发，坐垫软中带弹，盘着腿窝在上面看电影刚刚好。沙发套可以拆下来机洗，打翻了饮料也不用慌。灰绿色很耐看，配原木家具和白墙都和谐，小客厅也放得下。","points":["坐深够深能盘腿","沙发套可拆洗","小客厅放得下"],"specs":[["尺 const HR=3600e3, DAY=24*HR, COOL=7*DAY, ACCEL=720;
const SPEEDS={flash:{name:"闪电达",sub:"1 分钟",ms:60e3},today:{name:"当日达",sub:"2 小时",ms:2*HR},std:{name:"标准",sub:"2 天",ms:2*DAY}};

const now=()=>Date.now();
const dur=o=>{const ms=SPEEDS[o.speed].ms;return (S.fast&&o.speed!=="flash")?Math.max(30e3,ms/ACCEL):ms};
const prog=o=>Math.min(1,Math.max(0,(now()-o.placedAt)/dur(o)));
const coolDur=()=>S.fast?COOL/ACCEL:COOL;
const coolLeft=x=>x.at+coolDur()-now();
const pad=n=>String(n).padStart(2,"0");
function fmtDur(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;
 if(d)return `${d} 天 ${h} 时`; if(h)return `${h} 时 ${m} 分`; if(m)return `${m} 分 ${sec} 秒`; return `${sec} 秒`;}
function whenText(t){const d=new Date(t),n=new Date(),hm=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
 const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(); const diff=Math.round((day(d)-day(n))/DAY);
 if(diff===0)return "今天 "+hm; if(diff===1)return "明天 "+hm; return `${d.getMonth()+1}月${d.getDate()}日 ${hm}`;}
const fmt=n=>n.toLocaleString("zh-CN");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- elements ---------- */
const $=id=>document.getElementById(id);
const view=$("view"),sheetWrap=$("sheetWrap"),sheet=$("sheet");

function renderChips(){$("chips").innerHTML=CATS.map(c=>`<button class="chip-btn" data-cat="${c}" aria-pressed="${c===cat}">${c}</button>`).join("");}
function renderTabs(){
 const n=S.cart.reduce((a,i)=>a+i.qty,0), ready=S.orders.filter(o=>prog(o)>=1&&!o.unboxed).length;
 const T=[["shop","逛逛",0],["cart","购物车",n],["track","快递",ready],["me","我的",0]];
 $("tabs").innerHTML=T.map(([k,l,b])=>`<button class="tab" data-tab="${k}" ${tab===k?'aria-current="page"':""}><svg viewBox="0 0 24 24">${ICON[k]}</svg>${l}${b?`<span class="badge">${b}</span>`:""}</button>`).join("");
 $("savedPill").textContent="¥"+fmt(S.saved);
}

/* shop */
function shopList(){const k=q.trim().toLowerCase();return P.filter(p=>(cat==="全部"||p.cat===cat)&&(!k||(p.name+p.blurb+p.real+p.desc).toLowerCase().includes(k)));}
function card(p){return `<button class="card" data-open="${p.id}"><div class="art">${art(p,0)}${p.was?'<span class="flag">返场</span>':""}${p.colors.length>1?`<span class="dots-c">${p.colors.slice(0,4).map(c=>`<i style="background:${c[1]}"></i>`).join("")}</span>`:""}</div><div class="nm">${esc(p.name)}</div><div class="row"><span class="tag"><small>¥</small>${fmt(p.price)}</span>${p.was?`<s>¥${fmt(p.was)}</s>`:""}</div><div class="meta">${p.sold} 人买过</div></button>`;}
function renderShop(){const l=shopList();view.innerHTML=l.length?`<div class="count">${cat==="全部"&&!q?"":esc(cat)+" · "}${l.length} 件</div><div class="grid">${l.map(card).join("")}</div>`:`<div class="none">没找到，换个词试试</div>`;}

/* cart */
const EMPTY=`<svg viewBox="0 0 160 120" aria-hidden="true"><path d="M20 50 L80 30 L140 50 L80 70 Z" class="krd"/><path d="M20 50 L80 70 V112 L20 92 Z" class="kr"/><path d="M140 50 L80 70 V112 L140 92 Z" class="kr" opacity=".85"/><path d="M20 50 L4 70 L64 90 L80 70 Z" class="kr"/><path d="M140 50 L156 70 L96 90 L80 70 Z" class="kr" opacity=".85"/></svg>`;
function renderCart(){
 if(!S.cart.length){view.innerHTML=`<h2 class="sec-title">购物车</h2><div class="empty">${EMPTY}<div>空空的</div><button class="btn sm" data-tab="shop">去逛逛</button></div>`;return;}
 const total=S.cart.reduce((a,i)=>a+BY[i.id].price*i.qty,0);
 view.innerHTML=`<h2 class="sec-title">购物车</h2>${S.cart.map((i,k)=>{const p=BY[i.id];return `<div class="line"><div class="art" data-open="${p.id}" style="cursor:pointer">${art(p,i.ci)}</div><div><div class="nm">${esc(p.name)}</div><div class="meta">${esc(colorName(p,i.ci))}</div><span class="tag"><small>¥</small>${fmt(p.price)}</span></div><div class="step"><button data-dec="${k}" aria-label="减一件">−</button><span>${i.qty}</span><button data-inc="${k}" aria-label="加一件">+</button></div></div>`}).join("")}
 <div class="sum"><div><div class="label">合计</div><div class="total">¥${fmt(total)}</div></div><button class="btn" style="flex:none" data-checkout="cart">去结算</button></div>`;
}

/* track */
function stageOf(p){let c=0;STAGES.forEach((s,i)=>{if(p>=s.t)c=i});return c;}
function parcel(o){
 const p=prog(o),c=stageOf(p),done=p>=1;
 const st=!done?`<span class="st go">${STAGES[c].label}</span>`:o.unboxed?`<span class="st">已拆箱</span>`:`<span class="st done">待拆箱</span>`;
 return `<article class="parcel" data-no="${o.no}"><div class="p-head"><span class="no">${o.no}</span>${o.demo?'<span class="demo">示例</span>':""}${st}</div>
 <div class="thumbs">${o.items.map(i=>`<div class="art">${art(BY[i.id],i.ci)}</div>`).join("")}</div>
 <div class="bar"><i style="width:${p*100}%"></i><b class="truck" style="left:${p*100}%">${TRUCK}</b></div>
 <ol class="stages">${STAGES.map((s,i)=>`<li class="${i<=c?"done":""}">${s.label}</li>`).join("")}</ol>
 <p class="where">${whereText(o)}</p>
 ${done&&!o.unboxed?`<button class="btn wide" data-unbox="${o.no}">拆箱</button>`:""}</article>`;
}
function whereText(o){const p=prog(o),c=stageOf(p);return p<1?`<b>${STAGES[c].place}</b> · 还要 ${fmtDur(o.placedAt+dur(o)-now())}`:o.unboxed?`已收进家当`:`<b>到门口了</b> · 去拆吧`;}
function renderTrack(){view.innerHTML=`<h2 class="sec-title">快递</h2>`+(S.orders.length?S.orders.map(parcel).join(""):`<div class="empty">${EMPTY}<div>还没有包裹</div><button class="btn sm" data-tab="shop">去逛逛</button></div>`);}

/* me */
function jarSvg(){const lv=S.saved<=0?0:Math.max(.08,Math.min(1,Math.log10(S.saved)/6)),h=Math.round(72*lv);let edges="";for(let y=104;y>104-h;y-=8)edges+=`<ellipse cx="48" cy="${y}" rx="27" ry="3" class="coin-edge"/>`;
 return `<svg viewBox="0 0 96 112" aria-hidden="true"><defs><clipPath id="jc"><path d="M20 26 h56 v70 a10 10 0 0 1 -10 10 h-36 a10 10 0 0 1 -10 -10z"/></clipPath></defs><rect x="24" y="6" width="48" height="13" rx="4" class="lidc"/><path d="M18 22 h60 v74 a12 12 0 0 1 -12 12 h-36 a12 12 0 0 1 -12 -12z" class="glass"/><g clip-path="url(#jc)"><rect x="18" y="${108-h}" width="60" height="${h}" class="coins"/>${edges}</g></svg>`;}
function ownCard(x,i){const p=BY[x.id],left=coolLeft(x),f=Math.min(1,1-left/coolDur());
 const tail=x.enough?`<div class="keep">有这个就够了</div>`:left>0?`<div class="cool"><span>冷静中</span><b data-cool="${i}">${fmtDur(left)}</b></div><div class="coolbar"><i data-coolbar="${i}" style="width:${f*100}%"></i></div>`:`<button class="btn sm" data-real="${i}">还想要真的？</button>`;
 return `<div class="own"><div class="art" data-open="${p.id}" style="cursor:pointer">${art(p,x.ci)}</div><div class="nm">${esc(p.name)}${x.qty>1?` ×${x.qty}`:""}</div>${x.demo?'<span class="demo" style="align-self:flex-start">示例</span>':""}${tail}</div>`;}
function renderMe(){
 view.innerHTML=`<h2 class="sec-title">我的</h2>
 <section class="jar">${jarSvg()}<div><div class="label">一共省下</div><div class="big">¥${fmt(S.saved)}</div><div class="subline">下单 ${S.orders.length} 次 · 拆箱 ${S.unboxCount} 个</div></div></section>
 <h3>家当 <small>${S.owned.reduce((a,x)=>a+x.qty,0)} 件</small></h3>
 <p class="hint">到手七天还惦记，再去买真的。</p>
 ${S.owned.length?`<div class="owned">${S.owned.map(ownCard).join("")}</div>`:`<div class="none">拆了箱的东西会摆在这里</div>`}
 <h3>设置</h3>
 <div class="setrow"><div><b>体验模式</b><p>时间快 720 倍，快递几分钟到，冷静期十几分钟满</p></div><button class="sw" role="switch" aria-checked="${S.fast}" aria-label="体验模式" data-fast></button></div>
 <button class="btn ghost wide reset" data-reset>${resetArm?"再点一次，全部清空":"清空重来"}</button>`;
}

/* ---------- views ---------- */
function sig(){return tab+"|"+S.fast+"|"+S.orders.map(o=>o.no+(prog(o)>=1?1:0)+(o.unboxed?1:0)).join()+"|"+S.owned.map(x=>(coolLeft(x)>0?0:1)+(x.enough?1:0)).join();}
function render(){
 $("shopTools").hidden=tab!=="shop";
 if(tab==="shop")renderShop(); else if(tab==="cart")renderCart(); else if(tab==="track")renderTrack(); else renderMe();
 renderTabs(); lastSig=sig();
}
function live(){
 if(tab==="track"){S.orders.forEach(o=>{const el=view.querySelector(`[data-no="${o.no}"]`);if(!el)return;const p=prog(o),c=stageOf(p);
  el.querySelector(".bar i").style.width=p*100+"%";el.querySelector(".truck").style.left=p*100+"%";
  el.querySelectorAll(".stages li").forEach((li,i)=>li.classList.toggle("done",i<=c));el.querySelector(".where").innerHTML=whereText(o);});}
 if(tab==="me"){S.owned.forEach((x,i)=>{const b=view.querySelector(`[data-cool="${i}"]`),bar=view.querySelector(`[data-coolbar="${i}"]`);if(b)b.textContent=fmtDur(coolLeft(x));if(bar)bar.style.width=Math.min(1,1-coolLeft(x)/coolDur())*100+"%";});}
}
function setTab(t){tab=t;window.scrollTo(0,0);render();}

/* ---------- sheets ---------- */
function setSheet(body,foot,keepScroll){const old=sheet.querySelector(".sh-body"),top=keepScroll&&old?old.scrollTop:0;
 sheet.innerHTML=`<div class="sh-body${foot?" has-foot":""}"><div class="grab"></div>${body}</div>${foot?`<div class="sh-foot">${foot}</div>`:""}`;
 const nb=sheet.querySelector(".sh-body");nb.scrollTop=top;}
function openSheet(body,foot){setSheet(body,foot);sheetWrap.hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>sheetWrap.classList.add("show")));setTimeout(()=>sheet.focus({preventScroll:true}),60);}
function closeSheet(){sheetWrap.classList.remove("show");setTimeout(()=>{sheetWrap.hidden=true;sheet.innerHTML="";},300);chk=null;cur=null;}
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1800);}

function compareSet(p){let g=P.filter(x=>x.group===p.group&&x.id!==p.id);if(!g.length)g=P.filter(x=>x.cat===p.cat&&x.id!==p.id).sort((a,b)=>Math.abs(a.price-p.price)-Math.abs(b.price-p.price)).slice(0,2);return g.slice(0,3);}
const AVC=["#E2793A","#3D7BE0","#169E70","#B36AD6","#EE3F6B","#C79661","#2F8F9D","#7A6CE0"];
function stars(n){return `<span class="stars" aria-label="${n} 星">${"★".repeat(n)}<b>${"★".repeat(5-n)}</b></span>`;}
function review(r){const h=[...r.nick].reduce((a,ch)=>a+ch.charCodeAt(0),0);
 return `<div class="rv"><div class="av" style="background:${AVC[h%AVC.length]}">${esc([...r.nick][0]||"客")}</div><div><div class="rv-top"><b>${esc(r.nick)}</b>${stars(r.stars)}</div><div class="rv-meta">${esc(r.ago||"")}${r.color?" · "+esc(r.color):""}</div><p>${esc(r.text)}</p>${r.follow?`<div class="follow"><em>追评</em>${esc(r.follow)}</div>`:""}</div></div>`;}
function productBody(){const p=BY[cur.id],ci=cur.ci,o=compareSet(p),sl=slides(p,ci);
 const row=(x,me)=>{const d=x.price-p.price;return `<tr class="${me?"me":""}" ${me?"":`data-open="${x.id}"`}><td>${esc(x.name)}</td><td class="n">¥${fmt(x.price)}${me?"":`<span class="d ${d>0?"up":"down"}">${d>0?"贵":"省"} ¥${fmt(Math.abs(d))}</span>`}</td><td class="n">★ ${x.rating.toFixed(1)}</td><td class="n">${x.sold}</td></tr>`};
 return `<div class="gal" id="gal">${sl.map(([lab,svg])=>`<div class="slide">${svg}<span class="lab">${lab}</span></div>`).join("")}</div>
 <div class="gdots" id="gdots">${sl.map((_,i)=>`<i class="${i===0?"on":""}"></i>`).join("")}</div>
 <h2>${esc(p.name)}</h2><p class="blurb">${esc(p.blurb)} · ★ ${p.rating.toFixed(1)} · ${p.sold} 人买过</p>
 <div class="pricebar"><span class="tag big"><small>¥</small>${fmt(p.price)}</span>${p.was?`<s>¥${fmt(p.was)}</s><span class="flag" style="position:static">返场价</span>`:""}</div>
 ${p.colors.length>1?`<div class="swatches"><span>颜色：${esc(colorName(p,ci))}</span>${p.colors.map((c,i)=>`<button class="swc" style="background:${c[1]}" data-ci="${i}" aria-pressed="${i===ci}" aria-label="${esc(c[0])}"></button>`).join("")}</div>`:""}
 <h3>详情</h3><p class="desc">${esc(p.desc)}</p>${p.points.length?`<ul class="points">${p.points.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}
 ${p.specs.length?`<h3>参数</h3><table class="specs"><tbody>${p.specs.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</tbody></table>`:""}
 <h3>比一比</h3><div class="cmp-wrap"><table class="cmp"><thead><tr><th>商品</th><th>价格</th><th>评分</th><th>买过</th></tr></thead><tbody>${row(p,true)}${o.map(x=>row(x,false)).join("")}</tbody></table></div>
 ${p.reviews.length?`<h3>买家评价 <small>${p.sold} 条</small></h3><div class="rv-head"><div class="rv-score">${p.rating.toFixed(1)}</div><div>${stars(Math.round(p.rating))}<div class="rv-note">评价为虚构，商品名均为谐音</div></div></div>${p.reviews.map(review).join("")}`:""}`;}
const productFoot=()=>`<button class="btn ghost" data-add>加入购物车</button><button class="btn" data-buy>立即买</button>`;
function wireGallery(){const g=$("gal"),d=$("gdots");if(!g||!d)return;g.addEventListener("scroll",()=>{const i=Math.round(g.scrollLeft/g.clientWidth);d.querySelectorAll("i").forEach((x,k)=>x.classList.toggle("on",k===i));},{passive:true});}
function openProduct(id){cur={id,ci:0};openSheet(productBody(),productFoot());wireGallery();}
function pickColor(ci){if(!cur)return;cur.ci=ci;setSheet(productBody(),productFoot(),true);wireGallery();}

function checkoutBody(){const total=chk.items.reduce((a,i)=>a+BY[i.id].price*i.qty,0);
 return `<h2>结算</h2><ul class="mini">${chk.items.map(i=>`<li><span>${esc(BY[i.id].name)}${i.qty>1?` ×${i.qty}`:""} <small>${esc(colorName(BY[i.id],i.ci))}</small></span><span>¥${fmt(BY[i.id].price*i.qty)}</span></li>`).join("")}</ul>
 <h3>怎么送</h3><div class="opts" role="radiogroup" aria-label="配送方式">${Object.entries(SPEEDS).map(([k,v])=>`<button class="opt" role="radio" aria-checked="${chk.speed===k}" data-speed="${k}"><b>${v.name}</b><small>${v.sub}</small></button>`).join("")}</div>
 <div class="pay"><div class="cardface" id="cardface"><div class="t">过家家卡<b>∞</b></div><div><div class="num">6222 •••• •••• 1111</div><div class="lim">额度无限 · 不扣一分钱</div></div></div><div class="reader" id="reader"><span>刷这里</span><i></i></div></div>
 <p class="fine">不收真卡号，也不花真钱</p>`;}
const checkoutFoot=()=>{const total=chk.items.reduce((a,i)=>a+BY[i.id].price*i.qty,0);return `<button class="btn wide" id="payBtn" data-pay>刷卡 ¥${fmt(total)}</button>`;};
function openCheckout(items,fromCart){chk={items,fromCart,speed:chk&&chk.speed||"today"};openSheet(checkoutBody(),checkoutFoot());}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=1320;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.12,a.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.16);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.18);setTimeout(()=>a.close(),400);}catch(e){}}
function pay(){const btn=$("payBtn");if(!btn||btn.disabled)return;btn.disabled=true;
 const c=chk;$("cardface").classList.add("swipe");
 setTimeout(()=>{beep();const r=$("reader");if(r)r.classList.add("ok");},430);
 setTimeout(()=>{const t=now(),d=new Date(t),total=c.items.reduce((a,i)=>a+BY[i.id].price*i.qty,0);
  const o={no:`GJJ${String(d.getFullYear()).slice(2)}${pad(d.getMonth()+1)}${pad(d.getDate())}${Math.floor(1000+Math.random()*9000)}`,items:c.items.map(i=>({id:i.id,qty:i.qty,ci:i.ci||0})),total,speed:c.speed,placedAt:t,unboxed:false};
  S.orders.unshift(o);S.saved+=total;if(c.fromCart)S.cart=[];save();renderTabs();if(tab!=="shop")render();
  setSheet(`<div class="ok-title">刷好了</div><div class="receipt">
  <div class="r-row"><span>订单号</span><b>${o.no}</b></div><div class="r-row"><span>标价</span><b>¥${fmt(total)}</b></div><div class="r-row"><span>实付</span><b>¥0</b></div>
  <div class="r-row big"><span>又省下</span><b>¥${fmt(total)}</b></div><div class="r-row"><span>${SPEEDS[o.speed].name} · 预计</span><b>${whenText(t+dur(o))}</b></div></div>`,
  `<button class="btn ghost" data-close>接着逛</button><button class="btn" data-go="track">看快递</button>`);chk=null;},1000);}

function openUnbox(no){const o=S.orders.find(x=>x.no===no);if(!o)return;
 openSheet(`<h2 style="text-align:center">包裹到了</h2><div class="stage" id="stage"><div class="glow"></div><div class="pop ${o.items.length>1?"many":""}">${o.items.slice(0,3).map(i=>art(BY[i.id],i.ci)).join("")}</div><div class="boxf">${BOX}</div><div class="lid">${LID}</div></div>
 <div class="unbox-before"><button class="btn wide" data-dounbox="${no}">拆！</button></div>
 <div class="unbox-after" hidden><p>${o.items.map(i=>esc(BY[i.id].name)+(i.qty>1?` ×${i.qty}`:"")).join("、")}</p><button class="btn wide" data-keep="${no}">收进家当</button></div>`);}
function doUnbox(){const st=$("stage");if(!st||st.classList.contains("open"))return;st.classList.add("open");sheet.querySelector(".unbox-before").hidden=true;
 const rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;setTimeout(()=>{const a=sheet.querySelector(".unbox-after");if(a)a.hidden=false;},rm?0:1000);}
function keep(no){const o=S.orders.find(x=>x.no===no);if(!o||o.unboxed)return;o.unboxed=true;S.unboxCount++;const t=now();
 o.items.forEach(i=>S.owned.unshift({id:i.id,qty:i.qty,ci:i.ci||0,at:t}));save();closeSheet();toast("收进家当了");render();}

function openReal(i){const x=S.owned[i];if(!x)return;const p=BY[x.id],code="GJJ-"+Math.random().toString(36).slice(2,6).toUpperCase();
 openSheet(`<div class="sh-art">${art(p,x.ci)}</div><h2>冷静了七天，还惦记</h2><p class="blurb">那就是真喜欢。真货叫 ${esc(p.real)}。</p>
 <div class="coupon"><span class="pct">9折</span><b>${code}</b><small>示例券，将来由商家出</small></div>`,
 `<button class="btn ghost" data-enough="${i}">有这个就够</button><a class="btn" href="https://www.amazon.com/s?k=${encodeURIComponent(p.real)}" target="_blank" rel="noopener">去看真的</a>`);}

function addToCart(id,ci){const c=S.cart.find(i=>i.id===id&&(i.ci||0)===ci);c?c.qty++:S.cart.push({id,qty:1,ci});save();renderTabs();}

/* ---------- actions ---------- */
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-open],[data-add],[data-buy],[data-close],[data-tab],[data-cat],[data-inc],[data-dec],[data-checkout],[data-speed],[data-pay],[data-go],[data-unbox],[data-dounbox],[data-keep],[data-real],[data-enough],[data-fast],[data-reset],[data-ci]");
 if(!t)return;const d=t.dataset;
 if(d.open){openProduct(d.open);}
 else if(d.ci!==undefined){pickColor(+d.ci);}
 else if("add" in d){if(cur){addToCart(cur.id,cur.ci);closeSheet();toast("放进购物车了");}}
 else if("buy" in d){if(cur)openCheckout([{id:cur.id,qty:1,ci:cur.ci}],false);}
 else if("close" in d){closeSheet();}
 else if(d.tab){setTab(d.tab);}
 else if(d.cat){cat=d.cat;renderChips();renderShop();}
 else if(d.inc!==undefined){const c=S.cart[+d.inc];if(c)c.qty++;save();render();}
 else if(d.dec!==undefined){const c=S.cart[+d.dec];if(c){c.qty--;if(c.qty<=0)S.cart.splice(+d.dec,1);}save();render();}
 else if(d.checkout){if(S.cart.length)openCheckout(S.cart.map(i=>({...i})),true);}
 else if(d.speed){if(chk){chk.speed=d.speed;setSheet(checkoutBody(),checkoutFoot(),true);}}
 else if("pay" in d){pay();}
 else if(d.go){closeSheet();setTab(d.go);}
 else if(d.unbox){openUnbox(d.unbox);}
 else if(d.dounbox){doUnbox();}
 else if(d.keep){keep(d.keep);}
 else if(d.real!==undefined){openReal(+d.real);}
 else if(d.enough!==undefined){const x=S.owned[+d.enough];if(x)x.enough=true;save();closeSheet();render();}
 else if("fast" in d){S.fast=!S.fast;save();render();toast(S.fast?"体验模式开了":"回到真实时间");}
 else if("reset" in d){if(!resetArm){resetArm=true;render();setTimeout(()=>{if(resetArm){resetArm=false;if(tab==="me")render();}},4000);}else{resetArm=false;S=fresh();save();render();toast("清空了，重新开始");}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheetWrap.hidden)closeSheet();});
$("q").addEventListener("input",e=>{q=e.target.value;renderShop();});

renderChips();render();
function fromHash(){const h=decodeURIComponent(location.hash.slice(1));if(BY[h])openProduct(h);}
window.addEventListener("hashchange",fromHash);fromHash();
setInterval(()=>{const s=sig();if(s!==lastSig){if(tab!=="shop")render();else{renderTabs();lastSig=s;}}else live();},1000);
})();
</script>
