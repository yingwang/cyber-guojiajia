<title>赛博过家家</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout, phones: one column. Sticky shop header (search + aisles), a two-up shelf of toy-tagged goods,
   a fixed four-tab bar, and bottom sheets (scrolling body + pinned footer) for product, checkout, unboxing.
   Layout, 900px and wider (see the media block at the end): one top bar holding logo, search and the menu,
   a four- or five-up shelf, two-column product, cart and profile pages, and sheets shown as centred dialogs.
   Kraft parcels and yellow price tags carry the identity. */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --tile:#E1E7F1; --ink:#17203A; --muted:#5C6684; --line:#D2D9E6;
  --accent:#0B7F86; --accent-ink:#FFFFFF; --tag:#FFC93A; --tag-ink:#2B2100; --kraft:#C79661; --kraft-dark:#9A6E3E; --ok:#169E70;
  --soft:#F4F6FA; --scrim:rgba(10,14,24,.45);
  --f-display:"ZCOOL KuaiLe","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-num:"Space Grotesk","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131D; --surface:#181E2D; --tile:#222A3D; --ink:#ECEFF7; --muted:#98A1BB; --line:#2B3349;
  --accent:#3CC4C4; --accent-ink:#062A2C; --tag:#FFD153; --tag-ink:#2B2100; --kraft:#B78852; --kraft-dark:#8B6236; --ok:#31BE8C;
  --soft:#1E2536; --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F131D; --surface:#181E2D; --tile:#222A3D; --ink:#ECEFF7; --muted:#98A1BB; --line:#2B3349;
  --accent:#3CC4C4; --accent-ink:#062A2C; --tag:#FFD153; --tag-ink:#2B2100; --kraft:#B78852; --kraft-dark:#8B6236; --ok:#31BE8C;
  --soft:#1E2536; --scrim:rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-size:28px;line-height:1;letter-spacing:1px}
.logo i{font-style:normal;color:var(--accent)}
.saved-pill{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}
.saved-pill b{font-family:var(--f-num);color:var(--ink);font-size:13px;margin-left:4px}
.search{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.search:focus-within{border-color:var(--accent)}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{border:0;outline:0;background:transparent;color:var(--ink);font:inherit;flex:1;min-width:0;height:100%}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-btn{flex:none;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 14px;font-size:14px}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* shelf */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;padding-top:6px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:18px}
.art{aspect-ratio:1;max-width:100%;background:var(--tile);border-radius:18px;display:grid;place-items:center;overflow:hidden;position:relative}
.art svg{width:76%;height:76%}
.art img.ph{width:100%;height:100%;object-fit:cover;display:block}
.flag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 7px}
.dots-c{position:absolute;right:8px;bottom:8px;display:flex;gap:3px}
.dots-c i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--surface)}
.nm{font-size:14px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{position:relative;display:inline-flex;align-items:baseline;background:var(--tag);color:var(--tag-ink);font-family:var(--f-num);font-weight:700;font-size:16px;line-height:1.3;padding:2px 10px 2px 17px;border-radius:4px 9px 9px 4px;font-variant-numeric:tabular-nums}
.tag::before{content:"";position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--bg)}
.sheet .tag::before{background:var(--surface)}
.tag small{font-size:11px;font-weight:500;margin-right:1px}
.tag.big{font-size:24px;padding:4px 14px 4px 22px}
.tag.big::before{left:8px;width:8px;height:8px;margin-top:-4px}
s{color:var(--muted);font-family:var(--f-num);font-size:12px}
.meta{font-size:12px;color:var(--muted)}
.none{padding:48px 0;text-align:center;color:var(--muted)}
.count{font-size:12px;color:var(--muted);margin:2px 0 8px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0;font-size:12px;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] svg{stroke:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-num);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* sheets: scrolling body + optional pinned footer */
.sheet-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.sheet{position:relative;width:100%;max-width:520px;max-height:92%;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;overflow:hidden;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);outline:none}
.sheet-wrap.show .scrim{opacity:1}
.sheet-wrap.show .sheet{transform:none}
.sh-body{flex:1 1 auto;min-height:0;overflow:auto;padding-block:10px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sh-body.has-foot{padding-block:10px 18px}
.sh-foot{flex:none;display:flex;gap:10px;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sh-art{background:var(--tile);border-radius:20px;aspect-ratio:16/10;max-width:100%;display:grid;place-items:center}
.sh-art svg{height:82%;width:auto;max-width:100%}
h2{font-family:var(--f-display);font-weight:400;font-size:25px;line-height:1.25;margin:14px 0 4px;text-wrap:balance}
h3{font-size:16px;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
h3 small{font-weight:400;color:var(--muted);font-size:13px}
.blurb{margin:0;color:var(--muted)}
.pricebar{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}

/* gallery */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:20px;background:var(--tile);scrollbar-width:none;overscroll-behavior-x:contain}
.gal::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/10;max-width:100%;position:relative}
.slide>svg{display:block;width:100%;height:100%}
.slide{overflow:hidden}
.slide>img{display:block;width:100%;height:100%;object-fit:cover}
.slide>img.zoom{transform:scale(2.2)}
.slide .lab{position:absolute;left:10px;bottom:10px;font-size:11px;background:var(--surface);color:var(--muted);border-radius:6px;padding:1px 8px}
.gdots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.gdots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s,background .2s}
.gdots i.on{width:16px;background:var(--ink)}
.sc-wall{fill:var(--tile)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.swatches span{font-size:13px;color:var(--muted);margin-right:4px}
.swc{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.swc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.swc:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* details */
.desc{margin:0;line-height:1.75}
.points{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.points li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.points li::before{content:"✓";flex:none;width:18px;height:18px;margin-top:2px;border-radius:50%;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);font-size:11px;font-weight:700;display:grid;place-items:center}
table.specs{width:100%;border-collapse:collapse;font-size:14px}
.specs th{width:34%;text-align:left;font-weight:400;color:var(--muted);padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.specs td{padding:8px 0;border-bottom:1px solid var(--line)}

/* compare */
.cmp-wrap{overflow-x:auto}
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th{font-weight:500;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.cmp td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.cmp tr.me td{background:var(--tile)}
.cmp tr.me td:first-child{border-radius:10px 0 0 10px}
.cmp tr.me td:last-child{border-radius:0 10px 10px 0}
.cmp tr[data-open]{cursor:pointer}
.cmp .d{display:block;font-size:11px}
.cmp .up{color:var(--accent)}
.cmp .down{color:var(--ok)}

/* reviews */
.rv-head{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:12px 14px}
.rv-score{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1}
.stars{color:var(--tag);letter-spacing:1px;font-size:13px}
.stars b{color:var(--line);font-weight:400}
.rv-note{font-size:12px;color:var(--muted);margin-top:2px}
.rv{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:#FFFFFF}
.rv-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rv-top b{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-meta{font-size:12px;color:var(--muted)}
.rv p{margin:4px 0 0;font-size:14px;line-height:1.6}
.follow{margin-top:8px;background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.55}
.follow em{font-style:normal;color:var(--accent);font-weight:500;margin-right:4px}

.actions{display:flex;gap:10px;margin-top:20px}
.btn{appearance:none;border:0;cursor:pointer;font-weight:700;border-radius:14px;padding:11px 18px;background:var(--accent);color:var(--accent-ink);flex:1;text-align:center;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:46px;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px;border-radius:10px;flex:none}
.btn.wide{width:100%;flex:none}
.btn[disabled]{opacity:.6;cursor:default}
.btn:focus-visible,.chip-btn:focus-visible,.opt:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cart */
.line{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .art{border-radius:12px}
.line .nm{min-height:0}
.line .meta{margin:2px 0 4px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;font-size:18px}
.step span{min-width:22px;text-align:center;font-family:var(--f-num)}
.sum{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:14px 14px 14px 18px;background:var(--surface);border-radius:18px;border:1px solid var(--line)}
.sum .total{font-family:var(--f-num);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.sum .label{font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:56px 0 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.empty svg{width:120px;height:auto}

/* checkout */
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.mini li span:last-child{font-family:var(--f-num);white-space:nowrap}
.mini li small{color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.opt b{font-size:14px}
.opt small{color:var(--muted);font-size:12px}
.opt[aria-checked="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.pay{position:relative;height:168px;margin-top:18px}
.cardface{position:absolute;top:0;left:50%;margin-left:-110px;width:220px;height:134px;border-radius:16px;padding:14px 16px;color:#FFFFFF;background:linear-gradient(135deg,#0B7F86,#3FB6C2);display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px rgba(23,32,58,.18);z-index:1}
.cardface .t{display:flex;justify-content:space-between;align-items:flex-start;font-family:var(--f-display);font-size:18px}
.cardface .t b{font-family:var(--f-num);font-size:30px;line-height:.9}
.cardface .num{font-family:var(--f-num);letter-spacing:2px;font-size:15px}
.cardface .lim{font-size:11px;opacity:.9}
.cardface.swipe{animation:swipe .95s ease-in-out}
@keyframes swipe{0%{transform:translateY(0)}45%{transform:translateY(62px)}100%{transform:translateY(0)}}
.reader{position:absolute;bottom:0;left:50%;margin-left:-125px;width:250px;height:50px;background:var(--ink);border-radius:12px 12px 16px 16px;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--bg);font-size:12px}
.reader::before{content:"";position:absolute;top:7px;left:18px;right:18px;height:4px;border-radius:2px;background:var(--bg);opacity:.35}
.reader i{width:11px;height:11px;border-radius:50%;background:var(--tag);transition:background .2s,box-shadow .2s}
.reader.ok i{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.fine{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0}
.ok-title{font-family:var(--f-display);font-size:28px;text-align:center;margin:8px 0 12px}
.receipt{background:var(--bg);border-radius:14px 14px 0 0;padding:14px 16px 18px;position:relative;margin-bottom:16px}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:radial-gradient(circle at 7px 10px,var(--surface) 6px,var(--bg) 6.5px) 0 0/14px 10px repeat-x}
.r-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.r-row:last-child{border-bottom:0}
.r-row span{color:var(--muted)}
.r-row b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.r-row.big b{font-size:24px;font-weight:700;color:var(--accent)}

/* parcels */
.sec-title{font-family:var(--f-display);font-weight:400;font-size:22px;margin:10px 0 4px}
.parcel{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;overflow:hidden}
.parcel::before{content:"";position:absolute;top:0;bottom:0;right:28px;width:30px;background:var(--kraft);opacity:.16}
.p-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative}
.no{font-family:var(--f-num);font-size:13px;color:var(--muted);letter-spacing:.5px;margin-right:auto}
.st{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--tile)}
.st.go{background:var(--tag);color:var(--tag-ink)}
.st.done{background:var(--ok);color:var(--accent-ink)}
.demo{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:0 6px}
.thumbs{display:flex;gap:8px;margin:12px 0 0;position:relative}
.thumbs .art{width:56px;border-radius:12px}
.bar{position:relative;height:8px;border-radius:4px;background:var(--tile);margin:30px 0 8px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--kraft);transition:width 1s linear}
.truck{position:absolute;top:-24px;width:32px;height:22px;transform:translateX(-50%);transition:left 1s linear}
.truck svg{display:block;width:100%;height:100%}
.kr{fill:var(--kraft)} .krd{fill:var(--kraft-dark)} .tink{fill:var(--ink)} .tapef{fill:var(--tag);opacity:.9}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));font-size:11px;color:var(--muted);text-align:center}
.stages li.done{color:var(--ink);font-weight:500}
.where{font-size:13px;margin:10px 0 0;color:var(--muted);position:relative}
.where b{color:var(--ink);font-weight:500}
.parcel .btn{margin-top:12px;position:relative}

/* unboxing */
.stage{position:relative;height:236px;width:220px;margin:4px auto 0}
.boxf,.lid,.pop,.glow{position:absolute}
.boxf{left:30px;bottom:0;width:160px;height:110px;z-index:2}
.lid{left:22px;bottom:104px;width:176px;height:32px;z-index:3;transform-origin:20% 100%}
.pop{left:50%;bottom:24px;z-index:1;display:flex;gap:6px;transform:translate(-50%,40px) scale(.45);opacity:0}
.pop svg{width:104px;height:104px}
.pop.many svg{width:72px;height:72px}
.pop img.ph{width:104px;height:104px;object-fit:cover;border-radius:14px}
.pop.many img.ph{width:72px;height:72px}
.glow{left:50%;top:10px;width:180px;height:180px;margin-left:-90px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--tag) 55%,transparent),transparent 65%);opacity:0;transform:scale(.6)}
.stage.open .lid{transform:translate(-26px,-74px) rotate(-30deg);opacity:0;transition:transform .55s cubic-bezier(.3,.7,.3,1),opacity .4s .25s}
.stage.open .pop{transform:translate(-50%,-84px) scale(1);opacity:1;transition:transform .75s .25s cubic-bezier(.2,1.4,.4,1),opacity .3s .25s}
.stage.open .glow{opacity:1;transform:scale(1);transition:opacity .6s .35s,transform .9s .35s}
.unbox-after{text-align:center}

/* home */
.jar{display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:8px}
.jar svg{width:88px;height:auto}
.glass{fill:var(--tile);stroke:var(--line);stroke-width:2}
.coins{fill:var(--tag)} .coin-edge{fill:none;stroke:var(--tag-ink);stroke-opacity:.16;stroke-width:1.5} .lidc{fill:var(--kraft)}
.label{font-size:13px;color:var(--muted)}
.big{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.subline{font-size:13px;color:var(--muted);margin-top:4px}
.owned{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.own{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.own .art{border-radius:12px}
.own .nm{min-height:0;font-size:13px}
.cool{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.cool b{font-family:var(--f-num);color:var(--ink);font-weight:500;white-space:nowrap}
.coolbar{height:4px;background:var(--tile);border-radius:2px;overflow:hidden}
.coolbar i{display:block;height:100%;background:var(--ok);transition:width 1s linear}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.keep{font-size:12px;color:var(--ok)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.setrow p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.setrow+.setrow{margin-top:10px}
.sw{flex:none;cursor:pointer;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;border:0;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .2s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{left:23px}
.reset{margin-top:12px}
.coupon{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 14px;align-items:center;border:1.5px dashed var(--accent);border-radius:14px;padding:12px 16px;margin:16px 0}
.coupon .pct{grid-row:span 2;font-family:var(--f-display);font-size:32px;color:var(--accent);line-height:1}
.coupon b{font-family:var(--f-num);letter-spacing:1px}
.coupon small{color:var(--muted);font-size:12px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:40;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* product page */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;background:var(--bg);padding-block:10px}
.ptitle{flex:1;min-width:0;text-align:center;font-weight:500;color:var(--muted);font-size:14px}
.icon-btn{all:unset;cursor:pointer;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:1px solid var(--line);flex:none}
.icon-btn svg,.pf-ic svg,.like svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn svg{width:20px;height:20px}
.icon-btn:focus-visible,.pf-ic:focus-visible,.like:focus-visible,.ask:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[data-fav][aria-pressed="true"]{color:var(--accent)}
[data-fav][aria-pressed="true"] svg{fill:var(--accent)}
.tabs-in.pf{grid-template-columns:auto auto minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding-block:8px}
.pf-ic{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);padding:0 6px;position:relative;min-width:36px}
.pf-ic svg{width:22px;height:22px}
.pf .btn{min-height:44px;padding-inline:10px;font-size:14px}
.favmark{position:absolute;top:8px;right:8px;width:20px;height:20px;fill:var(--accent);stroke:var(--accent)}
.sec-head{display:flex;align-items:baseline;gap:8px;margin:26px 0 10px}
.sec-head h3{margin:0}
.sec-head .btn{margin-left:auto}
.sec-head .note{margin-left:auto;font-size:12px;color:var(--muted)}
.like{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:8px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-family:var(--f-num)}
.like svg{width:14px;height:14px}
.like[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.like[aria-pressed="true"] svg{fill:var(--accent)}
.mine{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 5px;margin-left:6px;font-weight:400}
.rv-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.del{all:unset;cursor:pointer;font-size:12px;color:var(--muted);margin-top:8px}
.qa{padding:12px 0;border-bottom:1px solid var(--line)}
.qa:last-child{border-bottom:0}
.qa-q{display:flex;gap:8px;font-weight:500;font-size:14px}
.qa-q i,.qa-a i{font-style:normal;flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700}
.qa-q i{background:var(--tag);color:var(--tag-ink)}
.qa-a{display:flex;gap:8px;font-size:13px;margin-top:8px;color:var(--ink)}
.qa-a i{background:var(--tile);color:var(--muted)}
.qa-a small{color:var(--muted)}
.qa-meta{font-size:12px;color:var(--muted);margin:4px 0 0 28px}
.qa-wait{font-size:12px;color:var(--muted);margin:6px 0 0 28px}
.ask{all:unset;cursor:pointer;font-size:12px;color:var(--accent);margin:6px 0 0 28px}
.starpick{display:flex;gap:8px;justify-content:center;margin:14px 0}
.starpick button{all:unset;cursor:pointer;font-size:34px;line-height:1;color:var(--line)}
.starpick button[aria-pressed="true"]{color:var(--tag)}
.field{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;padding:10px 12px;resize:vertical;display:block}

.minip{display:flex;gap:12px;align-items:center}
.minip .art{width:56px;border-radius:12px;flex:none}
.small-link{all:unset;cursor:pointer;font-size:12px;color:var(--accent)}
.field.one{min-height:0;height:46px;resize:none}
.rv-top .demo,.qa-meta .demo,.qa-meta .mine,.qa-a .mine{margin-left:6px;font-weight:400}
.del.in{margin:0 0 0 8px}
.like:disabled{cursor:default}
.board-note{font-size:12px;color:var(--muted);margin:10px 0 0}
.adm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:13px}

.adm .meta{font-size:12px;color:var(--muted)}
.adm .acts{display:flex;gap:14px}
.adm .acts .del{margin-top:4px}

/* pieces that only wide screens show */
[hidden]{display:none!important}
.hbar{display:contents}
.gthumbs,.pg-buy{display:none}

@media (min-width:900px){

  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 20px;padding-top:10px}

  .pbar{position:static;padding-block:6px 14px}
  .pbar .ptitle,.pbar [data-fav]{display:none}
  .pg-top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:44px;align-items:start}
  .pg-buybox h2{font-size:32px;margin-top:4px}

  .gthumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
  .gthumb{all:unset;cursor:pointer;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--tile);box-shadow:0 0 0 1.5px var(--line)}
  .gthumb.on{box-shadow:0 0 0 2px var(--accent)}
  .gthumb:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .gthumb>img,.gthumb>svg{display:block;width:100%;height:100%;object-fit:cover}

  .pg-buy{display:flex;align-items:center;margin-top:28px;max-width:440px}

  .pg-more{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start;margin-top:12px}

  .cartpg{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:36px;align-items:start}
  .cartpg .sum{margin-top:12px;position:sticky;top:96px;flex-direction:column;align-items:stretch;gap:16px;padding:20px}
  .line{grid-template-columns:88px minmax(0,1fr) auto;gap:16px;padding:16px 0}

  .mepg{display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-rows:auto 1fr;gap:0 44px;align-items:start}
  .mepg>.jar{grid-column:1;grid-row:1}
  .me-set{grid-column:1;grid-row:2}
  .me-main{grid-column:2;grid-row:1/3}
  .me-main>h3:first-child{margin-top:8px}
  .owned,.me-main .grid{grid-template-columns:repeat(4,minmax(0,1fr))}

  .sheet-wrap{align-items:center;padding:24px}
  .sheet{max-width:480px;max-height:min(100%,780px);border-radius:22px;transform:translateY(18px);opacity:0;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s}
  .sheet-wrap.show .sheet{opacity:1}
  .grab{display:none}
  .sh-body,.sh-body.has-foot{padding:22px 24px 20px}
  .sh-foot{padding:12px 24px 16px}
}
@media (min-width:1100px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}

}

喝了半瓶，剩下的塞好放冰箱，第二天更好喝。"},{"nick":"3***p","stars":5,"ago":"11月2日","text":"酒标很经典，摆在餐桌上，一顿家常晚饭也有了气氛。"}]},"dassai":{"desc":"獭际 纯米大吟酿 45 是一瓶把米磨掉一大半再酿的清酒，酒液清澈，闻着有蜜瓜和梨的果香。冰镇以后入口很滑，微微的甜，没有冲鼻的酒味。配刺身、寿司和清淡的菜很合适，适合平时不太喝酒、想找一瓶容易入口的人。","points":["蜜瓜和梨的果香","冰着喝最顺","配刺身寿司"],"specs":[["净含量","720ml"],["精米步合","45%"],["原料米","山田锦"],["酒精度","16% vol"],["保存","冷藏，开瓶后尽快喝完"]],"colors":[["720ml","#E9E6DC"]],"reviews":[{"nick":"寿司之夜","stars":5,"ago":"10月28日","text":"冰了一晚上，配三文鱼刺身，果香和鱼的甜味很合。"},{"nick":"i***c","stars":5,"ago":"3 天前","text":"第一次喝清酒，以为会很冲，结果像带一点米香的梨汁。"},{"nick":"小**盏","stars":4,"ago":"10月16日","text":"好喝，但一定要冰着，有次放到室温再喝，甜味变腻，香气也散了。"},{"nick":"闺蜜聚餐","stars":5,"ago":"上周","text":"四个人分一瓶，一人两小杯，配火锅也不违和。","follow":"瓶子洗干净拿来插花了。"},{"nick":"9**s","stars":5,"ago":"11月4日","text":"用高脚杯喝，香气比用小瓷杯明显。"}]},"perrier":{"desc":"Perriar 气泡水是一箱二十四瓶的含气矿泉水，绿色的小玻璃瓶，拧开盖子气很冲。气泡又大又密，喝一口舌头发麻，没有甜味。冰镇以后直接喝，或者加柠檬片、兑果汁都好，适合想少喝甜饮料的人。","points":["气泡又大又密","没有甜味","小玻璃瓶一次一瓶"],"specs":[["规格","330ml × 24 瓶"],["类型","含气天然矿泉水"],["口味","原味，无糖"],["包装","绿色玻璃瓶"],["产地","法国"]],"colors":[["原味","#2E8B57"]],"reviews":[{"nick":"戒可乐第三周","stars":5,"ago":"10月30日","text":"气比我喝过的其他气泡水都足，想喝可乐的时候开一瓶，能顶住。"},{"nick":"k***c","stars":5,"ago":"2 天前","text":"冰透了喝，第一口从舌尖麻到喉咙。","follow":"一箱两周喝完，已经下了第二箱。"},{"nick":"小**嗝","stars":4,"ago":"10月19日","text":"气足，有一点点矿物质的咸苦味，喝不惯的人需要适应，我加柠檬片喝。"},{"nick":"办公室下午三点","stars":5,"ago":"上周","text":"一箱放公司，下午犯困开一瓶，比续第三杯咖啡痛快。"},{"nick":"6***b","stars":4,"ago":"11月3日","text":"玻璃瓶好看但是重，一箱十几公斤，自己搬上楼有点费劲。"}]},"macaron":{"desc":"Ladurie 马卡龙礼盒里并排躺着八枚不同口味的马卡龙，外壳薄脆，一咬就碎，里面是湿润的杏仁饼和夹心。开心果、玫瑰、覆盆子、柠檬，每个味道都分得清。盒子很精致，适合下午茶，或者送给喜欢甜食的朋友。","points":["八枚八种味道","外脆内软","礼盒精致"],"specs":[["规格","8 枚"],["净含量","约 130 克"],["口味","开心果、玫瑰、覆盆子、柠檬等"],["保存","冷藏，四天内吃完"],["食用","回温十分钟口感最好"]],"colors":[["8 枚","#BFE3D0"]],"reviews":[{"nick":"下午茶配红茶","stars":5,"ago":"10月27日","text":"玫瑰味那枚最惊喜，是真的花香，不是香精的味道。"},{"nick":"r***d","stars":5,"ago":"昨天","text":"盒子太好看了，吃完留着放首饰。"},{"nick":"小**梨","stars":4,"ago":"10月12日","text":"好吃，但是很甜，一次吃两枚是极限，要配无糖的茶或者黑咖啡。"},{"nick":" 但是玩起来会忘记累，放下才发现手麻。"}]},{"q":"游戏都能玩吗？会不会很多不支持","nick":"只想开机就玩","ago":"11月5日","answers":[{"nick":"懒人玩家","text":"商店里标着已验证的直接装直接玩，我玩的十几个里只有一个进不去。"},{"nick":"g***3","text":"部分联机游戏不行，买之前查一下兼容标记就知道了。"},{"nick":"存档在云上","text":"和电脑上的存档是通的，这点特别省心。"}]}],"stanmore":[{"q":"没有电池吗？能带出去用吗","nick":"想带去露营","ago":"10月24日","answers":[{"nick":"插线板常备","text":"没有电池，必须插电，四公斤多也不适合拎着跑，就是放家里的。"},{"nick":"t***b","text":"想带出门得看同系列带电池的小款，这台老实待在客厅。"}]},{"q":"六十平的小客厅会不会太响？","nick":"住公寓怕扰民","ago":"6 天前","answers":[{"nick":"楼下没投诉","text":"音量开到三四格就够，低音旋钮往回拧一点，晚上听也不轰。"},{"nick":"邻居很友好","text":"低音确实有穿透力，我晚上十点以后就不开了。"}]},{"q":"接电视能用吗？","nick":"想换掉电视喇叭","ago":"11月8日","answers":[{"nick":"电视柜上那台","text":"能，用莲花线或者 3.5 毫米线接电视的音频输出就行。"},{"nick":"m***b","text":"能用，但它不是回音壁，看电影没有环绕感，听歌才是强项。"},{"nick":"追剧也听歌","text":"我用蓝牙连电视，人声有一点点延迟，后来换成线就好了。"}]}],"zflip":[{"q":"折痕明显吗？","nick":"强迫症","ago":"10月29日","answers":[{"nick":"用了一个月","text":"亮屏正着看基本看不到，手指划过去能摸到一道浅浅的凹。"},{"nick":"折痕无所谓","text":"画面暗的时候斜着看会有一道反光，刷视频的时候完全注意不到。"}]},{"q":"电池够用一天吗？","nick":"重度刷手机","ago":"2 天前","answers":[{"nick":"外屏省电派","text":"多用外屏回消息的话能撑到晚上，一直开着内屏刷视频下午就要充。"},{"nick":"c***d","text":"正常上班一天够，出去玩拍照多的话带个充电宝。"},{"nick":"充电宝不离身","text":"我是重度用户，傍晚六点前后剩两成，带着充电宝心里踏实。"}]},{"q":"铰链用久了会松吗？","nick":"怕不耐用","ago":"10月13日","answers":[{"nick":"每天开合几十次","text":"目前两个多月，开合还是很紧，能停在任意角度。"},{"nick":"z***4","text":"没松，就是铰链缝里会进灰，隔几天吹一下。"}]}],"x5":[{"q":"剪辑麻烦吗？新手能上手吗","nick":"不会剪视频","ago":"10月27日","answers":[{"nick":"剪辑靠自动","text":"手机应用里有自动剪辑，选几段素材它自己配音乐，新手够用。"},{"nick":"v***2","text":"想自己选角度的话要花点时间拖画面，我第一次剪了一个小时。"}]},{"q":"晚上拍清楚吗？","nick":"喜欢拍夜景","ago":"5 天前","answers":[{"nick":"夜市常客","text":"有专门的夜景模式，路灯下拍人挺干净，太黑的地方还是有噪点。"},{"nick":"晚上散步拍","text":"比我之前那台强不少，但要举稳、走慢点。"}]},{"q":"镜头容易刮花吗？","nick":"手很糙的人","ago":"11月2日","answers":[{"nick":"摔过一次","text":"从车把上掉过一次，镜片花了，买了替换镜片自己拧上去，十分钟搞定。"},{"nick":"k**6","text":"我一直套着保护套，不拍的时候不摘，目前没事。"},{"nick":"镜头保护罩常戴","text":"另买了保护镜贴着，逆光时会有一点点眩光，不介意的话很省心。"}]}],"projector":[{"q":"白天能看清吗？","nick":"客厅朝南","ago":"10月26日","answers":[{"nick":"朝南 油皮用会不会闷？","nick":"夏天油光满面","ago":"10月25日","answers":[{"nick":"油皮十年","text":"不闷，它很水，吸收完脸上没有膜感，我夏天也在用。"},{"nick":"i***b","text":"我混油，早上用完直接上防晒，没觉得油。"}]},{"q":"一瓶能用多久？","nick":"算算每天多少钱","ago":"4 天前","answers":[{"nick":"早晚各一次","text":"早晚各一滴管，两个月出头用完。"},{"nick":"只在晚上用","text":"我只晚上用，一瓶用了四个多月。"},{"nick":"记账爱好者","text":"一次不用吸满，半管就够涂脸和脖子了。"}]},{"q":"味道重吗？","nick":"对香味敏感","ago":"11月1日","answers":[{"nick":"闻香很挑","text":"有一点淡淡的香，涂开就散了，不会一直闻到。"},{"nick":"9***l","text":"比我用过的其他精华味道都轻。"}]}],"balm":[{"q":"浓妆卸得干净吗？","nick":"爱画烟熏妆","ago":"10月20日","answers":[{"nick":"舞台妆也卸过","text":"浓妆多揉一会儿，眼睛那里停几秒再打圈，一遍能干净。"},{"nick":"y***b","text":"亮片眼影要卸两遍，其他一遍够了。"}]},{"q":"会糊眼睛吗？","nick":"戴隐形眼镜","ago":"6 天前","answers":[{"nick":"隐形眼镜十年","text":"摘了镜片再卸，揉眼睛时闭紧就不糊，冲干净以后很清爽。"},{"nick":"眼睛进过一次","text":"进了眼睛会蒙一小会儿，用水冲一下就清楚了。"},{"nick":"先卸眼再卸脸","text":"我没糊过，关键是加水乳化那步要做够。"}]},{"q":"夏天会不会化成水？","nick":"住在广东","ago":"11月3日","answers":[{"nick":"广东收货","text":"夏天表面会软一点，还是膏状，没有化成油流出来。"},{"nick":"t***3","text":"放浴室里一年四季都没事，盖子拧紧就行。"}]}],"blush":[{"q":"黄皮用会不会显脏？","nick":"黄一白纠结中","ago":"10月30日","answers":[{"nick":"黄二白","text":"不会，蜜桃粉偏暖，黄皮刷上很自然，怎么刷都不出错。"},{"nick":"暖皮姐妹","text":"我肤色偏深，要多叠一层才显色，叠上去也不脏。"},{"nick":"o***c","text":"薄薄一层最好看，手重的话换把松一点的刷子。"}]},{"q":"会飞粉吗？","nick":"怕弄脏衣服","ago":"2 天前","answers":[{"nick":"蘸一下就够","text":"蘸完在手背上弹一下再上脸，基本不飞。"},{"nick":"衬衫爱好者","text":"用散一点的大刷子会带起一点粉，我换了小号腮红刷好多了。"}]},{"q":"能持续一天吗？","nick":"早八晚六","ago":"10月17日","answers":[{"nick":"通勤妆","text":"早上八点刷的，下午四五点会淡一些，补一下就好。"},{"nick":"h***7","text":"我是干皮，一天下来基本还在。"}]}],"mascara":[{"q":"好卸吗？","nick":"懒得卸妆","ago":"10月26日","answers":[{"nick":"卸妆认真派","text":"不好卸，要用眼唇卸妆液湿敷十几秒再擦，别硬搓。"},{"nick":"试过温水","text":"温水洗不掉，卸妆油多揉一会儿能下来。"}]},{"q":"睫毛短也能刷长吗？","nick":"睫毛只有几毫米","ago":"5 天前","answers":[{"nick":"短睫毛本人","text":"能，里面有小纤维会接在睫毛尖上，侧面看长了一截。"},{"nick":"a***e","text":"长是长了，浓密度一般，想要浓的得叠两层。"},{"nick":"先夹再刷","text":"先用睫毛夹夹翘再刷，能翘一整天。"}]},{"q":"会结块变成苍蝇腿吗？","nick":"手残一枚","ago":"11月7日","answers":[{"nick":"瓶口刮一下","text":"出管的时候在瓶口刮掉多余的膏体，就不容易结块。"},{"nick":"k***n","text":"第一层干了再刷第二层，别来回刷太多遍。"}]}],"yaman":[{"q":"用的时候会疼吗？","nick":"怕痛","ago":"10月23日","answers":[{"nick":"从一档开始","text":"不疼，一档只是温温的，开到最高档下巴那里会有点麻麻的。"},{"nick":"脸皮薄","text":"骨头多的地方比如额头感觉会强一点，调低一档就行。"}]},{"q":"一定要配专用凝胶吗？","nick":"不想多花钱","ago":"3 天前","answers":[{"nick":"凝胶用完了","text":"不一定要专用的，但脸上必须有东西打底，干推会拉扯皮肤。"},{"nick":"m**2","text":"我用芦荟胶代替过，滑是够滑，就是没有专用的好推开。"},{"nick":"说明书读者","text":"说明书建议用配套的，我是配套和平价的换着用。"}]},{"q":"能坚持用下来吗？会不会吃灰","nick":"买过三个美容仪","ago":"11月10日","answers":[{"nick":"第四个也买了","text":"放在洗手台最显眼的位置，洗完脸顺手就用了，藏进抽屉必吃灰。"},{"nick":"w***b","text":"我一周用三四次，没有每天，也算没浪费。"}]}],"sonic":[{"q":"第一次用电动的，会不会很震？","nick":"手动牙刷二十年","ago":"10月28日","answers":[{"nick":"刚转电动","text":"头几天会痒会麻，先用最轻的模式，一周后再换回普通模式。"},{"nick":"轻柔档够了","text":"我一直用最轻的那档，刷完牙面照样是滑的。"}]},{"q":"充一次电能用多久？","nick":"经常出差","ago":"4 天前","answers":[{"nick":"出差两周","text":"一天两次，两周出头才提示没电。"},{"nick":"f***9","text":"旅行盒能接充电线，出长差也不用带杯子。"},{"nick":"忘记充电的人","text":"我把它一直放在杯子里，从来没关心过电量。"}]},{"q":"刷头多久换？贵吗","nick":"算过耗材钱","ago":"11月5日","answers":[{"nick":"刷毛会褪色","text":"刷毛上的蓝色褪到一半就该换了，大概三个月。"},{"nick":"z**1","text":"刷头不便宜，我都是趁活动一次买四支。"}]}],"handcream":[{"q":"香味重吗？","nick":"不喜欢太香的","ago":"10月29日","answers":[{"nick":"鼻子挑剔","text":"很淡，一点奶香，涂完几分钟就闻不到了。"},{"nick":"冬天只用它","text":"味道低调，在办公室里用不会打扰别人。"}]},{"q":"涂完会不会黏？","nick":"要摸手机屏幕","ago":"5 天前","answers":[{"nick":"屏幕没印子","text":"量别挤多，黄豆大小搓一分钟就吸收了，摸手机不留印。"},{"nick":"s***1","text":"质地偏厚，挤多了会黏，我一般睡前厚涂。"},{"nick":"夏天嫌厚","text":"冬天刚好，夏天我觉得有点厚，只在空调房里用。"}]},{"q":"30ml 能用多久？","nick":"想知道划不划算","ago":"11月8日","answers":[{"nick":"每天涂三次","text":"我每天涂三四次，一支用了一个半月。"},{"nick":"包里常备一支","text":"放包里偶尔用，半年了还没用完。"}]}],"cerave":[{"q":"脸上能用吗？","nick":"想一瓶到底","ago":"11月3日","answers":[{"nick":"混油皮","text":"我早上脸上用一泵，清爽，后面上防晒不起泥。"},{"nick":"干皮本干","text":"秋冬脸上单用不够，我拿它当身体乳。"}]},{"q":"夏天用会不会黏？","nick":"怕油腻","ago":"10月18日","answers":[{"nick":"南方潮湿","text":"夏天也不黏，吹空调的屋里用刚好。"},{"nick":"p***8","text":"薄薄一层就够，抹多了要多揉一会儿。"}]},{"q":"一瓶能用多久？","nick":"精打细算","ago":"5 天前","answers":[{"nick":"每天全身抹","text":"一个人每天洗完澡全身用，大概两个半月。"},{"nick":"只抹小腿和手肘","text":"我用了半年还没见底。"},{"nick":"u***1","text":"两个人一起用，一个多月一瓶。"}]}],"cicab5":[{"q":"油皮用会不会太厚？","nick":"鼻子爱出油","ago":"10月29日","answers":[{"nick":"混油也在用","text":"全脸用会闷，我只涂两颊和嘴周。"},{"nick":"大油田","text":"夏天基本不碰，秋冬晚上薄涂一层可以。"}]},{"q":"白天能用在妆前吗？","nick":"早上赶时间","ago":"6 天前","answers":[{"nick":"妆前试过","text":"妆前用容易搓泥，量要很少，等它吸收了再上底妆。"},{"nick":"j***8","text":"我白天不用，晚上厚涂当睡眠面膜。"}]},{"q":"一支能用多久？","nick":"看着好小","ago":"11月8日","answers":[{"nick":"每晚黄豆大小","text":"每晚用黄豆大一点，两个多月才用完。"},{"nick":"m***3","text":"只在干的时候用的话，半年都用不完。"},{"nick":"全脸厚涂党","text":"天天厚涂的话一个月一支。"}]}],"lipmask":[{"q":"白天能当润唇膏用吗？","nick":"不想买两样","ago":"10月31日","answers":[{"nick":"办公室常备","text":"可以，薄涂一层不黏，有一点点光泽。"},{"nick":"s***4","text":"白天用我嫌厚，头发会粘到嘴上，还是留着睡前用。"}]},{"q":"味道甜吗？会不会腻","nick":"不爱香精味","ago":"4 天前","answers":[{"nick":"闻不得太甜的","text":"是甜甜的果味，涂上几分钟就淡了，不腻。"},{"nick":"莓果爱好者","text":"像莓果软糖，我很喜欢，怕甜的可能觉得稍浓。"}]},{"q":"一罐能用多久？","nick":"二十克好少","ago":"11月10日","answers":[{"nick":"每晚都涂","text":"每晚涂，五个月还没见底。"},{"nick":"y**6","text":"我和妹妹一起用，三个月用完的。"}]}],"ultimune":[{"q":"用在哪一步？","nick":"护肤步骤新手","ago":"11月7日","answers":[{"nick":"步骤简单派","text":"洗脸、拍水，然后就是它，后面再接乳液面霜。"},{"nick":"t***6","text":"我放在其他精华前面，先用它再用别的。"}]},{"q":"油皮夏天用会闷吗？","nick":"怕闷","ago":"10月20日","answers":[{"nick":"混油皮过夏天","text":"很清爽，夏天我用完它直接上防晒。"},{"nick":"出油大户","text":"不闷，质地像稀一点的乳，秋冬要再加面霜。"}]},{"q":"50ml 能用多久？","nick":"看看值不值","ago":"2 天前","answers":[{"nick":"早晚各两泵","text":"早晚都用，三个月左右。"},{"nick":"只在晚上用","text":"我一瓶用了快半年。"},{"nick":"b***5","text":"按压一次出量固定，不容易浪费。"}]}],"bioderma":[{"q":"卸完还要再洗脸吗？","nick":"想偷懒","ago":"10月27日","answers":[{"nick":"偷懒成功","text":"淡妆的话我擦完就睡了，脸上没有残留感。"},{"nick":"洗脸强迫症","text":"我还是会用清水冲一下，心里踏实。"},{"nick":"d***2","text":"浓妆建议后面再洗一遍。"}]},{"q":"防水的眼妆卸得掉吗？","nick":"睫毛膏很顽固","ago":"11月5日","answers":[{"nick":"眼线从不晕","text":"化妆棉湿敷十几秒再擦，眼线能掉，防水睫毛膏要两三遍。"},{"nick":"a***0","text":"浓眼妆我会另外用眼唇卸妆液，它负责全脸。"}]},{"q":"费不费化妆棉？","nick":"化妆棉消耗大户","ago":"3 天前","answers":[{"nick":"一天三片","text":"一次三四片，选厚一点的棉片更省。"},{"nick":"k**7","text":"挺费的，一包棉片一个月就没了。"}]}],"blender":[{"q":"怎么洗才干净？","nick":"总是洗不干净","ago":"10月28日","answers":[{"nick":"每周洗一次","text":"用香皂搓出泡，反复捏到水变清，放通风的地方晾干。"},{"nick":"x***6","text":"每次用完马上洗最干净，放久了就染进去了。"}]},{"q":"一定要沾水用吗？","nick":"嫌麻烦","ago":"6 天前","answers":[{"nick":"试过干用","text":"干着用又硬又吃粉，一定要泡湿再拧到不滴水。"},{"nick":"底妆爱好者","text":"泡湿以后用纸巾包着捏一下，湿度刚刚好。"}]},{"q":"多久换一只？","nick":"一只用了一年","ago":"11月6日","answers":[{"nick":"三个月换新","text":"我三四个月换，表面开始有小裂口就该换了。"},{"nick":"u**8","text":"天天用的话半年是极限，边缘会掉小碎屑。"},{"nick":"周末才化妆","text":"用得少、洗得勤的话，半年以上也行。"}]}],"curler":[{"q":"眼窝深、眼睛圆适合吗？","nick":"眼窝偏深","ago":"10月21日","answers":[{"nick":"圆眼睛试过","text":"弧度偏平，我夹中间没问题，眼头眼尾够不到。"},{"nick":"l***4","text":"眼窝深的朋友说边角会硌，买之前最好先试试。"}]},{"q":"胶垫多久换？哪里买？","nick":"胶垫已经有印子","ago":"5 天前","answers":[{"nick":"三个月一换","text":"胶垫中间压出深沟就换，盒里自带一枚备用的。"},{"nick":"每天都夹","text":"我天天用，两个月就换，替换胶垫单独有卖。"}]},{"q":"会夹掉睫毛吗？","nick":"睫毛本来就少","ago":"11月9日","answers":[{"nick":"夹了三年","text":"先夹再涂睫毛膏就不会，涂完再夹容易粘掉。"},{"nick":"手很重的人","text":"别用蛮力，轻轻夹三下，比死死夹一下好。"},{"nick":"e***2","text":"胶垫旧了不换才会夹断，勤换就没事。"}]}],"foreo":[{"q":"皮肤薄用着会疼吗？","nick":"脸皮薄","ago":"10月24日","answers":[{"nick":"皮肤偏薄","text":"开最低两档很轻，像手指轻轻敲，不疼。"},{"nick":"c***9","text":"别用力按，贴着脸慢慢滑就行，高档位我只用在鼻子上。"}]},{"q":"要配专门的洗面奶吗？","nick":"家里洗面奶还很多","ago":"6 天前","answers":[{"nick":"什么都配过","text":"不用，普通洗面奶就行，带磨砂颗粒的别用，会磨硅胶。"},{"nick":"泡沫型用户","text":"泡沫洁面最顺手，挤在脸上直接开机。"}]},{"q":"多久充一次电？","nick":"讨厌充电","ago":"11月2日","answers":[{"nick":"买来半年","text":"每天早晚用，半年里只充过一次。"},{"nick":"n***6","text":"充电口有防水塞，充完记得按紧。"},{"nick":"出差也带着","text":"出差两周不用带线，很省心。"}]}],"kerastase":[{"q":"细软发质用了会不会塌、显油？","nick":"头发少还软","ago":"10月30日","answers":[{"nick":"细软塌本人","text":"半泵，只抹发尾，离发根远一点就不塌。"},{"nick":"头发又细又少","text":"我用着还是略重，只敢在吹干以后用一点点。"}]},{"q":"湿发用还是干发用？","nick":"第一次用护发油","ago":"4 天前","answers":[{"nick":"吹前吹后都抹","text":"毛巾擦到半干抹一泵再吹，吹完发尾补一点。"},{"nick":"p***2","text":"干发用更显光泽，湿发用更顺，我两个时候都用。"}]},{"q":"味道浓吗？","nick":"对香味挑剔","ago":"11月8日","answers":[{"nick":"香味不耐受","text":"是花香带一点木头味，刚抹上明显，半小时后就淡了。"},{"nick":"爱喷香水的人","text":"不冲，和我的香水不打架。"},{"nick":"a**2","text":"比一般护发油香一些，怕香的建议先少抹一点试试。"}]}],"braun":[{"q":"胡子不多，有必要买这么好的吗？","nick":"胡子稀疏","ago":"10月22日","answers":[{"nick":"两天刮一次","text":"胡子少的话有点浪费，它的长处是对付又硬又密的。"},{"nick":"h***2","text":"我胡子也不多，买它图的是刮得快、不用来回蹭。"}]},{"q":"清洁底座的清洁液贵吗？","nick":"担心后续花销","ago":"3 天前","answers":[{"nick":"自己冲水党","text":"一盒清洁液能用两三个月，我平时冲水，一周用底座洗一次。"},{"nick":"每天都洗","text":"天天用底座洗的话一个多月一盒，是笔开销。"}]},{"q":"出差带着方便吗？","nick":"每月飞两次","ago":"11月4日","answers":[{"nick":"常年出差","text":"有旅行盒，还能锁住开关，充满够用两周，不用带底座。"},{"nick":"w**9","text":"比手动剃须刀占地方，但不用带泡沫，算下来差不多。"},{"nick":"b***0","text":"能过安检，放随身行李就行。"}]}],"aesop":[{"q":"香味留得久吗？","nick":"喜欢手上有味道","ago":"10月26日","answers":[{"nick":"一天洗十次手","text":"洗完十来分钟手上还有，之后慢慢就散了。"},{"nick":"g***3","text":"不算持久，但每次洗手那一下很舒服。"}]},{"q":"一瓶能用多久？","nick":"三百块想问清楚","ago":"4 天前","answers":[{"nick":"两口之家","text":"两个人用，四个月左右。"},{"nick":"客人很多的家","text":"我家常来人，两个多月就见底。"},{"nick":"半泵就够","text":"按半泵也够起泡，能用小半年。"}]},{"q":"冬天洗手会干吗？","nick":"冬天手很干","ago":"11月10日","answers":[{"nick":"北方暖气房","text":"比普通洗手液好很多，不会洗完紧巴巴的。"},{"nick":"f**4","text":"不干，但一天洗很多次的话还是得抹护手霜。"}]}],"nivea":[{"q":"能擦脸吗？会不会太油","nick":"想省一瓶面霜","ago":"10月23日","answers":[{"nick":"干皮冬天擦脸","text":"我冬天擦脸，手心搓化了再按上去，不然推不开。"},{"nick":"油皮别试","text":"我是油皮，上脸太闷了，留着抹手脚正好。"},{"nick":"r***1","text":"睡前厚涂在干的地方可以，白天用会反光。"}]},{"q":"味道重吗？","nick":"不喜欢太香","ago":"5 天前","answers":[{"nick":"闻了三十年","text":"是很淡的老式雪花膏味，抹开一会儿就闻不到了。"},{"nick":"i***5","text":"有香味但不冲，我觉得挺安心的。"}]},{"q":"铁罐带出门会漏吗？","nick":"想放包里","ago":"11月9日","answers":[{"nick":"包里常备","text":"盖子是扣紧的，放包里半年没漏过。"},{"nick":"放车里软过","text":"太热的地方放久了会变软，平时没事。"}]}],"powder":[{"q":"干皮能用吗？会不会卡粉","nick":"两颊很干","ago":"10月29日","answers":[{"nick":"干皮也想定妆","text":"保湿做足，只按 T 区和眼下，两颊轻轻带一下就行。"},{"nick":"m***9","text":"冬天我改用大刷子扫，比粉扑按的薄，不卡。"}]},{"q":"罐子里带粉扑吗？","nick":"不想另外买","ago":"6 天前","answers":[{"nick":"开箱看过","text":"里面只有散粉和筛网，粉扑要自己配。"},{"nick":"j**3","text":"没带，我配了一个绒面粉扑，上粉更均匀。"}]},{"q":"一罐能用多久？","nick":"四百块想算算","ago":"11月7日","answers":[{"nick":"每天上班用","text":" wers":[{"nick":"机洗三个月","text":"冷水机洗了十几次，长度没变，也没松。"},{"nick":"烘干机受害者","text":"我用烘干机烘过一次，短了一点点，还能穿。"}]},{"q":"厚不厚？秋天单穿热吗","nick":"怕热体质","ago":"6 天前","answers":[{"nick":"秋天单穿","text":"挺厚实，十五度左右单穿正好，二十度以上会热。"}]},{"q":"女生穿会不会太大？","nick":"一米五八","ago":"10月16日","answers":[{"nick":"一五八女生","text":"落肩很宽松，我一五八穿 S，宽宽松松的，正好遮肉。"},{"nick":"f***e","text":"想穿合身的选小一码，想要宽松就按平时尺码。"}]}],"tee":[{"q":"白色真的不透吗？","nick":"怕透","ago":"10月29日","answers":[{"nick":"白 T 收集者","text":"很厚实，里面穿浅色内衣看不出来。"},{"nick":"l***g","text":"深色内衣在太阳底下会隐约看到，穿肤色的最稳。"}]},{"q":"洗多了领口会变形吗？","nick":"被荷叶边伤过","ago":"11月10日","answers":[{"nick":"穿了一整个夏天","text":"洗了一个夏天，领口还是紧紧的，没松。"}]},{"q":"男生 175 穿什么码？","nick":"一七五一百四","ago":"10月11日","answers":[{"nick":"同款身材","text":"我跟你差不多，穿 L 正好，M 有点短。"},{"nick":"微胖男孩","text":"版型偏宽，想合身一点的可以选 M。"}]}],"dress":[{"q":"一米五五穿会拖地吗？","nick":"小个子","ago":"10月22日","answers":[{"nick":"一五五的我","text":"到脚踝上面一点，配平底鞋刚好，不拖地。"},{"nick":"小个子穿搭","text":"有点压个子，我配了双带跟的鞋。"}]},{"q":"面料透不透？","nick":"怕走光","ago":"9月29日","answers":[{"nick":"春游穿过","text":"在阳光下有一点透，我里面穿了安全裤。"},{"nick":"h***9","text":"室内完全看不出来，怕透就配一条衬裙。"}]},{"q":"胯宽能穿吗？","nick":"梨形身材","ago":"上周","answers":[{"nick":"梨形本梨","text":"腰收得好，下摆是散开的，正好遮住胯。"}]}],"jeans":[{"q":"没有弹力，蹲下会紧吗？","nick":"大腿粗","ago":"10月24日","answers":[{"nick":"腿粗星人","text":"刚穿蹲下有点紧，穿两周就松一点了，大腿不勒。"},{"nick":"t***y","text":"别买大一码，腰会空，按平时腰围买，等它慢慢变软。"}]},{"q":"洗的时候会不会掉色？","nick":"常穿浅色鞋","ago":"5 天前","answers":[{"nick":"白鞋受害者","text":"头几次洗会掉色，第一次单独泡一下，别和白衣服一起洗。"}]},{"q":"纽扣门襟方便吗？","nick":"第一次穿纽扣款","ago":"10月6日","answers":[{"nick":"系扣达人","text":"刚开始扣得慢，习惯了也就几秒钟，挺有复古感。"},{"nick":"牛仔控","text":"上厕所会麻烦一点点，好看就忍了。"}]}],"af1":[{"q":"鞋码偏大还是偏小？","nick":"平时穿 38","ago":"10月30日","answers":[{"nick":"平时 38","text":"偏大半码，我平时 38，这双 37.5 刚好。"},{"nick":"宽脚星人","text":"我脚宽，按平时尺码买正好，不挤。"}]},{"q":"鞋头穿久了会有折痕吗？","nick":"怕折痕","ago":"4 天前","answers":[{"nick":"爱鞋如命","text":"会有，塞了鞋撑之后好很多，走路的折痕避免不了。"}]},{"q":"重不重，走一天累吗？","nick":"逛街一整天","ago":"10月18日","answers":[{"nick":"逛了两万步","text":"比跑鞋重，但鞋底厚实，逛一天脚不疼。"}]}],"cloud5":[{" 会很夸张？","nick":"平时穿得很素","ago":"6 天前","answers":[{"nick":"全身黑的人","text":"黑色的亮不刺眼，全身深色时它刚好是唯一的亮点。"},{"nick":"同事都夸","text":"第一天穿有点不好意思，第三天就习惯了。"},{"nick":"低调人士","text":"阳光下反光比较明显，介意的话慎重。"}]},{"q":"南方冬天够暖吗？会不会太热","nick":"长沙人","ago":"11月7日","answers":[{"nick":"湿冷地区","text":"南方冬天里面一件长袖就够了，进商场要拉开拉链。"},{"nick":"h**a","text":"短款护不到屁股，骑电动车的话下半身还是冷。"}]}],"trench":[{"q":"小个子能穿吗？","nick":"一米五六","ago":"10月27日","answers":[{"nick":"一米五八穿着","text":"能穿，到小腿肚上面，系上腰带把腰线提高就不压个子。"},{"nick":"改过袖长","text":"身长我能接受，袖子长了两厘米，拿去改了一下。"}]},{"q":"真的防雨吗？","nick":"住在多雨的城市","ago":"3 天前","answers":[{"nick":"梅雨季通勤","text":"毛毛雨和小雨没问题，水珠会滚下来，大雨淋久了肩膀还是会湿。"},{"nick":"d***b","text":"防泼水，不是雨衣，下大雨老实打伞。"},{"nick":"雨天也出门","text":"淋湿了挂起来晾干就行，不会留水印。"}]},{"q":"怎么洗？能机洗吗","nick":"懒得送干洗","ago":"11月9日","answers":[{"nick":"洗标照做","text":"洗标写的是专业干洗，我一年送洗一次，平时脏了局部擦一擦。"},{"nick":"g**7","text":"不要机洗，面料上的防泼水处理会受影响。"}]}],"cashmere":[{"q":"会起球吗？","nick":"怕不耐穿","ago":"10月29日","answers":[{"nick":"穿了两个冬天","text":"会，摩擦多的地方起小球，羊绒都这样，推掉就好。"},{"nick":"去球器常备","text":"头几次起得多一点，洗过两三次以后少了。"}]},{"q":"能机洗吗？","nick":"不想手洗","ago":"4 天前","answers":[{"nick":"洗衣袋加羊毛档","text":"我装洗衣袋用羊毛档冷水洗过，没问题，但一定要平铺晾。"},{"nick":"t***a","text":"我不敢，一直用冷水手洗，挂着晾会被拉长。"},{"nick":"手洗五分钟","text":"泡几分钟按一按就行，不费事。"}]},{"q":"尺码正吗？想穿宽松点","nick":"一米六五一百一十斤","ago":"11月8日","answers":[{"nick":"一六三","text":"M 码合身，想要宽松的感觉就拿 L。"},{"nick":"v***6","text":"袖子偏长一点，可以盖住半个手背。"}]}],"samba":[{"q":"尺码偏大还是偏小？","nick":"平时穿三十七","ago":"10月30日","answers":[{"nick":"三十七码半","text":"长度正常，但是窄，我脚瘦穿正码刚好。"},{"nick":"宽脚大半码","text":"脚宽或者脚背高的买大半码，不然会挤。"},{"nick":"l***3","text":"我按平时的码买的，穿薄袜子正好，厚袜子就紧了。"}]},{"q":"走一天路累吗？","nick":"要穿去旅游","ago":"3 天前","answers":[{"nick":"暴走两万步","text":"底薄，平地走一两万步脚底会累，我不会穿它去旅游。"},{"nick":"通勤够了","text":"上下班加逛个商场没问题，垫一双软鞋垫更舒服。"}]},{"q":"麂皮鞋头好打理吗？","nick":"下雨天也穿","ago":"11月4日","answers":[{"nick":"麂皮刷一把","text":"脏了等干了用麂皮刷刷一下，别用湿布擦。"},{"nick":"x**5","text":"我买来先喷了防水喷雾，下小雨不怕。"}]}],"boston":[{"q":"新鞋磨脚吗？","nick":"脚背高","ago":"10月25日","answers":[{"nick":"熬过磨合期","text":"不磨后跟，就是鞋床硬，前几天每天穿一两个小时慢慢来。"},{"nick":"脚背也高","text":"搭扣可以放松一格，脚背高也塞得进去。"}]},{"q":"选常规版还是窄版？","nick":"脚偏瘦","ago":"5 天前","answers":[{"nick":"瘦脚选窄版","text":"脚瘦选窄版，常规版我穿着会在里面晃。"},{"nick":"e***5","text":"我脚不宽不窄，穿常规版加袜子刚好。"},{"nick":"试过两个版","text":"想冬天配厚袜子的话选常规版更稳妥。"}]},{"q":"冬天穿冷不冷？","nick":"北方人","ago":"11月6日","answers":[{"nick":"厚袜子配它","text":"后跟是露着的，配厚羊毛袜室内和短途没问题，零下出门会冷。"},{"nick":"w**a","text":"我只在秋天和暖气房里穿，下雪天不穿。"}]}],"carre":[{"q":"会不会勾丝？","nick":"戴项链和戒指","ago":"10月23日","answers":[{"nick":"勾过一次","text":"会，被戒指的爪镶勾出过一根丝，系的时候最好先摘戒指。"},{"nick":"小心翼翼派","text":"斜纹织得密，比我别的丝巾耐勾，但也别跟带尖角的首饰放一起。"}]},{"q":"怎么洗？","nick":"洗坏过一条","ago":"4 天前","answers":[{"nick":"一直送干洗","text":"送干洗最稳妥，卷边不会被压扁。"},{"nick":"n***c","text":"我自己冷水手洗过，颜色没掉，就是卷边要用手捋圆了再晾。"},{"nick":"熨斗不敢碰","text":"别用力拧，也别直接熨卷边。"}]},{"q":"九十厘米会不会太大？","nick":"脖子短","ago":"11月5日","answers":[{"nick":"脖子也不长","text":"折成细长条绕一圈半刚好，不会堆在脖子上。"},{"nick":"肩膀上披着","text":"九十厘米能披肩、能当头巾，用法比小方巾多，不嫌大。"}]}],"alhambra":[{"q":"贝母怕水吗？洗手要摘吗","nick":"经常洗手","ago":"10月30日","answers":[{"nick":"洗手必摘","text":"建议摘，贝母怕洗手液和香水，我洗澡、游泳都不戴。"},{"nick":"k***t","text":"偶尔沾到清水没事，擦干就行，别泡着。"}]},{"q":"手腕细戴会不会太长？","nick":"手腕十四厘米","ago":"5 天前","answers":[{"nick":"手腕十四点五","text":"十九厘米我戴着会滑到手掌根，可以拿去截短一点。"},{"nick":"喜欢松一点","text":"我没改，垂一点下来更好看，就是打字的时候会碰到桌面。"},{"nick":"改过链长","text":"截掉了一厘米多，现在刚好卡在腕骨下面。"}]},{"q":"日常戴容易磕坏吗？","nick":"上班要敲键盘","ago":"11月8日","answers":[{"nick":"键盘工作者","text":"贝母比较软，我打字时戴在不常用的那只手上。"},{"nick":"a**6","text":"戴了一年，金珠边有细小划痕，贝母面还是好的。"}]}],"rimowa":[{"q":"磕了坑能修吗？会心疼吗","nick":"有点完美主义","ago":"10月26日","answers":[{"nick":"坑是勋章","text":"第一个坑心疼了一晚上，第三个以后就无所谓了，现在觉得没坑反而不好看。"},{"nick":"u***2","text":"小坑可以从里面顶出来一些，不过顶不到完全平。"},{"nick":"完美主义放弃了","text":"金属箱身一定会留痕，实在介意的话要想清楚再买。"}]},{"q":"能装几天的衣服？","nick":"出差三四天","ago":"4 天前","answers":[{"nick":"三天两夜够","text":"夏天能装四五天的，冬天有毛衣的话三天就满了。"},{"nick":"卷衣服高手","text":"里面两边都有隔板压着，衣服卷起来放，能多塞不少。"}]},{"q":"重不重？女生能举上行李架吗","nick":"力气不大","ago":"11月9日","answers":[{"nick":"一米六举得动","text":"空箱四公斤多，装满十公斤上下，我举上去要踮脚，也还行。"},{"nick":"r**1","text":"比塑料的登机箱重一公斤多，介意重量的要想清楚。"}]}],"barbour":[{"q":"蜡味重吗？会蹭到别的衣服吗","nick":"有点洁癖","ago":"10月25日","answers":[{"nick":"刚穿一个月","text":"新的时候有味道，通风挂几天就淡了。"},{"nick":"挤地铁的人","text":"表面有点油润，我不敢往布沙发上靠，包带蹭的地方会发亮。"}]},{"q":"冬天穿够暖吗？","nick":"北方人","ago":"6 天前","answers":[{"nick":"南方穿刚好","text":"只有一层棉布加里布，十度左右正好，再冷要加内胆或毛衣。"},{"nick":"t***1","text":"挡风很好，但不保暖，北方冬天只能当春秋外套。"}]},{"q":"脏了怎么洗？","nick":"不会打理","ago":"11月5日","answers":[{"nick":"打理过两次","text":"不能机洗也不能干洗，用凉水和海绵擦，干了以后补一层蜡。"},{"nick":"懒人养护","text":"我一年补一次蜡，平时脏了湿布擦擦就行。"},{"nick":"n**0","text":"千万别用热水和洗衣液，蜡会掉。"}]}],"polo":[{"q":"会缩水吗？","nick":"怕洗完变短","ago":"10月19日","answers":[{"nick":"洗衣机用户","text":"冷水洗、挂着晾，只缩了一点点，烘干会缩得多。"},{"nick":"k***9","text":"我买的时候就留了半码余量，洗完正好。"}]},{"q":"夏天穿热不热？","nick":"夏天怕闷","ago":"4 天前","answers":[{"nick":"南方的夏天","text":"网眼是透气的，比普通棉 T 恤凉快，但晒着太阳会吸热。"},{"nick":"办公室空调足","text":"室内穿正好，三十五度的室外穿什么都热。"}]},{"q":"领子洗了会不会卷？","nick":"领子塌了很难看","ago":"11月10日","answers":[{"nick":"熨衣服嫌烦","text":"洗完把领子拍平了晾，基本不用熨。"},{"nick":"d**1","text":"穿了两年的那件领边有点软了，新的很挺。"},{"nick":"立领爱好者","text":"领子够硬，立起来也撑得住。"}]}],"dickies":[{"q":"腰围怎么选？按牛仔裤的码吗","nick":"腰二尺四","ago":"10月27日","answers":[{"nick":"量过再买的","text":"没有弹力，按实际腰围买，或者比牛仔裤大一码。"},{"nick":"买小了的人","text":"我按牛仔裤的码买的，扣上以后勒，吃完饭要松扣子。"}]},{"q":"夏天穿会不会闷？","nick":"怕热","ago":"6 天前","answers":[{"nick":"夏天也穿","text":"料子厚，三十度以上有点闷，春秋最舒服。"},{"nick":"f***0","text":"比牛仔裤透气一点，但也不是夏天的裤子。"}]},{"q":"裤线洗了真的不会没吗？","nick":"懒得熨","ago":"11月6日","answers":[{"nick":"洗了二十次","text":"洗了二十多次，裤线还是清清楚楚。"},{"nick":"b**2","text":"不会，晾的时候顺着裤线夹住，干了像刚熨过。"},{"nick":"机洗甩干","text":"我直接机洗甩干，裤线也没掉。"}]}],"chuck":[{"q":"尺码偏大吗？","nick":"脚长二十四厘米","ago":"10月24日","answers":[{"nick":"脚长二十四的","text":"偏大半码，我脚长二十四，穿三十七码半刚好。"},{"nick":"脚宽的人","text":"脚宽脚背高的话按平时的码买，前掌不算宽。"}]},{"q":"新鞋磨脚吗？","nick":"脚后跟容易磨","ago":"5 天前","answers":[{"nick":"刚穿了一周","text":"头两天脚踝骨那里有点硌，穿中筒袜就没事。"},{"nick":"z***7","text":"没磨过脚后跟，帆布比较厚，要穿几天才软。"}]},{"q":"下雨天能穿吗？","nick":"南方多雨","ago":"11月8日","answers":[{"nick":"踩过水坑","text":"帆布不防水，小雨没事，大雨袜子会湿。"},{"nick":"雨季苦主","text":"湿了以后干得慢，塞上报纸晾一晚上才行。"},{"nick":"u***0","text":"鞋底沾水在瓷砖上有点滑，走慢点。"}]}],"crocs":[{"q":"尺码怎么选？","nick":"脚长二十三点五","ago":"10月30日","answers":[{"nick":"半码脚的纠结","text":"版型偏宽，半码的建议往小选，我往大选了有点晃。"},{"nick":"脚背高的人","text":"脚背高、脚宽就选大一码，不挤。"}]},{"q":"夏天光脚穿会捂吗？","nick":"脚爱出汗","ago":"4 天前","answers":[{"nick":"光脚穿一夏天","text":"有洞透气，不捂，就是出汗后脚底会有点滑。"},{"nick":"e***8","text":"走远路脚背会被磨到，我会穿一双薄袜子。"}]},{"q":"能穿着走远路吗？","nick":"想穿去旅游","ago":"11月7日","answers":[{"nick":"穿它逛过古镇","text":"把后跟带拨到后面，走两万步没问题。"},{"nick":"l**3","text":"鞋底不薄，但没什么支撑，爬山就别穿了。"},{"nick":"海边度假回来","text":"去海边最合适，进了沙子抖一抖就掉。"}]}],"hunter":[{"q":"小腿粗能穿吗？","nick":"小腿围三十八","ago":"10月26日","answers":[{"nick":"小腿三十七","text":"我小腿围三十七，穿薄裤子刚好，厚裤子塞不进去。"},{"nick":"r***3","text":"筒口的搭扣能放松一点点，但整体偏窄，腿粗的要慎重。"}]},{"q":"闷不闷脚？","nick":"脚容易出汗","ago":"3 天前","answers":[{"nick":"穿了一整天","text":"橡胶不透气，穿一天脚是潮的，我会穿吸汗的厚袜子。"},{"nick":"只在下雨穿","text":"通勤路上一小时没感觉，到办公室就换鞋。"}]},{"q":"冬天穿冷吗？","nick":"想当雪地靴","ago":"11月9日","answers":[{"nick":"东北试过","text":"橡胶不保暖，零下的天要配厚的抓绒袜套，不然冻脚。"},{"nick":"南方冬天","text":"十度左右配厚袜子没问题。"},{"nick":"v**2","text":"结冰的路面抓地一般，别指望它当雪地靴。"}]}],"gshock":[{"q":"手腕细的女生戴会不会太大？","nick":"手腕十四厘米半","ago":"10月31日","answers":[{"nick":"细手腕女生","text":"我手腕十四厘米，戴着是有点大，但要的就是这种大大的感觉。"},{"nick":"j***5","text":"表壳不厚，比圆的那些显小，表带孔够多，扣得紧。"}]},{"q":"电池能用多久？自己能换吗","nick":"不想跑修表店","ago":"4 天前","answers":[{"nick":"戴了五年","text":"说明书写两年，我的第四年才换。"},{"nick":"自己换过","text":"拧开背面四颗螺丝就能换，注意别把防水胶圈弄歪。"}]},{"q":"夜光晚上看得清吗？","nick":"半夜看时间","ago":"11月10日","answers":[{"nick":"夜班司机","text":"按一下亮一两秒，够看一眼时间。"},{"nick":"i**7","text":"亮度一般，是从侧面照的光，看得清但不算亮。"},{"nick":"睡觉也戴着","text":"够用，就是要用另一只手去按。"}]}],"beanie":[{"q":"头大戴着勒不勒？","nick":"头围六十","ago":"10月22日","answers":[{"nick":"头围六十一","text":"弹力很大，我头围六十一也不勒，戴一天没有印子。"},{"nick":"d***9","text":"不勒，反而是头小的朋友说戴着容易往下滑。"}]},{"q":"会不会起球掉毛？","nick":"怕粘头发","ago":"5 天前","answers":[{"nick":"戴了两个冬天","text":"两个冬天了没怎么起球，腈纶的不掉毛。"},{"nick":"m**6","text":"会起一点静电，摘帽子的时候头发会飞。"}]},{"q":"够不够暖？零下能戴吗","nick":"在北方上学","ago":"11月9日","answers":[{"nick":"零下十度实测","text":"零下十度左右够用，风大的时候把翻边放下来盖住耳朵。"},{"nick":"东北孩子","text":"再冷就不够了，要戴带绒里的那种。"},{"nick":"x**5","text":"南方冬天戴它足够，有时还嫌热。"}]}],"socks":[{"q":"会褪色、染到别的衣服吗？","nick":"怕染色","ago":"10月25日","answers":[{"nick":"洗衣机混洗","text":"冷水机洗没褪色，也没染到别的衣服，头一次我还是单独洗的。"},{"nick":"g***6","text":"洗了十几次，花样还很鲜艳。"}]},{"q":"袜口勒不勒？会往下掉吗","nick":"小腿偏粗","ago":"6 天前","answers":[{"nick":"小腿不细","text":"不勒，脱下来只有浅浅一圈印子，走一天也没掉。"},{"nick":"每天走一万步的","text":"袜筒到小腿中间，不往下滑，穿靴子正好。"}]},{"q":"送人合适吗？","nick":"给同事挑礼物","ago":"11月5日","answers":[{"nick":"年会抽奖用过","text":"同事抽到很开心，比送杯子有意思。"},{"nick":"s**3","text":"盒子体面，尺码有弹性不容易买错，送人很合适。"},{"nick":"收到过的人","text":"我是收礼的那个，当时觉得一般，穿上以后自己又下单了一盒。"}]}],"belt":[{"q":"长度怎么选？","nick":"腰围二尺一","ago":"10月29日","answers":[{"nick":"腰围二尺","text":"看系在哪里，我腰围二尺，系低腰牛仔裤选八十五的，扣中间的孔。"},{"nick":"u***7","text":"想束在裙子外面的高腰位置，就选小一号。"}]},{"q":"扣头会掉色吗？","nick":"担心扣头磨花","ago":"5 天前","answers":[{"nick":"用了两年","text":"两年了没掉色，只是边缘亮了一点，本来就是做旧的。"},{"nick":"y**3","text":"不掉色，但会有划痕，别和钥匙放一起。"}]},{"q":"男生系合适吗？","nick":"想买给老公","ago":"11月8日","answers":[{"nick":"老公也在用","text":"三厘米宽男女都能系，他配西裤和牛仔裤都行。"},{"nick":"偏爱宽皮带","text":"我觉得男生系略细，更适合休闲的裤子。"},{"nick":"b***9","text":"合适，扣头不算大，不张扬。"}]}],"bvpouch":[{"q":"没有肩带，日常用方便吗？","nick":"习惯背单肩包","ago":"10月28日","answers":[{"nick":"手拿包新手","text":"逛街吃饭没问题，挤地铁和买菜就别带了，占一只手。"},{"nick":"w***2","text":"我夹在胳膊下面，习惯了还挺顺手，就是不能装太重。"}]},{"q":"小羊皮容易刮花吗？","nick":"手上戴戒指","ago":"3 天前","answers":[{"nick":"指甲很长","text":"编织的皮条比较耐，指甲划过没留印，尖的东西要小心。"},{"nick":"小心翼翼用了半年","text":"边角有一点点磨亮，没有破，淋到雨要马上擦干。"},{"nick":"f**7","text":"比光面的皮省心，小划痕藏在编织纹里看不出来。"}]},{"q":"鹦鹉绿会不会很难搭？","nick":"衣服都很素","ago":"11月9日","answers":[{"nick":"素色衣柜","text":"衣服素反而好搭，全身只有它一个亮点。"},{"nick":"每天都拿着","text":"牛仔裤加一件素 T 恤配它最好看，穿花裙子就有点乱了。"}]}],"beltbag":[{"q":"大屏手机放得下吗？","nick":"手机六点九寸","ago":"10月30日","answers":[{"nick":"手机也很大","text":"Gaxaly S26 Ultra 带壳能放进去，要斜着放，拉链能拉上。"},{"nick":"h***3","text":"放得下，再加钥匙和卡包就满了，充电宝塞不进。"}]},{"q":"男生背会不会太小？","nick":"一米八五","ago":"4 天前","answers":[{"nick":"一米八三的男生","text":"斜挎在胸前不显小，带子放长就行。"},{"nick":"壮汉也背","text":"我一百九十斤，带子放到最长刚好，冬天穿厚了会紧。"}]},{"q":"跑步的时候会晃吗？","nick":"想跑步带手机","ago":"11月7日","answers":[{"nick":"夜跑带它","text":"带子收紧贴在后腰，基本不晃，钥匙要放进隔层，不然会响。"},{"nick":"c***7","text":"慢跑可以，跑快了手机重，会一下一下地拍。"},{"nick":"半马带过","text":"收紧挎在胸前比挂在腰上稳。"}]}],"baggu":[{"q":"带子细不细？勒手吗","nick":"经常买很重的东西","ago":"10月21日","answers":[{"nick":"买米买油","text":"提手是宽的一整片，挎在肩上不勒，手拎重东西久了会累。"},{"nick":"p***6","text":"十来斤没感觉，再重我就挎肩上。"}]},{"q":"容易破吗？","nick":"怕被纸盒角戳破","ago":"6 天前","answers":[{"nick":"用了三年","text":"三年了没破，纸盒的角顶着也没事，面料有防撕裂的格纹。"},{"nick":"养猫的人别大意","text":"被猫抓了一下，勾了丝但没破开。"}]},{"q":"叠起来有多大？","nick":"想放小包里","ago":"11月10日","answers":[{"nick":"随身小包也能装","text":"叠好比手掌小一点，厚度像一包纸巾。"},{"nick":"a**8","text":"不认真叠的话会鼓一些，塞大衣口袋没问题。"},{"nick":"m***7","text":"很轻，放包里没有存在感。"}]}],"umbrella":[{"q":"大风天会不会翻？","nick":"海边城市","ago":"9月8日","answers":[{"nick":"海边实测","text":"四五级风没问题，再大就会往上翻，翻了也能掰回来，骨架没断。"},{"nick":"s***8","text":"三折伞骨偏细，台风天别用。"}]},{"q":"下雨能用吗？黑胶会不会掉","nick":"想一把两用","ago":"10月18日","answers":[{"nick":"晴雨都靠它","text":"下雨照常用，用完撑开晾干再收，黑胶到现在没掉。"},{"nick":"湿着收过一次","text":"湿着折起来放了两天，折痕那里的涂层有点发暗，之后都晾干再收。"}]},{"q":"重不重？放包里沉吗","nick":"包已经很重了","ago":"11月3日","answers":[{"nick":"每天背着","text":"两百多克，和一部手机差不多，天天背没觉得沉。"},{"nick":"n**1","text":"不重，收起来二十多厘米长，小包放不下，通勤包可以。"},{"nick":"轻装出门","text":"比普通雨伞轻不少，我夏天天天带。"}]}],"pandora":[{"q":"长度怎么选？","nick":"手腕十五厘米","ago":"10月27日","answers":[{"nick":"手腕十五厘米半","text":"比手腕长两到三厘米，我十五厘米半选的十八，串满以后刚好。"},{"nick":"买短了的教训","text":"别贴着手腕买，串饰加上去会变紧，我的十七现在有点勒。"}]},{"q":"银会变黑吗？怎么保养","nick":"手爱出汗","ago":"4 天前","answers":[{"nick":"戴了两年","text":"会慢慢发暗，尤其夏天出汗多，擦银布擦一擦就回来了。"},{"nick":"k***1","text":"洗澡、泡温泉、游泳记得摘，不戴的时候放密封袋。"},{"nick":"懒人保养","text":"我天天戴反而不怎么黑，放着不戴的那条黑得更快。"}]},{"q":"串饰会滑来滑去吗？","nick":"看不得东西乱跑","ago":"11月8日","answers":[{"nick":"串了六颗","text":"会滑，链子上有两段螺纹把串饰分成三区，再配固定夹就不乱跑了。"},{"nick":"o**9","text":"颗数少的时候会全滑到手腕下面，串多了就稳了。"}]}],"align":[{"q":"下蹲会透吗？","nick":"练瑜伽怕尴尬","ago":"10月29日","answers":[{"nick":"深蹲爱好者","text":"深色深蹲完全不透，我对着镜子检查过。"},{"nick":"瑜伽裤本裤","text":"尺码买小了会撑得太开，在强光下隐约透一点，按平时尺码买就好。"}]},{"q":"会起球吗？","nick":"爱惜衣服","ago":"4 天前","answers":[{"nick":"穿了半年","text":"大腿内侧摩擦多的地方有一点小球，不明显。"},{"nick":"h***u","text":"冷水手洗不烘干，穿了三个月还没起球。"}]},{"q":"一米六选 25 寸还是 28 寸？","nick":"身高一六零","ago":"10月18日","answers":[{"nick":"小个子练瑜伽","text":"一米六选 25 寸刚好到脚踝上面，28 寸会堆在脚踝。"}]}],"yogamat":[{"q":"有没有橡胶味？","nick":"鼻子敏感","ago":"10月30日","answers":[{"nick":"拆开就闻到了","text":"刚拆有橡胶味，放阳台通风两三天就淡了。"},{"nick":"r***n","text":"味道不大，我当天就用上了。"}]},{"q":"背着去瑜伽馆重不重？","nick":"每周去馆里","ago":"2 天前","answers":[{"nick":"瑜伽馆常客","text":"将近五斤重，背着走十分钟还行，再远就有点沉。"}]},{"q":"出汗多会不会滑？","nick":"手汗星人","ago":"10月14日","answers":[{"nick":"热瑜伽","text":"出了汗反而更抓手，热瑜伽我也不用铺毛巾。"}]}],"dumbbell":[{"q":"调重量会卡吗？","nick":"怕调不准","ago":"10月25日","answers":[{"nick":"居家练腿","text":"要放回底座里才能转，转到位会咔哒一声，没卡过。"},{"nick":"健身半年","text":"偶尔有一片没对齐，拿起来晃一下再放回去就好。"}]},{"q":"楼下会不会听到？","nick":"住老小区","ago":"11月8日","answers":[{"nick":"楼上楼下","text":"放回底座时轻一点，我铺了块地垫，楼下没找过我。"}]},{"q":"女生用会不会太重？","nick":"健身新手女生","ago":"10月10日","answers":[{"nick":"刚开始练","text":"最轻能调到两公斤，新手完全够，就是整只拿起来有点大。"},{"nick":"力量训练","text":"女生用很合适，从轻的开始，一副能用好几年。"}]}],"racket":[{"q":"新手能用吗？","nick":"刚学三个月","ago":"10月21日","answers":[{"nick":"打了一年球","text":"三百多克偏重，刚入门挥久了手腕会累，练半年再换更合适。"},{"nick":"教练推荐","text":"我新手用了两个月，球很稳，就是要打准，甜区不大。"}]},{"q":"女生挥起来会不会太沉？","nick":"女生打网球","ago":"4 天前","answers":[{"nick":"女子单打","text":"挥半小时手腕会酸，我在拍柄缠了吸汗带，好握一点。"}]},{"q":"打起来手感怎么样？","nick":"手感党","ago":"10月6日","answers":[{"nick":"手感控","text":"打实了声音很脆，球感很清楚，打偏会震手。"}]}],"brompton":[{"q":"折叠真的二十秒吗？","nick":"地铁加单车","ago":"10月27日","answers":[{"nick":"练了一周","text":"第一次折了五分钟，现在半分钟以内能折好。"},{"nick":"s***o","text":"熟练了二十秒差不多，新手看两遍视频就会。"}]},{"q":"拎着上楼梯重不重？","nick":"住六楼没电梯","ago":"6 天前","answers":[{"nick":"爬楼的人","text":"十一公斤多，拎上六楼会喘，折好以后推着走倒很轻松。"}]},{"q":"爬坡吃力吗？","nick":"城市坡多","ago":"10月15日","answers":[{"nick":"山城骑手","text":"六个档位，一般的坡没问题，陡坡我就下来推了。"}]}],"tent":[{"q":"一个人能搭起来吗？","nick":"独自露营","ago":"10月19日","answers":[{"nick":"独自露营的女生","text":"一个人能搭，就是要四十分钟左右，有风的时候比较费劲。"}]},{"q":"下大雨会漏吗？","nick":"雨天露营","ago":"9月24日","answers":[{"nick":"雨中露营","text":"下了一夜大雨，里面是干的，前厅还能煮面。"},{"nick":"3***q","text":"不漏，但地钉一定要打牢，不然雨水会流到地布底下。"}]},{"q":"车后备箱放得下吗？","nick":"开小车","ago":"11月10日","answers":[{"nick":"两厢车车主","text":"收起来十几公斤，小两厢的后备箱能放，再塞桌椅就满了。"}]}],"clifton":[{"q":"脚宽能穿吗？","nick":"脚掌很宽","ago":"10月28日","answers":[{"nick":"宽脚买大半码","text":"前掌不算宽，我买大了半码，脚趾能张开。"},{"nick":"高脚背星人","text":"鞋面的网布有弹性，脚背高也不压，鞋带松一格就行。"}]},{"q":"厚底会不会不稳，容易崴脚？","nick":"崴过两次","ago":"3 天前","answers":[{"nick":"走路为主","text":"平路跑和走很稳，鞋底宽，不平的石子路要留神。"},{"nick":"h***5","text":"我下楼梯会放慢一点，习惯了以后没崴过。"},{"nick":"山路别穿","text":"它是公路跑鞋，爬山要换别的鞋。"}]},{"q":"平时走路穿合适吗，还是只能跑步？","nick":"不跑步只走路","ago":"11月5日","answers":[{"nick":"日行万步","text":"很合适，我就是买来走路的，一万步下来脚不累。"},{"nick":"旅游专用鞋","text":"出去玩全程穿它，比我的板鞋舒服太多。"}]}],"theragun":[{"q":"力度够吗？小的会不会没劲","nick":"大腿很粗","ago":"10月29日","answers":[{"nick":"骑行爱好者","text":"够，三档打大腿我都觉得重，它个头小但打得深。"},{"nick":"y***4","text":"跟大号的比差一点，日常放松够了，专业运动员可能嫌轻。"}]},{"q":"声音大吗？","nick":"合租怕吵","ago":"6 天前","answers":[{"nick":"隔壁没敲门","text":"一档是低低的嗡嗡声，关上门外面听不到，三档明显一些。"},{"nick":"边看剧边用","text":"贴在肉上声音小，碰到骨头会哒哒响。"},{"nick":"s**7","text":"比我之前那把杂牌的安静，不算吵。"}]},{"q":"自己能按到后背吗？","nick":"肩胛骨总是酸","ago":"11月6日","answers":[{"nick":"手臂不够长","text":"肩膀和腰两侧够得着，肩胛骨中间自己按不到，得找人帮忙。"},{"nick":"靠沙发法","text":"我把它夹在后背和沙发靠垫中间，勉强能按到。"}]}],"forerunner":[{"q":"电池真实能用多久？","nick":"一周跑四次","ago":"10月30日","answers":[{"nick":"一周充一次","text":"每周跑四次，每次一小时，屏幕不常亮，一周充一次还有剩。"},{"nick":"常亮党","text":"开常亮显示的话四五天就要充，我后来关了。"}]},{"q":"屏幕在太阳下看得清吗？","nick":"中午跑步","ago":"5 天前","answers":[{"nick":"正午跑者","text":"看得清，彩屏很亮，大太阳下配速数字也清楚。"},{"nick":"d***3","text":"清楚，比我上一块旧表的屏幕鲜艳得多，就是戴墨镜时要抬高一点看。"}]},{"q":"不跑步的人买有用吗？","nick":"只是想戴块表","ago":"11月8日","answers":[{"nick":"只走路不跑步","text":"也能用，记步、睡眠、提醒消息都有，但它的长处在跑步上。"},{"nick":"被它带跑了","text":"我原来不跑，戴上以后被每天的建议勾着开始跑了。"},{"nick":"v**0","text":"只想看时间和消息的话有点浪费。"}]}],"snowboard":[{"q":"纯新手能用吗？","nick":"只滑过两次","ago":"10月28日","answers":[{"nick":"新手过来人","text":"能用，但它不算软，推坡阶段会觉得不太听话，学会换刃以后就顺了。"},{"nick":"听教练的","text":"我教练说先租软板练几天，再上这块，进步会更快。"}]},{"q":"长度怎么选？","nick":"一米七七十公斤","ago":"6 天前","answers":[{"nick":"一米七二","text":"我一七二，六十八公斤，用 154 的，立起来到下巴和鼻子之间。"},{"nick":"b***c","text":"体重比身高重要，七十公斤选 154 到 156 都行。"},{"nick":"脚大选宽板","text":"鞋码四十四以上记得看宽板，不然脚尖会刮雪。"}]},{"q":"固定器要另外买吗？","nick":"第一次买板","ago":"11月7日","answers":[{"nick":"全套刚配齐","text":"要，板子是光板，固定器和雪鞋都得另配。"},{"nick":"k**a","text":"同品牌的固定器装起来最省事，底盘是对得上的。"}]}],"penny":[{"q":"零基础好学吗？","nick":"平衡感一般","ago":"10月27日","answers":[{"nick":"学了三天","text":"找块平地练，第一天学站稳和蹬地，三天能直线滑，转弯要一周。"},{"nick":"摔过才会","text":"板子短，比长板难一点，头几次戴上护腕和护膝。"}]},{"q":"路面不平能滑吗？","nick":"公司附近是人行道砖","ago":"4 天前","answers":[{"nick":"人行道通勤","text":"普通地砖能滑，会有点震脚，遇到盲道和井盖要下来走。"},{"nick":"c***6","text":"软轮已经算好了，但粗糙的柏油路滑起来很费劲。"},{"nick":"最怕小石子","text":"轮子被小石子一卡，人就往前冲，眼睛要看路。"}]},{"q":"大人踩会不会断？","nick":"体重八十五公斤","ago":"11月9日","answers":[{"nick":"八十公斤大汉","text":"我八十公斤滑了半年，板面会弯但是不断，很韧。"},{"nick":"m***4","text":"不会断，就是体重大的话板面离地近，过坎会蹭底。"}]}],"basketball":[{"q":"室外水泥地耐磨吗？","nick":"只有水泥场","ago":"10月24日","answers":[{"nick":"水泥场三个月","text":"每周打三次，三个月颗粒磨平了一点，还能正常用。"},{"nick":"塑胶场更省球","text":"水泥地再耐磨的球也伤，有塑胶场尽量去塑胶场。"}]},{"q":"到手是充好气的吗？","nick":"没有打气筒","ago":"3 天前","answers":[{"nick":"到手就能拍","text":"我收到是充好的，直接能打。"},{"nick":"i***4","text":"我那颗气有点不足，自己补了几下，最好备一个打气筒和气针。"},{"nick":"气别打太足","text":"从胸口高度松手，弹起来到腰就差不多，别打太硬。"}]},{"q":"初中生用七号会不会太大？","nick":"给孩子买","ago":"11月6日","answers":[{"nick":"初二男生家长","text":"男生初中用七号可以了，学校比赛也是这个大小。"},{"nick":"女儿用六号","text":"女生或者手小的建议六号，七号单手抓不住。"}]}],"astrox":[{"q":"新手能驾驭吗？","nick":"刚打三个月","ago":"10月30日","answers":[{"nick":"劝新手等等","text":"不太建议，头重杆硬，发力不对的话打不远，手腕也累。"},{"nick":"新手硬上","text":"我一开始就买了，打了两个月才顺手，前面确实难受。"},{"nick":"q***5","text":"先用软一点的拍子练发力，再换它不迟。"}]},{"q":"拉多少磅合适？","nick":"业余水平","ago":"2 天前","answers":[{"nick":"业余二十五磅","text":"我拉二十五磅，弹性和控制都够。"},{"nick":"女生二十三磅","text":"力量小的拉二十三四磅，太高了打不透。"}]},{"q":"到手带线吗？","nick":"不懂装备","ago":"11月5日","answers":[{"nick":"空拍到手","text":"不带线，是空拍，要自己去球馆或者店里拉线。"},{"nick":"e**8","text":"也不带手胶，记得一起买。"}]}],"chairone":[{"q":"座布套上去费劲吗？","nick":"手劲小","ago":"10月25日","answers":[{"nick":"最后一个角","text":"前三个角轻松，最后一个角要用力拉一下，新的时候比较紧。"},{"nick":"用了就松了","text":"用过几次座布会松一点，后面就好套了。"}]},{"q":"草地沙地会陷下去吗？","nick":"去海边用","ago":"4 天前","answers":[{"nick":"海边去过","text":"沙滩上四条腿会陷，我在脚下垫了网球，或者买配套的防陷垫。"},{"nick":"a***3","text":"硬草地没问题，刚下过雨的软草地会陷一点。"},{"nick":"自带四个瓶盖","text":"垫几个瓶盖也管用。"}]},{"q":"胖子坐稳吗？","nick":"一百九十斤","ago":"11月8日","answers":[{"nick":"两百斤坐过","text":"我两百斤，坐下去没问题，往后靠也没有异响。"},{"nick":"g***0","text":"稳，就是椅面窄，块头大的人会觉得有点包着。"}]}],"osprey":[{"q":"三十八升够用几天？","nick":"想走三天两夜","ago":"10月29日","answers":[{"nick":"三天两夜走过","text":"夏天三天两夜够，帐篷要挂外面，冬天装备厚就紧张了。"},{"nick":"住客栈的徒步者","text":"不带帐篷睡袋的话，走五六天都够。"}]},{"q":"女生背会不会太大？","nick":"身高一米六","ago":"5 天前","answers":[{"nick":"一米六二女生","text":"背长调到最短刚好，腰带收紧以后贴着胯，不往下掉。"},{"nick":"t***9","text":"我一米五八背着腰带有点低，个子再小的话要先试试背长。"},{"nick":"身高一六五","text":"我背着合适，装满了也不会比头高。"}]},{"q":"能带上飞机吗？","nick":"不想托运","ago":"11月7日","answers":[{"nick":"托运派","text":"装满的话高度超了登机尺寸，我都是托运，把腰带肩带收好。"},{"nick":"y**3","text":"不装满、压扁一点上过飞机，行李架塞得进，但看航空公司严不严。"}]}],"hydro":[{"q":"装热水保温怎么样？","nick":"冬天想带热茶","ago":"10月26日","answers":[{"nick":"冬天带热茶","text":"早上八点灌的开水，下午四点还是烫嘴的。"},{"nick":"w***2","text":"保热没有保冷那么久，过一夜就是温的了。"}]},{"q":"会漏水吗？","nick":"要放电脑包","ago":"4 天前","answers":[{"nick":"倒放过一夜","text":"盖子拧紧倒放在包里一晚上，没漏过。"},{"nick":"胶圈要装好","text":"洗完记得把盖子里的胶圈装回去，我忘过一次，漏了半包。"},{"nick":"f**5","text":"拧紧就不漏，别只转半圈。"}]},{"q":"能放洗碗机吗？","nick":"懒得手洗","ago":"11月9日","answers":[{"nick":"洗碗机用户","text":"我放上层洗过很多次，涂层没掉。"},{"nick":"手洗保守派","text":"我怕高温伤涂层，一直用长柄刷手洗，两分钟的事。"}]}],"rope":[{"q":"计数准吗？绊了会不会多算","nick":"强迫症想数准","ago":"10月20日","answers":[{"nick":"每天一千个","text":"挺准的，绊住那一下不算，我对着视频数过。"},{"nick":"w**2","text":"偶尔甩空一圈会多记一个，差得不多。"}]},{"q":"在楼上跳会吵到楼下吗？","nick":"住四楼","ago":"2 天前","answers":[{"nick":"三楼住户","text":"绳子打地声音不大，主要是脚落地的声音，垫块瑜伽垫好很多。"},{"nick":"被楼下敲过门","text":"晚上别跳，白天垫着垫子跳没被说过。"}]},{"q":"一米八绳子够长吗？","nick":"高个子想跳绳","ago":"11月5日","answers":[{"nick":"一米八五","text":"够，我一八五还剪掉了一小截。"},{"nick":"e***d","text":"原长两米八左右，踩住中间，手柄到腋下就合适。"}]}],"yeti":[{"q":"真的能冰三天吗？","nick":"夏天要去海边","ago":"10月26日","answers":[{"nick":"三伏天试过","text":"箱子先预冷，冰和东西二比一，少开盖，三天能撑住。"},{"nick":"p**8","text":"太阳直晒加上老开盖，我的两天就化得差不多了。"},{"nick":"自驾川西","text":"放在车里阴凉处，第三天早上还有冰碴。"}]},{"q":"一个人搬得动吗？","nick":"力气一般","ago":"4 天前","answers":[{"nick":"细胳膊","text":"空箱还行，装满冰和饮料得两个人一人拎一边。"},{"nick":"o***t","text":"两边是绳把手，抬着不勒手，但别指望单手拎。"}]},{"q":"里面能放多少东西？","nick":"四个人露营","ago":"11月8日","answers":[{"nick":"一家四口去露营","text":"四个人两天的肉和饮料刚好，壁厚，里面比外面看着小。"},{"nick":"烤肉负责人","text":"二十来罐饮料加冰就满了，红酒瓶要斜着放。"}]}],"xt6":[{"q":"尺码正常吗？脚宽要不要买大一点","nick":"脚宽买鞋难","ago":"10月19日","answers":[{"nick":"脚背高的人","text":"偏窄，脚宽脚背高的买大半码。"},{"nick":"h**5","text":"我正常脚型，按平时的码买的，刚好。"},{"nick":"徒步两年","text":"穿厚袜子爬山的话，也建议大半码。"}]},{"q":"平时走路穿硬不硬？","nick":"不爬山只逛街","ago":"3 天前","answers":[{"nick":"逛街专用","text":"底偏硬，支撑好，走一天脚不累，但没有那种踩棉花的软。"},{"nick":"a***x","text":"刚穿两天有点板脚，磨合一周就好了。"}]},{"q":"黑色鞋面好打理吗？","nick":"懒得刷鞋","ago":"11月6日","answers":[{"nick":"泥地里踩过","text":"泥干了拿刷子一刷就掉，黑色基本看不出脏。"},{"nick":"o**x","text":"网布缝里会卡细沙，冲水就干净，别用热风吹。"}]}],"frisbee":[{"q":"新手用会不会太重，接着手疼？","nick":"没玩过飞盘","ago":"10月27日","answers":[{"nick":"入坑半年","text":"这是标准重量，刚开始接快盘手会麻，两三次就习惯了。"},{"nick":"p**4","text":"用双手夹着接就不疼，别拿指尖去挡。"}]},{"q":"风大的时候好飞吗？","nick":"住在海边","ago":"5 天前","answers":[{"nick":"海边草坪队","text":"够重，四级风以内都稳，再大就得压低了传。"},{"nick":"逆风也要传","text":"逆风要多给点内倾角度，不然会飘起来往回飞。"},{"nick":"m***8","text":"比轻的盘抗风多了，海边我只带这张。"}]},{"q":"和狗玩可以吗？","nick":"家有边牧","ago":"11月3日","answers":[{"nick":"边牧家长","text":"盘偏硬，狗咬几次全是牙印，也怕硌到它的牙，不太建议。"},{"nick":"r**0","text":"这是给人玩的盘，被狗咬出毛刺后人就不好接了。"}]}],"leki":[{"q":"碳纤维会不会容易断？","nick":"体重一百八","ago":"10月23日","answers":[{"nick":"胖子登山队","text":"我一百九，正常撑着走没问题，别卡在石缝里硬掰就行。"},{"nick":"h**f","text":"竖着受力很结实，怕的是横着别住，那样什么杖都悬。"}]},{"q":"身高一米六调到多长？","nick":"小个子女生","ago":"4 天前","answers":[{"nick":"一米五八爬山","text":"平路我调到 105 左右，手肘刚好成直角。"},{"nick":"徒步领队小孟","text":"上坡调短五厘米，下坡调长五厘米，杖身上有刻度。"},{"nick":"z***3","text":"一米六用 105 到 110，看你手臂长短。"}]},{"q":"坐飞机能带吗？","nick":"要飞去爬山","ago":"11月7日","answers":[{"nick":"托运过三回","text":"只能托运，不能带上飞机，收到最短放行李箱对角线刚好。"},{"nick":"i**7","text":"杖尖是金属的，过安检会被拦，老老实实托运。"}]}],"v15":[{"q":"续航真实多久？","nick":"一百平的家","ago":"10月28日","answers":[{"nick":"一百二十平","text":"自动档能扫完一百多平，开最强档十分钟左右就没电了。"},{"nick":"养了两只猫","text":"平时扫一遍用不到一半电，够用。"}]},{"q":"拿着重不重，吸沙发手酸吗？","nick":"力气小","ago":"3 天前","answers":[{"nick":"手腕细","text":"三公斤多，举高吸窗帘一会儿就酸，在地面推着不累。"}]},{"q":"激光照灰真的有用吗？","nick":"半信半疑","ago":"10月11日","answers":[{"nick":"强迫症犯了","text":"有用，以为扫干净的地方一照全是灰，吸完很解压。"}]}],"robo":[{"q":"能钻进床底和沙发底吗？","nick":"床底很脏","ago":"10月26日","answers":[{"nick":"量过高度","text":"机身不到十厘米，我家床底十二厘米能进去，沙发底太矮进不去。"}]},{"q":"扫地吵不吵？","nick":"上夜班白天睡觉","ago":"上周","answers":[{"nick":"白天补觉的人","text":"扫地时像吹风机开小档，基站集尘那几秒很响。"},{"nick":"y***2","text":"我都设成出门以后扫，在家不开。"}]},{"q":"养狗的家里好用吗？","nick":"狗狗家长","ago":"10月8日","answers":[{"nick":"家有两只狗","text":"狗毛吸得很干净，就是滚刷隔一两周要剪一次缠的毛。"},{"nick":"狗狗吃饭区","text":"出门前我会先看一眼地上有没有狗狗的意外，其他都放心交给它。"}]}],"purifier":[{"q":"晚上开着睡觉吵吗？","nick":"浅眠","ago":"10月20日","answers":[{"nick":"卧室常开","text":"开到两三档很安静，像轻轻的风声，不影响睡觉。"},{"nick":"n***2","text":"开到最大档有呼呼声，晚上我只开低档。"}]},{"q":"滤网多久换一次？","nick":"算后续花费","ago":"4 天前","answers":[{"nick":"北方冬天","text":"我开了一整年才换，冬天开得多的话会快一些。"}]},{"q":"家里有猫会不会被打翻？","nick":"猫很皮","ago":"10月2日","answers":[{"nick":"猫主子","text":"底座很稳，猫蹭了好几次都没倒，没有扇叶也不怕它伸爪子。"}]}],"vertuo":[{"q":"别的胶囊能用吗？","nick":"家里囤了胶囊","ago":"10月30日","answers":[{"nick":"胶囊囤货","text":"不能，它要读胶囊边上的条码，只能用配套的胶囊。"}]},{"q":"出咖啡声音大吗？","nick":"早上家人还在睡","ago":"5 天前","answers":[{"nick":"早起第一杯","text":"转起来有嗡嗡声，十几秒，隔着卧室门听不太到。"},{"nick":"9***b","text":"有点大，像小搅拌机，我都关上厨房门再做。"}]},{"q":"清洗麻烦吗？","nick":"懒人","ago":"10月16日","answers":[{"nick":"一周清一次","text":"废胶囊盒满十颗左右要倒，水箱一周洗一次，不麻烦。"}]}],"quench":[{"q":"装满了重不重？","nick":"想带去上班","ago":"10月28日","answers":[{"nick":"健身房常客","text":"装满挺沉的，拎着去健身房还行，挤地铁有点累。"},{"nick":"坐办公室","text":"我放在公司不带回家，桌上一放就是一天。"}]},{"q":"能装热水吗，会不会烫嘴？","nick":"喜欢喝热水","ago":"4 天前","answers":[{"nick":"热水党","text":"能装，热水保温好几个小时，用吸管喝要小心烫。"}]},{"q":"吸管和杯盖好清洗吗？","nick":"怕洗不干净","ago":"10月7日","answers":[{"nick":"清洁狂人","text":"吸管要用小刷子刷，杯盖能拆开洗，比想象中方便。"}]}],"lc24":[{"q":"太重了吗，女生端得动吗？","nick":"手劲不大","ago":"10月24日","answers":[{"nick":"周末炖汤","text":"空锅就快五公斤，装满汤得两只手端，记得戴隔热手套。"},{"nick":"健身女孩","text":"端得动，但每天用会嫌重，周末炖一锅刚好。"}]},{"q":"珐琅会不会崩？","nick":"怕磕碰","ago":"11月9日","answers":[{"nick":"用了两年","text":"别用金属铲刮，别干烧，我用了两年还好好的。"}]},{"q":"电磁炉能用吗？","nick":"家里只有电磁炉","ago":"10月13日","answers":[{"nick":"出租屋厨房","text":"能用，电磁炉开中小火就够，铸铁锁温很好。"}]}],"lcmug":[{"q":"杯子重不重？","nick":"早上手没劲","ago":"10月29日","answers":[{"nick":"每天一杯拿铁","text":"有点分量，四百克左右，倒满了单手拿着稳，不晃。"}]},{"q":"颜色和图片一样吗？","nick":"想买一对","ago":"5 天前","answers":[{"nick":"情侣杯","text":"渐变很明显，实物比图片更有光泽，和锅放一起很好看。"},{"nick":"c***2","text":"橙色比图上深一点，我更喜欢实物。"}]},{"q":"送人体面吗？","nick":"同事过生日","ago":"10月18日","answers":[{"nick":"送同事","text":"送同事的，她说颜色好看，每天在工位上用。"},{"nick":"一个人的早餐","text":"两百块送人刚好，不会让对方有负担。"}]}],"smeg":[{"q":"壶身会烫手吗？","nick":"家里有小孩","ago":"10月23日","answers":[{"nick":"带娃的妈妈","text":"金属壶身烧开时摸着烫，拿把手就没事，放高一点别让孩子碰。"}]},{"q":"有没有塑料味或者金属味？","nick":"对味道敏感","ago":"3 天前","answers":[{"nick":"第一次烧水","text":"头两壶水有一点味道，多烧几次倒掉就没了。"}]},{"q":"粉蓝色和图片有色差吗？","nick":"颜值党","ago":"10月10日","answers":[{"nick":"厨房颜值担当","text":"实物偏淡一点，像奶蓝色，很好看。"},{"nick":"薄荷控","text":"我觉得和图片差不多，放在白色台面上很清新。"}]}],"zoji":[{"q":"两口人用会不会太大？","nick":"二人世界","ago":"10月25日","answers":[{"nick":"两个人吃饭","text":"每次煮两杯米也很好吃，就是有点占台面。"}]},{"q":"内胆涂层会不会掉？","nick":"怕涂层","ago":"昨天","answers":[{"nick":"用了一年","text":"用配的饭勺，不用钢丝球洗，一年了涂层还好好的。"}]},{"q":"真的比普通电饭锅好吃吗？","nick":"米饭爱好者","ago":"10月9日","answers":[{"nick":"家里吃米的人","text":"米粒更有嚼劲，我爸吃了两碗，说像饭店里的。"},{"nick":"2***v","text":"好吃很多，但米本身也很重要，普通的米差别没那么大。"}]}],"vitamix":[{"q":"声音大不大？","nick":"早上怕吵","ago":"10月22日","answers":[{"nick":"早上打果昔","text":"很响，开高速像飞机起飞，就一两分钟，忍忍就过去了。"},{"nick":"f***o","text":"声音大，我早上都关上厨房门再打。"}]},{"q":"能直接打热汤吗？","nick":"冬天想喝汤","ago":"11月6日","answers":[{"nick":"南瓜汤爱好者","text":"能，高速打六七分钟，倒出来就是热的。"}]},{"q":"清洗麻烦吗？","nick":"懒得洗","ago":"10月12日","answers":[{"nick":"打完就洗","text":"倒点温水加一滴洗洁精，高速转半分钟，冲一下就干净了。"}]}],"balmuda":[{"q":"只能烤吐司吗？","nick":"想烤别的","ago":"10月26日","answers":[{"nick":
