},{"q":"第一次点要注意什么？","nick":"蜡烛新手","ago":"4 天前","answers":[{"nick":"烧出了隧道","text":"第一次要烧到整个表面都化开，不然中间会烧出个洞。"}]},{"q":"送人合适吗？","nick":"送闺蜜","ago":"10月20日","answers":[{"nick":"闺蜜生日","text":"很合适，烧完的玻璃杯她拿来放化妆刷了。"}]}],"tempur":[{"q":"侧睡用会不会太矮？","nick":"侧睡党","ago":"10月27日","answers":[{"nick":"侧睡十年","text":"侧睡枕在高的那边刚好，肩宽的人可能会觉得矮一点。"},{"nick":"宽肩男","text":"我肩膀宽，侧睡有点矮，下面垫了条毛巾。"}]},{"q":"刚用会不习惯吗？","nick":"换枕头困难户","ago":"8 天前","answers":[{"nick":"落枕常客","text":"头三天脖子有点怪，一周以后就离不开了。"}]},{"q":"冬天会变硬吗？","nick":"北方没暖气","ago":"10月15日","answers":[{"nick":"南方湿冷","text":"冬天刚躺上去有点硬，几分钟就被体温捂软了。"}]}],"monstera":[{"q":"寄过来叶子会折吗？","nick":"怕快递","ago":"10月27日","answers":[{"nick":"收货时很紧张","text":"包得很好，只有一片叶子边上有点折痕，剪掉就行。"},{"nick":"植物新手","text":"我的完好无损，拆完放了两天就精神了。"}]},{"q":"家里有猫能养吗？","nick":"猫咪家长","ago":"上周","answers":[{"nick":"养猫也养草","text":"叶子猫咬了会不舒服，我放在高处，猫够不着。"}]},{"q":"北方暖气房好养吗？","nick":"北方暖气房","ago":"10月10日","answers":[{"nick":"暖气房养了两年","text":"好养，就是空气太干叶尖会焦，旁边放个加湿器。"}]}],"diff":[{"q":"能加香水吗？","nick":"有香水没精油","ago":"10月31日","answers":[{"nick":"精油爱好者","text":"说明里建议用精油，香水我没敢加，怕伤机器。"}]},{"q":"开着睡觉会吵吗？","nick":"睡眠很浅","ago":"昨天","answers":[{"nick":"睡前开一小时","text":"几乎没声音，设了六十分钟自动关，睡着了它也停了。"},{"nick":"t***c","text":"偶尔有一点咕噜咕噜的水声，不仔细听听不到。"}]},{"q":"加一次水能用多久？","nick":"想开一整晚","ago":"10月16日","answers":[{"nick":"熬夜写作","text":"加满水连续三个小时左右，开一整晚不够。"}]}],"airfryer":[{"q":"好清洗吗？","nick":"最怕洗锅","ago":"10月27日","answers":[{"nick":"洗碗机省事","text":"炸篮和底盘都能拆下来放洗碗机，手洗的话泡十分钟一冲就掉。"},{"nick":"垫纸派","text":"我垫烘焙纸，基本不用洗，就是底部没那么脆。"}]},{"q":"5.6 升够几个人吃？","nick":"家里四口人","ago":"3 天前","answers":[{"nick":"四口之家","text":"烤鸡翅、排骨够四个人吃一顿，薯条那种铺不开的要分两锅。"},{"nick":"l***8","text":"两个大人两个孩子够了，来客人就不太够。"},{"nick":"独居青年","text":"我一个人用有点大，不过烤整只鸡很过瘾。"}]},{"q":"做的时候油烟大吗？","nick":"开放式厨房","ago":"11月6日","answers":[{"nick":"开放厨房用户","text":"比炒菜小很多，烤肥一点的肉，后面出风口会有点烟和味道。"},{"nick":"p**9","text":"烤五花肉时我会开抽油烟机，其他时候不用。"}]}],"barista":[{"q":"新手多久能做出好喝的？","nick":"只喝过速溶","ago":"10月29日","answers":[{"nick":"三天调好","text":"跟着说明书调研磨度，三四天能做出不酸不苦的一杯，拉花另算。"},{"nick":"拉花还在练","text":"做出能喝的要一周，做出好看的我三个月了还在练。"}]},{"q":"磨豆机够用吗，要不要另买？","nick":"想一步到位","ago":"6 天前","answers":[{"nick":"自带的够了","text":"喝中深烘的豆子自带的够用，十六档里总能找到合适的。"},{"nick":"s***6","text":"浅烘豆想调得更细的话档位不够密，讲究的人后来会另配磨豆机。"},{"nick":"只喝拿铁","text":"加奶喝的话完全够，不用另买。"}]},{"q":"占地方吗？","nick":"台面只有一米","ago":"11月8日","answers":[{"nick":"台面量过","text":"宽三十厘米出头，深度也差不多，上面还要留出加豆子的高度。"},{"nick":"d**4","text":"比我想的大，放上去以后微波炉只能挪走。"}]}],"aeron":[{"q":"尺寸怎么选？","nick":"一米六五十公斤","ago":"10月28日","answers":[{"nick":"一米五八选了小号","text":"我选的 A 号，脚能踩实地面，B 号对我来说坐垫太深。"},{"nick":"一米七五用中号","text":"一米六五到一米八之间大多选 B，再高再壮才要 C。"}]},{"q":"没有头枕会不会累？","nick":"喜欢后仰","ago":"3 天前","answers":[{"nick":"加了头枕","text":"我另买了个头枕装上，后仰看视频舒服多了。"},{"nick":"b***5","text":"工作的时候用不到头枕，它本来就是让人坐直的。"},{"nick":"午休躺不平","text":"后仰角度不算大，想躺平午睡的话它做不到。"}]},{"q":"网面坐久了会塌吗？","nick":"担心用几年就松","ago":"11月7日","answers":[{"nick":"用了六年","text":"我这把六年了，网面还是绷的，没有坑。"},{"nick":"h**3","text":"公司的用了十年以上，只换过气压杆。"}]}],"lamp":[{"q":"配什么灯泡？","nick":"不懂灯泡","ago":"10月26日","answers":[{"nick":"暖光爱好者","text":"E27 螺口的灯泡都行，我用的是六瓦暖光，看书刚好。"},{"nick":"灯泡别太大","text":"选小一点的球泡，太长的会从灯罩里露出来。"}]},{"q":"灯臂用久了会垂下来吗？","nick":"怕弹簧松","ago":"5 天前","answers":[{"nick":"用了三年","text":"三年了没垂，关节那里有螺丝，松了可以自己拧紧。"},{"nick":"i***7","text":"我的用了一年多，停在哪儿还是哪儿。"},{"nick":"老款用了很多年","text":"家里上一代的同款用了很多年，只换过一次弹簧。"}]},{"q":"芥末黄会不会太跳？","nick":"家里是原木风","ago":"11月9日","answers":[{"nick":"原木书桌","text":"配原木很好看，黄得偏暗偏暖，不刺眼。"},{"nick":"家里很素","text":"我家装修很素，它是屋里唯一的亮色，刚刚好。"}]}],"bedding":[{"q":"会起球掉毛吗？","nick":"皮肤容易痒","ago":"10月28日","answers":[{"nick":"洗了十几次","text":"不起球，新的头两次洗有浮毛，单独洗两遍就好了。"},{"nick":"睡衣粘过毛","text":"第一周睡衣上粘了点毛，之后没有了。"}]},{"q":"会缩水吗？","nick":"被芯刚好两米乘两米三","ago":"4 天前","answers":[{"nick":"被芯同尺寸","text":"本身是洗过的，再洗基本不缩，我的被芯塞进去还是正好。"},{"nick":"r***c","text":"烘干机高温烘过一次，小了一点点，后来都是晾干。"},{"nick":"晾干就行","text":"不要高温烘，自然晾干没问题。"}]},{"q":"夏天睡会热吗？","nick":"怕热","ago":"11月8日","answers":[{"nick":"广州一年四季","text":"比磨毛的凉快，比凉席暖，开着空调睡正好。"},{"nick":"贴身干爽","text":"出汗不会粘在身上，这点比化纤的好很多。"}]}],"turntable":[{"q":"需要另外买音箱吗？","nick":"什么都没有","ago":"10月30日","answers":[{"nick":"配了一对有源音箱","text":"要，它自己没有喇叭，接一对带功放的音箱就行，线是附带的。"},{"nick":"客厅有旧音箱","text":"我用线接到家里旧音箱的音频输入口，也能响。"}]},{"q":"会伤唱片吗？","nick":"唱片比机器贵","ago":"6 天前","answers":[{"nick":"听了一年","text":"正常放没问题，唱针脏了记得用小刷子刷，针磨钝了要换。"},{"nick":"n***8","text":"针压出厂是固定的，在安全范围里，我的唱片没有被刮。"},{"nick":"唱片要擦","text":"比起机器，唱片上的灰更伤，放之前擦一下。"}]},{"q":"新手好上手吗？要调什么","nick":"完全小白","ago":"11月4日","answers":[{"nick":"小白已上手","text":"装上皮带和唱盘，插线，按开始，就这三步。"},{"nick":"皮带装了半天","text":"唯一的难点是套皮带，照着说明书的图五分钟能弄好。"}]}],"humid":[{"q":"没有雾，真的在加湿吗？","nick":"习惯看到雾气","ago":"10月27日","answers":[{"nick":"湿度计说话","text":"在的，放个湿度计就知道，一两个小时能升十几个点。"},{"nick":"手放上去凉凉的","text":"手放在出风口上面能感觉到凉凉的潮气。"}]},{"q":"清洗麻烦吗？","nick":"怕发霉","ago":"3 天前","answers":[{"nick":"每月洗一次","text":"里面的滤网和水盆都能拿出来冲，一个月洗一次，十分钟。"},{"nick":"z***6","text":"零件比普通的多几个，第一次拆要看说明书。"},{"nick":"懒人两周一冲","text":"水别放着不换，几天不用就倒掉晾干。"}]},{"q":"能直接用自来水吗？","nick":"不想买纯净水","ago":"11月6日","answers":[{"nick":"自来水用户","text":"可以，气化式的不会在家具上留一层粉，我一直用自来水。"},{"nick":"北方水硬","text":"能用，就是水硬的地方滤网上会结水垢，要泡柠檬酸。"}]}],"choc":[{"q":"天热寄过来会化吗？","nick":"南方高温","ago":"9月20日","answers":[{"nick":"广州收货","text":"九月收到的，外面加了冰袋，有一两颗表面有点软。"}]},{"q":"甜不甜？不爱吃甜的能接受吗","nick":"不爱甜食","ago":"10月28日","answers":[{"nick":"黑巧派","text":"牛奶和白巧挺甜，黑巧那几颗不腻，配茶刚好。"},{"nick":"甜食爱好者","text":"一次吃两颗刚好，多了会腻。"}]},{"q":"送客户体面吗？","nick":"年底送客户","ago":"2 天前","answers":[{"nick":"行政小姐姐","text":"金色盒子很体面，客户收到都会拍照。"},{"nick":"s***e","text":"体面，金色看着喜庆，过年送长辈也合适。"}]}],"twg":[{"q":"晚上喝会睡不着吗？","nick":"咖啡因敏感","ago":"10月26日","answers":[{"nick":"下午茶时间","text":"是红茶，对咖啡因敏感的话，下午三点以后就别喝了。"}]},{"q":"加奶好喝吗？","nick":"奶茶爱好者","ago":"4 天前","answers":[{"nick":"自制奶茶","text":"泡浓一点再加热牛奶，是带果香的奶茶，很好喝。"},{"nick":"d***a","text":"我还是喜欢清饮，加了奶果香就淡了。"}]},{"q":"一罐能泡多少次？","nick":"精打细算的茶客","ago":"10月11日","answers":[{"nick":"每天一壶","text":"一百克，每次放两三克，能泡三四十壶。"}]}],"beans":[{"q":"酸不酸？不喜欢酸的能喝吗","nick":"怕酸","ago":"10月30日","answers":[{"nick":"只喝美式","text":"有一点柑橘的酸，很柔和，不是那种尖酸。"},{"nick":"怕酸星人","text":"我还是觉得有点酸，水温高一点会好些。"}]},{"q":"做拿铁合适吗？","nick":"拿铁续命","ago":"11月8日","answers":[{"nick":"家里有意式机","text":"做拿铁有坚果和焦糖的味道，奶香盖不住，挺好。"}]},{"q":"开封后多久喝完？","nick":"一个人喝","ago":"10月13日","answers":[{"nick":"一人份","text":"开封后挤掉空气夹好，一个人三周左右喝完，味道还新鲜。"}]}],"moet":[{"q":"甜不甜？不常喝酒能喝吗","nick":"酒量很小","ago":"10月27日","answers":[{"nick":"偶尔喝一点","text":"是干型的，不甜，有点酸爽，不常喝的可能会觉得有点涩。"},{"nick":"生日开一瓶","text":"气泡很细，入口清爽，我这种不会喝的也能喝一杯。"}]},{"q":"开瓶危险吗？","nick":"第一次开香槟","ago":"5 天前","answers":[{"nick":"学会开瓶了","text":"握住瓶塞慢慢转瓶身，别对着人，噗的一声很好听。"}]},{"q":"要冰多久再喝？","nick":"准备周五开","ago":"10月19日","answers":[{"nick":"周五仪式感","text":"冰箱冷藏三四个小时，或者冰桶加冰水泡二十分钟。"}]}],"moutai":[{"q":"送长辈拿得出手吗？","nick":"过年见家长","ago":"10月25日","answers":[{"nick":"第一次上门","text":"拿得出手，我爸看到盒子就笑了，说留着过年开。"},{"nick":"准女婿","text":"准岳父收到没说话，饭后自己开了一瓶。"}]},{"q":"酒味冲不冲？平时不喝白酒","nick":"平时只喝啤酒","ago":"6 天前","answers":[{"nick":"啤酒党","text":"五十三度入口还是辣，但喝完嘴里一直是香的。"}]},{"q":"适合买来收藏吗？","nick":"收藏爱好者","ago":"10月8日","answers":[{"nick":"收藏一角","text":"我买来收着，立着放在阴凉的柜子里，打算等孩子结婚再开。"}]}],"dansk":[{"q":"甜不甜，老人能吃吗？","nick":"给爷爷奶奶","ago":"10月29日","answers":[{"nick":"爷爷的零食","text":"偏甜，黄油味很浓，老人家一次吃两三块就够。"},{"nick":"控糖中","text":"撒糖粒的那款最甜，控糖的少吃点。"}]},{"q":"一大罐吃不完会受潮吗？","nick":"独居的小林","ago":"11月10日","answers":[{"nick":"独居零食柜","text":"盖紧放了一个月还是酥的，铁盒很密封。"}]},{"q":"罐子吃完能装针线吗？","nick":"怀旧","ago":"10月3日","answers":[{"nick":"我妈的针线盒","text":"吃完就被我妈收走装针线了，跟小时候家里那个一模一样。"}]}],"haagen":[{"q":"快递路上会化吗？","nick":"南方","ago":"10月28日","answers":[{"nick":"收到还硬邦邦","text":"冷链保温箱送过来的，收到的时候还是硬的。"}]},{"q":"开了一桶吃不完能放多久？","nick":"一个人吃不完","ago":"上周","answers":[{"nick":"一次吃一半","text":"吃完把盖子压紧放回冷冻，一周内吃完口感都还好。"}]},{"q":"香草味会不会很甜？","nick":"抹茶控","ago":"10月16日","answers":[{"nick":"抹茶重度爱好者","text":"奶味很足，香草味不冲，甜度刚刚好。"},{"nick":"4***w","text":"我觉得偏甜一点，配杯热茶一起吃正好。"}]}],"oreo":[{"q":"太甜吗？","nick":"在戒甜食","ago":"10月29日","answers":[{"nick":"一次两块","text":"奶油夹心挺甜，饼干是微苦的，一起吃刚好。"},{"nick":"q**6","text":"夹心是甜的，怕甜可以把奶油刮掉一半再吃。"}]},{"q":"小包装方便带吗？","nick":"上班带零食","ago":"5 天前","answers":[{"nick":"工位零食","text":"一小包吃完刚好解馋，放工位抽屉里随手拿。"}]},{"q":"泡牛奶会不会一下就软掉？","nick":"泡牛奶党","ago":"10月17日","answers":[{"nick":"从小泡到大","text":"泡两三秒刚好，泡久了就散在牛奶里了。"}]}],"macallan":[{"q":"新手喝得惯吗？","nick":"没喝过威士忌","ago":"10月29日","answers":[{"nick":"入门就是它","text":"很适合入门，甜香明显，不冲，第一口可以加几滴水。"},{"nick":"喝惯啤酒的人","text":"毕竟四十度，第一口还是会辣一下，小口抿就好。"}]},{"q":"加冰还是纯饮？","nick":"刚买了杯子","ago":"5 天前","answers":[{"nick":"纯饮派","text":"我喜欢纯饮，室温下香味最足。"},{"nick":"加冰派","text":"夏天加一块大冰，甜味收一点，更清爽。"},{"nick":"c***c","text":"兑苏打水也好喝，不过用它兑有点可惜。"}]},{"q":"送长辈合适吗？","nick":"过节送礼","ago":"11月8日","answers":[{"nick":"送过两次","text":"合适，盒子体面，味道长辈也容易接受。"},{"nick":"我爸只喝白酒","text":"我爸喝了一杯说像甜酒，客气地放回柜子里了，要看人。"}]}],"bin407":[{"q":"需要醒酒吗？醒多久","nick":"没有醒酒器","ago":"10月30日","answers":[{"nick":"醒一小时","text":"需要，倒进醒酒器一个小时左右，涩感会下去很多。"},{"nick":"大玻璃壶代替","text":"没有醒酒器就倒在大玻璃壶里，或者倒进杯子多晃一会儿。"}]},{"q":"口感涩吗？平时喝甜酒","nick":"喝不惯干红","ago":"4 天前","answers":[{"nick":"从甜酒过来的","text":"是干红，不甜，会涩，配着肉吃就不觉得了。"},{"nick":"s***0","text":"喝惯甜酒的话可能觉得重，可以从半杯开始。"},{"nick":"单喝偏重","text":"我不配菜单喝会觉得口干，它是配餐的酒。"}]},{"q":"开了喝不完怎么保存？","nick":"独酌的人","ago":"11月7日","answers":[{"nick":"塞好放冰箱","text":"把瓶口塞紧放冰箱，三天内喝完没问题。"},{"nick":"一人慢慢喝","text":"我分三天喝，第二天最好，第三天果香淡了。"}]}],"dassai":[{"q":"要冰着喝吗？能加热吗","nick":"冬天想喝热的","ago":"10月27日","answers":[{"nick":"只喝冰的","text":"冰到十度左右最好，大吟酿不建议加热，香味会跑掉。"},{"nick":"热过一次","text":"我试过温热，果香没了，只剩酒味，后悔。"}]},{"q":"开瓶后能放多久？","nick":"一次喝不完","ago":"5 天前","answers":[{"nick":"冰箱放一周","text":"盖紧放冰箱，三四天内味道差不多，一周后就淡了。"},{"nick":"w***5","text":"我一般两天内喝完，第二天果香弱一点。"},{"nick":"做菜用掉","text":"放久了的我拿来蒸蛤蜊，也不浪费。"}]},{"q":"甜不甜？","nick":"不喜欢太甜的酒","ago":"11月6日","answers":[{"nick":"微甜而已","text":"有一点米的甜，不是糖水那种，收口是干净的。"},{"nick":"喜欢辣口的","text":"我喝惯了辣口的清酒，觉得它偏甜偏软。"}]}],"perrier":[{"q":"味道苦吗？第一次喝气泡水","nick":"只喝过汽水","ago":"10月28日","answers":[{"nick":"喝了三年","text":"没有甜味，有一点矿物质的味道，第一次可能觉得怪，冰着喝会好很多。"},{"nick":"加柠檬就好","text":"觉得淡就挤点柠檬汁，或者兑橙汁。"}]},{"q":"开了以后气能留多久？","nick":"喝得慢","ago":"4 天前","answers":[{"nick":"一口气喝完","text":"三百三十毫升一次就喝完了，不存在留的问题。"},{"nick":"g***5","text":"拧紧放冰箱，第二天还有气，没那么冲了。"},{"nick":"小瓶正合适","text":"所以我才买小瓶的，大瓶喝到后面都是水。"}]},{"q":"玻璃瓶运输会碎吗？","nick":"怕收到一箱水","ago":"11月5日","answers":[{"nick":"收过三箱","text":"三箱都完好，里面有纸隔板。"},{"nick":"碎过一瓶","text":"我有一次碎了一瓶，其他的没事，拆箱时小心点。"}]}],"macaron":[{"q":"很甜吗？","nick":"怕腻","ago":"10月29日","answers":[{"nick":"嗜甜如命","text":"甜，但是有杏仁香，柠檬和覆盆子带酸，没那么腻。"},{"nick":"不嗜甜","text":"对我来说偏甜，一枚配一杯黑咖啡刚好。"}]},{"q":"能放多久？","nick":"想周末送人","ago":"3 天前","answers":[{"nick":"冷藏四天","text":"冷藏三四天内吃最好，放久了外壳会吸潮变软。"},{"nick":"e***1","text":"要送人的话收到当天或者第二天送，别放太久。"},{"nick":"冷冻过","text":"我冷冻过几枚，吃之前放冷藏回温，口感差一点点。"}]},{"q":"运输会碎吗？","nick":"外地收货","ago":"11月6日","answers":[{"nick":"完好无损","text":"我的八枚都完好，盒子里有卡槽一枚一枚隔开。"},{"nick":"裂了一枚","text":"裂过一枚，壳太脆了，难免。"}]}],"haribo":[{"q":"很硬吗？小孩能嚼动吗","nick":"给五岁孩子","ago":"10月26日","answers":[{"nick":"五岁娃家长","text":"比普通软糖硬，五岁能嚼，但要看着吃，一次给几颗。"},{"nick":"我家嫌硬","text":"我家孩子嫌硬，放手心捂一会儿会软一点。"}]},{"q":"哪个味道最好吃？","nick":"好奇","ago":"6 天前","answers":[{"nick":"覆盆子永远第一","text":"覆盆子味的，每次都先挑完。"},{"nick":"菠萝派","text":"菠萝味最香，可惜一袋里没几只。"},{"nick":"不挑的人","text":"我抓一把混着吃，分不出来也挺好。"}]},{"q":"夏天会化了粘在一起吗？","nick":"住南方","ago":"11月4日","answers":[{"nick":"夏天买过","text":"会有点粘，但不会化成一坨，放冰箱里冻一下更有嚼劲。"},{"nick":"d***7","text":"我的到手时有几只粘在一起，掰开就行。"}]}],"chili":[{"q":"辣不辣？不太能吃辣","nick":"微辣选手","ago":"10月27日","answers":[{"nick":"江浙人","text":"我平时不吃辣也能接受，香比辣多，先放小半勺试试。"},{"nick":"湖南人","text":"对我来说基本不辣，就是个香味，要辣得另加小米辣。"},{"nick":"少放点就行","text":"有辣味的，小朋友吃的话要注意。"}]},{"q":"开盖后能放多久？","nick":"一个人吃得慢","ago":"3 天前","answers":[{"nick":"冰箱放三个月","text":"放冰箱，用干净没水的勺子舀，两三个月没问题。"},{"nick":"从来放不到","text":"我家一瓶最多吃三周，没研究过能放多久。"}]},{"q":"除了拌饭还能怎么吃？","nick":"想多点花样","ago":"11月8日","answers":[{"nick":"万物皆可拌","text":"拌面、蘸饺子、夹馒头、拌凉菜，我还试过抹吐司。"},{"nick":"炒饭必放","text":"炒饭出锅前放一勺，翻两下，比放酱油香。"},{"nick":"k***5","text":"煮泡面的时候加一勺，汤头立刻不一样。"}]}],"shin":[{"q":"很辣吗？","nick":"吃辣一般","ago":"10月28日","answers":[{"nick":"吃辣一般般","text":"有点辣，吃完鼻尖冒汗的程度，料包少放一点就行。"},{"nick":"无辣不欢","text":"对我来说刚开胃，还要再加辣椒粉。"},{"nick":"r***7","text":"加一片芝士或者一个蛋，辣度能降一档。"}]},{"q":"能用开水泡吗，还是必须煮？","nick":"宿舍不能用锅","ago":"4 天前","answers":[{"nick":"泡过","text":"能泡，盖上盖子泡六七分钟，但面没有煮的弹。"},{"nick":"一定要煮","text":"面粗，泡出来中间有点硬芯，还是煮的好吃。"}]},{"q":"加什么最好吃？","nick":"想升级一下","ago":"11月9日","answers":[{"nick":"芝士加蛋","text":"关火前打个蛋，盖一片芝士，标准答案。"},{"nick":"年糕派","text":"放几片年糕和鱼饼，就是一份简易部队锅。"}]}],"matcha":[{"q":"清饮会苦吗？","nick":"只喝过抹茶拿铁","ago":"10月29日","answers":[{"nick":"清饮半年","text":"微苦，但是不涩，后面是鲜和甜，水温别太高，八十度左右。"},{"nick":"用开水冲过","text":"我第一次用滚水冲，苦得皱眉，降了水温就好了。"}]},{"q":"没有茶筅能冲吗？","nick":"工具不全","ago":"5 天前","answers":[{"nick":"奶泡器代替","text":"用电动奶泡器打也行，沫没有茶筅的细，喝着差不多。"},{"nick":"摇摇杯","text":"我装在带盖的杯子里摇，做拿铁够了。"},{"nick":"v***1","text":"做拿铁可以凑合，想清饮还是买个茶筅，不贵。"}]},{"q":"做蛋糕用会不会浪费？","nick":"喜欢烘焙","ago":"11月7日","answers":[{"nick":"烘焙爱好者","text":"烤出来颜色很正，就是高温以后香味会损失，我只在做生巧和慕斯时用它。"},{"nick":"烤戚风用过","text":"有点可惜，烘焙可以用便宜一档的，这罐留着喝。"}]}],"olive":[{"q":"能炒菜吗？","nick":"只有这一种油","ago":"10月30日","answers":[{"nick":"中小火没事","text":"中小火炒菜、煎蛋都行，爆炒那种大火不合适，香味也浪费了。"},{"nick":"分开用","text":"我凉拌用它，大火炒菜用别的油。"}]},{"q":"味道苦吗？","nick":"听说橄榄油有苦味","ago":"4 天前","answers":[{"nick":"微苦微辣","text":"有一点青草的苦和喉咙的辣，拌进菜里吃不出来。"},{"nick":"直接喝过一勺","text":"单独尝有点辣喉咙，蘸面包就只剩香了。"},{"nick":"a***8","text":"比我买过的其他几种味道柔和。"}]},{"q":"开封后怎么保存？","nick":"用得慢","ago":"11月6日","answers":[{"nick":"橱柜里放着","text":"拧紧放在阴凉的橱柜里，不要放灶台边，也不用放冰箱。"},{"nick":"三个月用完","text":"开了尽量三个月内用完，放久了香味会淡。"}]}],"lego":[{"q":"要拼多久？","nick":"手速慢","ago":"10月29日","answers":[{"nick":"一个晚上","text":"我一个人拼了四个小时左右，分两个晚上完成的。"},{"nick":"慢慢拼三天","text":"不赶时间的话每天拼几枝，三四天，很放松。"}]},{"q":"带花瓶吗？配什么样的瓶子","nick":"家里没有花瓶","ago":"4 天前","answers":[{"nick":"高瓶子好看","text":"不带花瓶，我配了个二十多厘米高的窄口玻璃瓶，刚好拢住。"},{"nick":"t***5","text":"瓶口太大花会散开，可以在瓶里塞点东西固定。"},{"nick":"小瓶子插三枝","text":"我拆成几小束，分别插在几个小瓶子里。"}]},{"q":"会落灰吗？怎么清理","nick":"见不得灰","ago":"11月7日","answers":[{"nick":"化妆刷扫灰","text":"会落灰，用干净的大化妆刷扫一扫，一两个月一次。"},{"nick":"吹风机冷风","text":"我用吹风机冷风档吹，很快。"}]}]};

 if(d)return `${d} 天 ${h} 时`; if(h)return `${h} 时 ${m} 分`; if(m)return `${m} 分 ${sec} 秒`; return `${sec} 秒`;}

/* shop */
function shopList(){const k=q.trim().toLowerCase();return P.filter(p=>(cat==="全部"||p.cat===cat)&&(!k||(p.name+p.blurb+p.real+p.desc).toLowerCase().includes(k)));}
function card(p){return `<button class="card" data-open="${p.id}"><div class="art">${art(p,0)}${p.was?'<span class="flag">返场</span>':""}${isFav(p.id)?`<svg class="favmark" viewBox="0 0 24 24" aria-label="已收藏"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>`:""}${p.colors.length>1?`<span class="dots-c">${p.colors.slice(0,4).map(c=>`<i style="background:${c[1]}"></i>`).join("")}</span>`:""}</div><div class="nm">${esc(p.name)}</div><div class="row"><span class="tag"><small>¥</small>${fmt(p.price)}</span>${p.was?`<s>¥${fmt(p.was)}</s>`:""}</div><div class="meta">${p.sold} 人买过</div></button>`;}
function renderShop(){const l=shopList();view.innerHTML=l.length?`<div class="count">${cat==="全部"&&!q?"":esc(cat)+" · "}${l.length} 件</div><div class="grid">${l.map(card).join("")}</div>`:`<div class="none">没找到，换个词试试</div>`;}

/* cart */
const EMPTY=`<svg viewBox="0 0 160 120" aria-hidden="true"><path d="M20 50 L80 30 L140 50 L80 70 Z" class="krd"/><path d="M20 50 L80 70 V112 L20 92 Z" class="kr"/><path d="M140 50 L80 70 V112 L140 92 Z" class="kr" opacity=".85"/><path d="M20 50 L4 70 L64 90 L80 70 Z" class="kr"/><path d="M140 50 L156 70 L96 90 L80 70 Z" class="kr" opacity=".85"/></svg>`;
function renderCart(){
 if(!S.cart.length){view.innerHTML=`<h2 class="sec-title">购物车</h2><div class="empty">${EMPTY}<div>空空的</div><button class="btn sm" data-tab="shop">去逛逛</button></div>`;return;}
 const total=S.cart.reduce((a,i)=>a+BY[i.id].price*i.qty,0);
 view.innerHTML=`<h2 class="sec-title">购物车</h2><div class="cartpg"><div class="cart-list">${S.cart.map((i,k)=>{const p=BY[i.id];return `<div class="line"><div class="art" data-open="${p.id}" style="cursor:pointer">${art(p,i.ci)}</div><div><div class="nm">${esc(p.name)}</div><div class="meta">${esc(colorName(p,i.ci))}</div><span class="tag"><small>¥</small>${fmt(p.price)}</span></div><div class="step"><button data-dec="${k}" aria-label="减一件">−</button><span>${i.qty}</span><button data-inc="${k}" aria-label="加一件">+</button></div></div>`}).join("")}</div>
 <div class="sum"><div><div class="label">合计</div><div class="total">¥${fmt(total)}</div></div><button class="btn" style="flex:none" data-checkout="cart">去结算</button></div></div>`;
}

/* track */
function stageOf(p){let c=0;STAGES.forEach((s,i)=>{if(p>=s.t)c=i});return c;}
function parcel(o){
 const p=prog(o),c=stageOf(p),done=p>=1;
 const st=!done?`<span class="st go">${STAGES[c].label}</span>`:o.unboxed?`<span class="st">已拆箱</span>`:`<span class="st done">待拆箱</span>`;
 return `<article class="parcel" data-no="${o.no}"><div class="p-head"><span class="no">${o.no}</span>${o.demo?'<span class="demo">示例</span>':""}${st}</div>
 <div class="thumbs">${o.items.map(i=>`<div class="art">${art(BY[i.id],i.ci)}</div>`).join("")}</div>
 <div class="bar"><i style="width:${p*100}%"></i><b class="truck" style="left:${p*100}%">${TRUCK}</b></div>
 <ol class="stages">${STAGES.map((s,i)=>`<li class="${i<=c?"done":""}">${s.label}</li>`).join("")}</ol>
 <p class="where">${whereText(o)}</p>
 ${done&&!o.unboxed?`<button class="btn wide" data-unbox="${o.no}">拆箱</button>`:""}</article>`;
}
function whereText(o){const p=prog(o),c=stageOf(p);return p<1?`<b>${STAGES[c].place}</b> · 还要 ${fmtDur(o.placedAt+dur(o)-now())}`:o.unboxed?`已收进家当`:`<b>到门口了</b> · 去拆吧`;}
function renderTrack(){view.innerHTML=`<h2 class="sec-title">快递</h2>`+(S.orders.length?`<div class="parcels">${S.orders.map(parcel).join("")}</div>`:`<div class="empty">${EMPTY}<div>还没有包裹</div><button class="btn sm" data-tab="shop">去逛逛</button></div>`);}

/* me */
function jarSvg(){const lv=S.saved<=0?0:Math.max(.08,Math.min(1,Math.log10(S.saved)/6)),h=Math.round(72*lv);let edges="";for(let y=104;y>104-h;y-=8)edges+=`<ellipse cx="48" cy="${y}" rx="27" ry="3" class="coin-edge"/>`;
 return `<svg viewBox="0 0 96 112" aria-hidden="true"><defs><clipPath id="jc"><path d="M20 26 h56 v70 a10 10 0 0 1 -10 10 h-36 a10 10 0 0 1 -10 -10z"/></clipPath></defs><rect x="24" y="6" width="48" height="13" rx="4" class="lidc"/><path d="M18 22 h60 v74 a12 12 0 0 1 -12 12 h-36 a12 12 0 0 1 -12 -12z" class="glass"/><g clip-path="url(#jc)"><rect x="18" y="${108-h}" width="60" height="${h}" class="coins"/>${edges}</g></svg>`;}
function ownCard(x,i){const p=BY[x.id],left=coolLeft(x),f=Math.min(1,1-left/coolDur());
 const tail=x.enough?`<div class="keep">有这个就够了</div>`:left>0?`<div class="cool"><span>冷静中</span><b data-cool="${i}">${fmtDur(left)}</b></div><div class="coolbar"><i data-coolbar="${i}" style="width:${f*100}%"></i></div>`:`<button class="btn sm" data-real="${i}">还想要真的？</button>`;
 const rv=reviewed(p.id)?`<span class="meta">已评价</span>`:`<button class="small-link" data-write="${p.id}" data-wci="${x.ci||0}">写评价</button>`;
 return `<div class="own"><div class="art" data-open="${p.id}" style="cursor:pointer">${art(p,x.ci)}</div><div class="nm">${esc(p.name)}${x.qty>1?` ×${x.qty}`:""}</div><div class="row">${x.demo?'<span class="demo">示例</span>':""}${rv}</div>${tail}</div>`;}
const reviewed=id=>API?!!(ME&&ME.reviewed&&ME.reviewed.includes(id))||board(id).reviews.some(r=>r.mine):S.myReviews.some(r=>r.id===id);
const owns=id=>S.owned.find(x=>x.id===id);
const myReviewCount=()=>API?(ME&&ME.counts?ME.counts.r:0):S.myReviews.length;
function admHtml(){if(!admList)return `<p class="hint">读取中…</p>`;if(!admList.length)return `<div class="none">没有被举报的</div>`;
 return admList.map(x=>{const p=BY[x.pid];return `<div class="adm"><div class="meta">${esc(p?p.name:x.pid)} · ${{r:"评价",q:"提问",a:"回答"}[x.kind]||""} · ${esc(x.nick)} · ${x.hidden===2?"已删":x.hidden===1?"已自动隐藏":"显示中"} · 举报 ${x.reports}</div><p>${esc(x.text)}</p><div class="acts">${x.hidden?`<button class="del" data-admset="${x.id}" data-h="0">恢复</button>`:""}${x.hidden!==2?`<button class="del" data-admset="${x.id}" data-h="2">删除</button>`:""}</div></div>`;}).join("");}
function loadAdmin(){if(!API||!ADM)return;api("/api/admin/reported").then(j=>{admList=j.posts;if(tab==="me"&&!cur&&$("admList"))$("admList").innerHTML=admHtml();},e=>{if(e.status===403){ADM="";lsSet("gjj-admin",null);if(tab==="me"&&!cur)rerenderKeep();}});}
function renderMe(){
 view.innerHTML=`<h2 class="sec-title">我的</h2><div class="mepg">
 <section class="jar">${jarSvg()}<div><div class="label">一共省下</div><div class="big">¥${fmt(S.saved)}</div><div class="subline">下单 ${S.orders.length} 次 · 拆箱 ${S.unboxCount} 个 · 评价 ${myReviewCount()} 条</div></div></section>
 <div class="me-main"><h3>家当<small>${S.owned.reduce((a,x)=>a+x.qty,0)} 件</small></h3>
 <p class="hint">到手七天还惦记，再去买真的。</p>
 ${S.owned.length?`<div class="owned">${S.owned.map(ownCard).join("")}</div>`:`<div class="none">拆了箱的东西会摆在这里</div>`}
 <h3>收藏 <small>${S.favs.length} 件</small></h3>
 ${S.favs.length?`<div class="grid">${S.favs.filter(id=>BY[id]).map(id=>card(BY[id])).join("")}</div>`:`<div class="none">在商品页点心形就能收藏</div>`}</div>
 <div class="me-set"><h3 data-adm>设置</h3>
 ${API?`<div class="setrow"><div><b>昵称</b><p>${ME?esc(ME.nick):"第一次发言时随机起一个"}</p></div><button class="btn sm ghost" data-nick>改</button></div>`:""}
 <div class="setrow"><div><b>体验模式</b><p>时间快 720 倍，快递几分钟到，冷静期十几分钟满</p></div><button class="sw" role="switch" aria-checked="${S.fast}" aria-label="体验模式" data-fast></button></div>
 <button class="btn ghost wide reset" data-reset>${resetArm?"再点一次，全部清空":"清空重来"}</button>
 ${API&&ADM?`<h3>管理 <small>被举报的</small></h3><div id="admList">${admHtml()}</div><button class="btn ghost wide reset" data-admout>退出管理</button>`:""}</div></div>`;
}

/* ---------- views ---------- */
function sig(){return tab+"|"+S.fast+"|"+S.orders.map(o=>o.no+(prog(o)>=1?1:0)+(o.unboxed?1:0)).join()+"|"+S.owned.map(x=>(coolLeft(x)>0?0:1)+(x.enough?1:0)).join();}
function render(){
 const w=wide(),off=!!cur||tab!=="shop";
 $("top").hidden=!!cur&&!w; $("shopTools").hidden=!w&&off; $("chips").hidden=w&&off;
 if(cur)view.innerHTML=productPage();
 else if(tab==="shop")renderShop(); else if(tab==="cart")renderCart(); else if(tab==="track")renderTrack(); else renderMe();
 renderTabs(); lastSig=sig(); if(cur)wireGallery();
}
function rerenderKeep(){const y=window.scrollY;render();window.scrollTo(0,y);}
function live(){
 if(tab==="track"){S.orders.forEach(o=>{const el=view.querySelector(`[data-no="${o.no}"]`);if(!el)return;const p=prog(o),c=stageOf(p);
  el.querySelector(".bar i").style.width=p*100+"%";el.querySelector(".truck").style.left=p*100+"%";
  el.querySelectorAll(".stages li").forEach((li,i)=>li.classList.toggle("done",i<=c));el.querySelector(".where").innerHTML=whereText(o);});}

}
function setTab(t){if(cur){cur=null;navDepth=0;if(location.hash)location.hash="";}tab=t;window.scrollTo(0,0);render();if(t==="me"){refreshMe();loadAdmin();}}

/* ---------- sheets ---------- */
function setSheet(body,foot,keepScroll){const old=sheet.querySelector(".sh-body"),top=keepScroll&&old?old.scrollTop:0;
 sheet.innerHTML=`<div class="sh-body${foot?" has-foot":""}"><div class="grab"></div>${body}</div>${foot?`<div class="sh-foot">${foot}</div>`:""}`;
 const nb=sheet.querySelector(".sh-body");nb.scrollTop=top;}
function openSheet(body,foot){setSheet(body,foot);sheetWrap.hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>sheetWrap.classList.add("show")));setTimeout(()=>sheet.focus({preventScroll:true}),60);}
function closeSheet(){sheetWrap.classList.remove("show");setTimeout(()=>{sheetWrap.hidden=true;sheet.innerHTML="";},300);chk=null;}
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1800);}

function compareSet(p){let g=P.filter(x=>x.group===p.group&&x.id!==p.id);if(!g.length)g=P.filter(x=>x.cat===p.cat&&x.id!==p.id).sort((a,b)=>Math.abs(a.price-p.price)-Math.abs(b.price-p.price)).slice(0,2);return g.slice(0,3);}
const AVC=["#E2793A","#3D7BE0","#169E70","#B36AD6","#8A9A2B","#C79661","#2F8F9D","#7A6CE0"];
function stars(n){return `<span class="stars" aria-label="${n} 星">${"★".repeat(n)}<b>${"★".repeat(5-n)}</b></span>`;}
const hashStr=t=>[...t].reduce((a,ch)=>(a*31+ch.charCodeAt(0))>>>0,7);
function agoText(t){const d=now()-t;if(d<60e3)return "刚刚";if(d<HR)return Math.floor(d/60e3)+" 分钟前";if(d<DAY)return Math.floor(d/HR)+" 小时前";return Math.floor(d/DAY)+" 天前";}
function likeBtn(k,base,B,off){const on=B.liked(k);return `<button class="like" data-like="${k}" aria-pressed="${on}" aria-label="有用"${off?" disabled":""}>${SV_THUMB}<span>${base+B.likeN(k)}</span></button>`;}
// Your own posts get 删除; other people's get 举报 on the shared board; the admin can remove anything.
function postTool(x,kind,inline){const c=inline?"del in":"del";
 if(x.mine||(API&&ADM))return `<button class="${c}" data-del="${x.id}" data-dk="${kind}">删除</button>`;
 return API?`<button class="${c}" data-rep="${x.id}">举报</button>`:"";}
const MINE='<span class="mine">我的</span>',SAMPLE=''; // the shop's own reviews and answers carry no tag; one line above the reviews says they are made up
function rvHtml(nick,av,s,meta,text,follow,chip,act){return `<div class="rv"><div class="av" style="background:${av}">${esc([...nick][0]||"客")}</div><div><div class="rv-top"><b>${esc(nick)}${chip}</b>${stars(s)}</div><div class="rv-meta">${esc(meta)}</div><p>${esc(text)}</p>${follow?`<div class="follow"><em>追评</em>${esc(follow)}</div>`:""}<div class="rv-act">${act}</div></div></div>`;}
function reviewsSection(p){const B=board(p.id),o=owns(p.id),done=B.reviews.some(r=>r.mine)||(API&&reviewed(p.id));
 const act=o&&!done?`<button class="btn sm" data-write="${p.id}" data-wci="${o.ci||0}">写评价</button>`:(!o?`<span class="note">收到包裹后能写评价</span>`:"");
 return `<div class="sec-head"><h3>买家评价 <small>${p.sold} 条</small></h3>${act}</div><div class="rv-head"><div class="rv-score">${p.rating.toFixed(1)}</div><div>${stars(Math.round(p.rating))}<div class="rv-note">商品名均为谐音，自带的评价和问答是虚构的</div></div></div>`+
  (B.err?`<p class="board-note">大家的评价暂时没连上</p>`:"")+
  B.reviews.map(r=>{const k=API?"r:"+r.id:r.id;return rvHtml(r.nick,API?okColor(r.color):AVC[hashStr(r.nick)%AVC.length],r.stars,agoText(r.t)+(p.colors.length>1?" · "+colorName(p,r.ci):""),r.text,"",r.mine?MINE:"",likeBtn(k,0,B,API&&r.mine)+postTool(r,"r"));}).join("")+
  p.reviews.map((r,i)=>{const k=`s:${p.id}:${i}`;return rvHtml(r.nick,AVC[hashStr(r.nick)%AVC.length],r.stars,(r.ago||"")+(r.color?" · "+r.color:""),r.text,r.follow,SAMPLE,likeBtn(k,3+hashStr(p.id+i)%160,B));}).join("");}
function qaItem(p,B,qkey,x){const o=owns(p.id),ans=B.ans.filter(a=>a.parent===qkey),answered=ans.some(a=>a.mine);
 const seed=(x.sample||[]).map(a=>`<div class="qa-a"><i>答</i><div>${esc(a.text)} <small>${esc(a.nick)}${a.color?" · "+esc(a.color):""}</small></div></div>`).join("");
 const user=ans.map(a=>`<div class="qa-a"><i>答</i><div>${esc(a.text)} <small>${esc(a.nick)}${p.colors.length>1?" · "+esc(colorName(p,a.ci)):""}${a.mine?MINE:""}</small>${postTool(a,"a",true)}</div></div>`).join("");
 const meta=x.sample?`${esc(x.nick)} · ${esc(x.ago)}${SAMPLE}`:`${esc(x.nick)} · ${agoText(x.t)}${x.mine?MINE:""}${postTool(x,"q",true)}`;
 return `<div class="qa"><div class="qa-q"><i>问</i><div>${esc(x.text)}</div></div><div class="qa-meta">${meta}</div>${seed+user||'<div class="qa-wait">等收到包裹的人来答</div>'}${o&&!answered?`<button class="ask" data-ans="${qkey}" data-pid="${p.id}">我来答</button>`:""}</div>`;}
function qaSection(p){const B=board(p.id),qs=QA[p.id]||[];
 return `<div class="sec-head"><h3>问大家 <small>${qs.length+B.qs.length} 个问题</small></h3><button class="btn sm ghost" data-askq="${p.id}">提问</button></div>`+
  B.qs.map(x=>qaItem(p,B,API?"q:"+x.id:x.id,x)).join("")+
  qs.map((x,i)=>qaItem(p,B,`s:${p.id}:${i}`,{text:x.q,nick:x.nick,ago:x.ago,sample:x.answers||[]})).join("");}
function productBody(){const p=BY[cur.id],ci=cur.ci,o=compareSet(p),sl=slides(p,ci);
 const row=(x,me)=>{const d=x.price-p.price;return `<tr class="${me?"me":""}" ${me?"":`data-open="${x.id}"`}><td>${esc(x.name)}</td><td class="n">¥${fmt(x.price)}${me?"":`<span class="d ${d>0?"up":"down"}">${d>0?"贵":"省"} ¥${fmt(Math.abs(d))}</span>`}</td><td class="n">★ ${x.rating.toFixed(1)}</td><td class="n">${x.sold}</td></tr>`};
 return `<div class="pg-top"><div class="pg-media"><div class="gal" id="gal">${sl.map(([lab,svg])=>`<div class="slide">${svg}<span class="lab">${lab}</span></div>`).join("")}</div>
 <div class="gdots" id="gdots">${sl.map((_,i)=>`<i class="${i===0?"on":""}"></i>`).join("")}</div>
 <div class="gthumbs" id="gthumbs">${sl.map(([lab,svg],i)=>`<button class="gthumb${i===0?" on":""}" data-slide="${i}" aria-label="${lab}">${svg}</button>`).join("")}</div></div>
 <div class="pg-buybox"><h2>${esc(p.name)}</h2><p class="blurb">${esc(p.blurb)} · ★ ${p.rating.toFixed(1)} · ${p.sold} 人买过</p>
 <div class="pricebar"><span class="tag big"><small>¥</small>${fmt(p.price)}</span>${p.was?`<s>¥${fmt(p.was)}</s><span class="flag" style="position:static">返场价</span>`:""}</div>
 ${p.colors.length>1?`<div class="swatches"><span>颜色：${esc(colorName(p,ci))}</span>${p.colors.map((c,i)=>`<button class="swc" style="background:${c[1]}" data-ci="${i}" aria-pressed="${i===ci}" aria-label="${esc(c[0])}"></button>`).join("")}</div>`:""}
 <div class="actions pg-buy"><button class="btn ghost" data-add>加入购物车</button><button class="btn" data-buy>立即买</button><button class="icon-btn" data-fav="${p.id}" aria-pressed="${isFav(p.id)}" aria-label="收藏">${SV_HEART}</button></div>
 <h3>详情</h3><p class="desc">${esc(p.desc)}</p>${p.points.length?`<ul class="points">${p.points.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}</div></div>
 <div class="pg-more"><div class="pg-detail"> ${p.specs.length?`<h3>参数</h3><table class="specs"><tbody>${p.specs.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</tbody></table>`:""}
 <h3>比一比</h3><div class="cmp-wrap"><table class="cmp"><thead><tr><th>商品</th><th>价格</th><th>评分</th><th>买过</th></tr></thead><tbody>${row(p,true)}${o.map(x=>row(x,false)).join("")}</tbody></table></div></div>
 <div id="board">${reviewsSection(p)}${qaSection(p)}</div></div>`;}
function productPage(){return `<div class="pbar"><button class="icon-btn" data-back aria-label="返回">${SV_BACK}</button><div class="ptitle">商品详情</div><button class="icon-btn" data-fav="${cur.id}" aria-pressed="${isFav(cur.id)}" aria-label="收藏">${SV_HEART}</button></div>`+productBody();}

function miniProduct(p,ci){return `<div class="minip"><div class="art">${art(p,ci)}</div><div><div class="nm" style="min-height:0">${esc(p.name)}</div><div class="meta">${esc(colorName(p,ci))}</div></div></div>`;}
const signLine=()=>API?`<p class="fine">${ME?`署名「${esc(ME.nick)}」`:"会随机起个昵称"}，大家都看得见，在「我的」里能改名</p>`:"";
function openWrite(id,ci){const p=BY[id];draft={id,ci,stars:5};
 openSheet(`<h2>写评价</h2>${miniProduct(p,ci)}<div class="starpick">${[1,2,3,4,5].map(n=>`<button data-star="${n}" aria-pressed="true" aria-label="${n} 星">★</button>`).join("")}</div><textarea class="field" id="rvText" maxlength="300" placeholder="说说手感、颜色，或者拆箱那一下"></textarea>${signLine()}`,`<button class="btn wide" data-post>发表</button>`);}
function openAsk(id){const p=BY[id];draft={id};
 openSheet(`<h2>问问买过的人</h2>${miniProduct(p,0)}<textarea class="field" id="qText" style="margin-top:14px" maxlength="120" placeholder="比如：颜色和图片差得多吗"></textarea><p class="fine">收到这件包裹的人能来回答</p>${signLine()}`,`<button class="btn wide" data-postq>提问</button>`);}
function openAnswer(pid,qkey,qtext){const p=BY[pid];draft={id:pid,qkey};
 openSheet(`<h2>我来答</h2><div class="qa-q" style="margin:10px 0 14px"><i>问</i><div>${esc(qtext)}</div></div><textarea class="field" id="aText" maxlength="200" placeholder="说说你用下来的感受"></textarea>${signLine()}`,`<button class="btn wide" data-posta>回答</button>`);}
function openNick(){openSheet(`<h2>改昵称</h2><input class="field one" id="nickIn" maxlength="12" autocomplete="off" value="${esc(ME?ME.nick:"")}"><p class="fine">最多 12 个字</p>`,`<button class="btn wide" data-savenick>保存</button>`);}
function openAdmin(){openSheet(`<h2>管理</h2><input class="field one" id="admIn" type="password" autocomplete="off" placeholder="管理口令">`,`<button class="btn wide" data-admin>进入</button>`);}
// One path for reviews (r), questions (q) and answers (a): local array without API, the Worker with it.
function postNew(kind,text,extra){const pid=draft.id,MSG={r:"评价发好了",q:"问题发出去了",a:"回答好了"};
 const done=()=>{closeSheet();toast(MSG[kind]);if(cur)refreshBoard();else rerenderKeep();};
 if(!API){const t=now();if(kind==="r")S.myReviews.unshift({id:pid,ci:extra.ci,stars:extra.stars,text,at:t});
  else if(kind==="q")S.myQs.unshift({id:pid,text,at:t});else S.myAns.push({qkey:extra.parent,pid,text,ci:extra.ci,at:t});save();done();return;}
 const btn=sheet.querySelector(".sh-foot .btn");if(btn){if(btn.disabled)return;btn.disabled=true;}
 (async()=>{await ensureMe();if(kind!=="q")await syncOwned();return api(`/api/p/${encodeURIComponent(pid)}/posts`,"POST",{kind,text,...extra});})()
 .then(j=>{const c=RC[pid]||(RC[pid]={});if(!c.posts){c.posts=[];c.likes=c.likes||{};c.liked=c.liked||new Set();c.err=false;}c.posts.unshift(j.post);
  if(ME){ME.counts=ME.counts||{r:0,q:0,a:0};ME.counts[kind]=(ME.counts[kind]||0)+1;if(kind==="r")ME.reviewed=[...(ME.reviewed||[]),pid];saveMe();}done();},
  e=>{if(btn)btn.disabled=false;toast(e.message);});}
function delPost(id,kind){const pid=cur&&cur.id;
 if(!API){const at=+String(id).slice(3);if(kind==="r")S.myReviews=S.myReviews.filter(r=>r.at!==at);
  else if(kind==="q"){S.myQs=S.myQs.filter(x=>x.at!==at);S.myAns=S.myAns.filter(a=>a.qkey!==id);}else S.myAns=S.myAns.filter(a=>a.at!==at);
  save();toast("删了");refreshBoard();return;}
 api("/api/posts/"+id,"DELETE").then(()=>{const c=RC[pid],n=+id;if(c&&c.posts){const x=c.posts.find(y=>y.id===n);c.posts=c.posts.filter(y=>y.id!==n&&y.parent!=="q:"+n);
   if(x&&x.mine&&ME){if(ME.counts&&ME.counts[x.kind])ME.counts[x.kind]--;if(x.kind==="r"&&ME.reviewed)ME.reviewed=ME.reviewed.filter(v=>v!==pid);saveMe();}}
  toast("删了");refreshBoard();},e=>toast(e.message));}
function reportPost(id){const pid=cur&&cur.id;ensureMe().then(()=>api("/api/report","POST",{id})).then(()=>{S.rep.push(id);if(S.rep.length>500)S.rep=S.rep.slice(-500);save();toast("举报了，谢谢");refreshBoard();},e=>toast(e.message));}
function toggleLike(k){const pid=cur&&cur.id;if(!pid)return;
 if(!API){if(S.likes[k])delete S.likes[k];else S.likes[k]=1;save();refreshBoard();return;}
 const c=RC[pid];if(!c||!c.posts)return;c.busy=c.busy||new Set();if(c.busy.has(k))return;c.busy.add(k);
 const on=!c.liked.has(k),flip=v=>{v?c.liked.add(k):c.liked.delete(k);c.likes[k]=Math.max(0,(c.likes[k]||0)+(v?1:-1));};
 flip(on);refreshBoard();
 ensureMe().then(()=>api("/api/like","POST",{target:k})).then(j=>{j.liked?c.liked.add(k):c.liked.delete(k);c.likes[k]=j.likes;},e=>{flip(!on);toast(e.message);})
 .finally(()=>{c.busy.delete(k);if(cur&&cur.id===pid)refreshBoard();});}
// Two taps for anything that cannot be taken back.
function arm(t,armed,plain){if(t.dataset.armed)return true;t.dataset.armed=1;t.textContent=armed;setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent=plain;}},3000);return false;}
let admTaps=0,admT;

const goodsOf=items=>items.reduce((a,i)=>a+BY[i.id].price*i.qty,0);
const feeText=f=>f?`¥${fmt(f)}`:"包邮";
function checkoutBody(){const fee=SPEEDS[chk.speed].fee;
 return `<h2>结算</h2><ul class="mini">${chk.items.map(i=>`<li><span>${esc(BY[i.id].name)}${i.qty>1?` ×${i.qty}`:""} <small>${esc(colorName(BY[i.id],i.ci))}</small></span><span>¥${fmt(BY[i.id].price*i.qty)}</span></li>`).join("")}<li><span>运费 <small>${SPEEDS[chk.speed].name}</small></span><span>${feeText(fee)}</span></li></ul>
 <h3>怎么送</h3><div class="opts" role="radiogroup" aria-label="配送方式">${Object.entries(SPEEDS).map(([k,v])=>`<button class="opt" role="radio" aria-checked="${chk.speed===k}" data-speed="${k}"><b>${v.name}</b><small>${v.sub} · ${feeText(v.fee)}</small></button>`).join("")}</div>
 <div class="pay"><div class="cardface" id="cardface"><div class="t">过家家卡<b>∞</b></div><div><div class="num">6222 •••• •••• 1111</div><div class="lim">额度无限 · 不扣一分钱</div></div></div><div class="reader" id="reader"><span>刷这里</span><i></i></div></div>
 <p class="fine">不收真卡号，也不花真钱</p>`;}
const checkoutFoot=()=>{const total=goodsOf(chk.items)+SPEEDS[chk.speed].fee;return `<button class="btn wide" id="payBtn" data-pay>刷卡 ¥${fmt(total)}</button>`;};
function openCheckout(items,fromCart){chk={items,fromCart,speed:chk&&chk.speed||"today"};openSheet(checkoutBody(),checkoutFoot());}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=1320;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.12,a.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.16);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.18);setTimeout(()=>a.close(),400);}catch(e){}}
function pay(){const btn=$("payBtn");if(!btn||btn.disabled)return;btn.disabled=true;
 const c=chk;$("cardface").classList.add("swipe");
 setTimeout(()=>{beep();const r=$("reader");if(r)r.classList.add("ok");},430);
 setTimeout(()=>{const t=now(),d=new Date(t),goods=goodsOf(c.items),fee=SPEEDS[c.speed].fee,total=goods+fee;
  const o={no:`GJJ${String(d.getFullYear()).slice(2)}${pad(d.getMonth()+1)}${pad(d.getDate())}${Math.floor(1000+Math.random()*9000)}`,items:c.items.map(i=>({id:i.id,qty:i.qty,ci:i.ci||0})),total,fee,speed:c.speed,placedAt:t,unboxed:false};
  S.orders.unshift(o);S.saved+=total;if(c.fromCart)S.cart=[];save();renderTabs();if(tab!=="shop")render();
  setSheet(`<div class="ok-title">刷好了</div><div class="receipt">
  <div class="r-row"><span>订单号</span><b>${o.no}</b></div><div class="r-row"><span>标价</span><b>¥${fmt(goods)}</b></div><div class="r-row"><span>运费</span><b>${feeText(fee)}</b></div><div class="r-row"><span>实付</span><b>¥0</b></div>
  <div class="r-row big"><span>又省下</span><b>¥${fmt(total)}</b></div><div class="r-row"><span>${SPEEDS[o.speed].name} · 预计</span><b>${whenText(t+dur(o))}</b></div></div>`,
  `<button class="btn ghost" data-close>接着逛</button><button class="btn" data-go="track">看快递</button>`);chk=null;},1000);}

function openUnbox(no){const o=S.orders.find(x=>x.no===no);if(!o)return;
 openSheet(`<h2 style="text-align:center">包裹到了</h2><div class="stage" id="stage"><div class="glow"></div><div class="pop ${o.items.length>1?"many":""}">${o.items.slice(0,3).map(i=>art(BY[i.id],i.ci)).join("")}</div><div class="boxf">${BOX}</div><div class="lid">${LID}</div></div>
 <div class="unbox-before"><button class="btn wide" data-dounbox="${no}">拆！</button></div>
 <div class="unbox-after" hidden><p>${o.items.map(i=>esc(BY[i.id].name)+(i.qty>1?` ×${i.qty}`:"")).join("、")}</p><button class="btn wide" data-keep="${no}">收进家当</button></div>`);}
function doUnbox(){const st=$("stage");if(!st||st.classList.contains("open"))return;st.classList.add("open");sheet.querySelector(".unbox-before").hidden=true;
 const rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;setTimeout(()=>{const a=sheet.querySelector(".unbox-after");if(a)a.hidden=false;},rm?0:1000);}
function keep(no){const o=S.orders.find(x=>x.no===no);if(!o||o.unboxed)return;o.unboxed=true;S.unboxCount++;const t=now();
 o.items.forEach(i=>S.owned.unshift({id:i.id,qty:i.qty,ci:i.ci||0,at:t}));save();closeSheet();toast("收进家当了");render();}

function openReal(i){const x=S.owned[i];if(!x)return;const p=BY[x.id],code="GJJ-"+Math.random().toString(36).slice(2,6).toUpperCase();
 openSheet(`<div class="sh-art">${art(p,x.ci)}</div><h2>冷静了七天，还惦记</h2><p class="blurb">那就是真喜欢。真货叫 ${esc(p.real)}。</p>
 <div class="coupon"><span class="pct">9折</span><b>${code}</b><small>示例券，将来由商家出</small></div>`,
 `<button class="btn ghost" data-enough="${i}">有这个就够</button><a class="btn" href="https://www.amazon.com/s?k=${encodeURIComponent(p.real)}" target="_blank" rel="noopener">去看真的</a>`);}

function addToCart(id,ci){const c=S.cart.find(i=>i.id===id&&(i.ci||0)===ci);c?c.qty++:S.cart.push({id,qty:1,ci});save();renderTabs();}

/* ---------- actions ---------- */
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-open],[data-slide],[data-add],[data-buy],[data-close],[data-tab],[data-cat],[data-inc],[data-dec],[data-checkout],[data-speed],[data-pay],[data-go],[data-unbox],[data-dounbox],[data-keep],[data-real],[data-enough],[data-fast],[data-reset],[data-ci],[data-back],[data-fav],[data-like],[data-write],[data-star],[data-post],[data-del],[data-rep],[data-askq],[data-postq],[data-ans],[data-posta],[data-nick],[data-savenick],[data-adm],[data-admin],[data-admout],[data-admset]");
 if(!t)return;const d=t.dataset;
 if(d.open){openProduct(d.open);}
 else if(d.slide!==undefined){showSlide(+d.slide);}
 else if(d.ci!==undefined){pickColor(+d.ci);}
 else if("back" in d){goBack();}
 else if(d.fav){const id=d.fav,on=!isFav(id);S.favs=on?[id,...S.favs]:S.favs.filter(x=>x!==id);save();document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>b.setAttribute("aria-pressed",on));toast(on?"收藏了":"取消收藏");}
 else if(d.like){toggleLike(d.like);}
 else if(d.write){openWrite(d.write,+(d.wci||0));}
 else if(d.star){if(draft){draft.stars=+d.star;sheet.querySelectorAll("[data-star]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.star<=draft.stars));}}
 else if("post" in d){const x=(($("rvText")||{}).value||"").trim();if([...x].length<2){toast("多写几个字吧");return;}postNew("r",x,{stars:draft.stars,ci:draft.ci});}
 else if(d.del){if(arm(t,"再点一次删除","删除"))delPost(d.del,d.dk);}
 else if(d.rep){if(arm(t,"确定举报？","举报"))reportPost(+d.rep);}
 else if(d.askq){openAsk(d.askq);}
 else if("postq" in d){const x=(($("qText")||{}).value||"").trim();if([...x].length<2){toast("多写几个字吧");return;}postNew("q",x,{});}
 else if(d.ans){const qa=t.closest(".qa"),qt=qa?qa.querySelector(".qa-q div").textContent:"";openAnswer(d.pid,d.ans,qt);}
 else if("posta" in d){const x=(($("aText")||{}).value||"").trim();if([...x].length<2){toast("多写几个字吧");return;}const o=owns(draft.id);postNew("a",x,{parent:draft.qkey,ci:o?o.ci||0:0});}
 else if("nick" in d){ensureMe().then(openNick,e=>toast(e.message));}
 else if("savenick" in d){const v=(($("nickIn")||{}).value||"").trim();if(!v){toast("起个名字吧");return;}
  api("/api/me/nick","POST",{nick:v}).then(j=>{ME.nick=j.nick;saveMe();Object.values(RC).forEach(c=>(c.posts||[]).forEach(x=>{if(x.mine)x.nick=j.nick;}));closeSheet();toast("改好了");render();},e=>toast(e.message));}
 else if("adm" in d){clearTimeout(admT);admT=setTimeout(()=>{admTaps=0},2000);if(API&&++admTaps>=5){admTaps=0;openAdmin();}}
 else if("admin" in d){const v=(($("admIn")||{}).value||"").trim();if(!v)return;ADM=v;
  api("/api/admin/check").then(()=>{lsSet("gjj-admin",ADM);admList=null;closeSheet();toast("进入管理");render();loadAdmin();},()=>{ADM="";toast("口令不对");});}
 else if("admout" in d){ADM="";admList=null;lsSet("gjj-admin",null);render();toast("退出管理了");}
 else if(d.admset){if(+d.h===2&&!arm(t,"再点一次删除","删除"))return;
  api("/api/admin/hide","POST",{id:+d.admset,hidden:+d.h}).then(()=>{const x=(admList||[]).find(y=>y.id===+d.admset);if(x)delete RC[x.pid];toast(+d.h?"删了":"恢复了");loadAdmin();},e=>toast(e.message));}
 else if("add" in d){if(cur){addToCart(cur.id,cur.ci);toast("放进购物车了");}}
 else if("buy" in d){if(cur)openCheckout([{id:cur.id,qty:1,ci:cur.ci}],false);}
 else if("close" in d){closeSheet();}
 else if(d.tab){setTab(d.tab);}
 else if(d.cat){cat=d.cat;renderChips();renderShop();}
 else if(d.inc!==undefined){const c=S.cart[+d.inc];if(c)c.qty++;save();render();}
 else if(d.dec!==undefined){const c=S.cart[+d.dec];if(c){c.qty--;if(c.qty<=0)S.cart.splice(+d.dec,1);}save();render();}
 else if(d.checkout){if(S.cart.length)openCheckout(S.cart.map(i=>({...i})),true);}
 else if(d.speed){if(chk){chk.speed=d.speed;setSheet(checkoutBody(),checkoutFoot(),true);}}
 else if("pay" in d){pay();}
 else if(d.go){closeSheet();setTab(d.go);}
 else if(d.unbox){openUnbox(d.unbox);}
 else if(d.dounbox){doUnbox();}
 else if(d.keep){keep(d.keep);}
 else if(d.real!==undefined){openReal(+d.real);}
 else if(d.enough!==undefined){const x=S.owned[+d.enough];if(x)x.enough=true;save();closeSheet();render();}
 else if("fast" in d){S.fast=!S.fast;save();render();toast(S.fast?"体验模式开了":"回到真实时间");}
 else if("reset" in d){if(!resetArm){resetArm=true;render();setTimeout(()=>{if(resetArm){resetArm=false;if(tab==="me")render();}},4000);}else{resetArm=false;S=fresh();save();render();toast("清空了，重新开始");}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheetWrap.hidden)closeSheet();});
// On wide screens the search box is on every page; typing anywhere else goes back to the shelf.
$("q").addEventListener("input",e=>{q=e.target.value;if(cur||tab!=="shop")setTab("shop");else renderShop();});

renderChips();render();
if(MQ){const flip=()=>render();if(MQ.addEventListener)MQ.addEventListener("change",flip);else MQ.addListener(flip);}
window.addEventListener("hashchange",()=>{const h=decodeURIComponent(location.hash.slice(1));if(!sheetWrap.hidden)closeSheet();if(BY[h])showProduct(h);else{navDepth=0;leaveProduct();}});
{const h=decodeURIComponent(location.hash.slice(1));if(BY[h])showProduct(h);}
if(API&&(S.myReviews.length||S.myQs.length||S.myAns.length))migrate().then(()=>{for(const k in RC)delete RC[k];if(cur)loadBoard(cur.id);});
setInterval(()=>{if(cur)return;const s=sig();if(s!==lastSig){if(tab!=="shop")render();else{renderTabs();lastSig=s;}}else live();},1000);
})();
</script>
