<title>赛博过家家</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout, phones: one column. Sticky shop header (search + aisles), a two-up shelf of toy-tagged goods,
   a fixed four-tab bar, and bottom sheets (scrolling body + pinned footer) for product, checkout, unboxing.
   Layout, 900px and wider (see the media block at the end): one top bar holding logo, search and the menu,
   a four- or five-up shelf, two-column product, cart and profile pages, and sheets shown as centred dialogs.
   Kraft parcels and yellow price tags carry the identity. */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --tile:#E1E7F1; --ink:#17203A; --muted:#5C6684; --line:#D2D9E6;
  --accent:#0B7F86; --accent-ink:#FFFFFF; --tag:#FFC93A; --tag-ink:#2B2100; --kraft:#C79661; --kraft-dark:#9A6E3E; --ok:#169E70;
  --soft:#F4F6FA; --scrim:rgba(10,14,24,.45);
  --f-display:"ZCOOL KuaiLe","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-num:"Space Grotesk","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131D; --surface:#181E2D; --tile:#222A3D; --ink:#ECEFF7; --muted:#98A1BB; --line:#2B3349;
  --accent:#3CC4C4; --accent-ink:#062A2C; --tag:#FFD153; --tag-ink:#2B2100; --kraft:#B78852; --kraft-dark:#8B6236; --ok:#31BE8C;
  --soft:#1E2536; --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F131D; --surface:#181E2D; --tile:#222A3D; --ink:#ECEFF7; --muted:#98A1BB; --line:#2B3349;
  --accent:#3CC4C4; --accent-ink:#062A2C; --tag:#FFD153; --tag-ink:#2B2100; --kraft:#B78852; --kraft-dark:#8B6236; --ok:#31BE8C;
  --soft:#1E2536; --scrim:rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-size:28px;line-height:1;letter-spacing:1px}
.logo i{font-style:normal;color:var(--accent)}
.saved-pill{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}
.saved-pill b{font-family:var(--f-num);color:var(--ink);font-size:13px;margin-left:4px}
.search{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.search:focus-within{border-color:var(--accent)}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{border:0;outline:0;background:transparent;color:var(--ink);font:inherit;flex:1;min-width:0;height:100%}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-btn{flex:none;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 14px;font-size:14px}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* shelf */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;padding-top:6px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:18px}
.art{aspect-ratio:1;max-width:100%;background:var(--tile);border-radius:18px;display:grid;place-items:center;overflow:hidden;position:relative}
.art svg{width:76%;height:76%}
.art img.ph{width:100%;height:100%;object-fit:cover;display:block}
.flag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 7px}
.dots-c{position:absolute;right:8px;bottom:8px;display:flex;gap:3px}
.dots-c i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--surface)}
.nm{font-size:14px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{position:relative;display:inline-flex;align-items:baseline;background:var(--tag);color:var(--tag-ink);font-family:var(--f-num);font-weight:700;font-size:16px;line-height:1.3;padding:2px 10px 2px 17px;border-radius:4px 9px 9px 4px;font-variant-numeric:tabular-nums}
.tag::before{content:"";position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--bg)}
.sheet .tag::before{background:var(--surface)}
.tag small{font-size:11px;font-weight:500;margin-right:1px}
.tag.big{font-size:24px;padding:4px 14px 4px 22px}
.tag.big::before{left:8px;width:8px;height:8px;margin-top:-4px}
s{color:var(--muted);font-family:var(--f-num);font-size:12px}
.meta{font-size:12px;color:var(--muted)}
.none{padding:48px 0;text-align:center;color:var(--muted)}
.count{font-size:12px;color:var(--muted);margin:2px 0 8px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0;font-size:12px;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] svg{stroke:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-num);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* sheets: scrolling body + optional pinned footer */
.sheet-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.sheet{position:relative;width:100%;max-width:520px;max-height:92%;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;overflow:hidden;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);outline:none}
.sheet-wrap.show .scrim{opacity:1}
.sheet-wrap.show .sheet{transform:none}
.sh-body{flex:1 1 auto;min-height:0;overflow:auto;padding-block:10px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sh-body.has-foot{padding-block:10px 18px}
.sh-foot{flex:none;display:flex;gap:10px;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sh-art{background:var(--tile);border-radius:20px;aspect-ratio:16/10;max-width:100%;display:grid;place-items:center}
.sh-art svg{height:82%;width:auto;max-width:100%}
h2{font-family:var(--f-display);font-weight:400;font-size:25px;line-height:1.25;margin:14px 0 4px;text-wrap:balance}
h3{font-size:16px;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
h3 small{font-weight:400;color:var(--muted);font-size:13px}
.blurb{margin:0;color:var(--muted)}
.pricebar{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}

/* gallery */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:20px;background:var(--tile);scrollbar-width:none;overscroll-behavior-x:contain}
.gal::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/10;max-width:100%;position:relative}
.slide>svg{display:block;width:100%;height:100%}
.slide{overflow:hidden}
.slide>img{display:block;width:100%;height:100%;object-fit:cover}
.slide>img.zoom{transform:scale(2.2)}
.slide .lab{position:absolute;left:10px;bottom:10px;font-size:11px;background:var(--surface);color:var(--muted);border-radius:6px;padding:1px 8px}
.gdots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.gdots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s,background .2s}
.gdots i.on{width:16px;background:var(--ink)}
.sc-wall{fill:var(--tile)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.swatches span{font-size:13px;color:var(--muted);margin-right:4px}
.swc{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.swc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.swc:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* details */
.desc{margin:0;line-height:1.75}
.points{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.points li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.points li::before{content:"✓";flex:none;width:18px;height:18px;margin-top:2px;border-radius:50%;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);font-size:11px;font-weight:700;display:grid;place-items:center}
table.specs{width:100%;border-collapse:collapse;font-size:14px}
.specs th{width:34%;text-align:left;font-weight:400;color:var(--muted);padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.specs td{padding:8px 0;border-bottom:1px solid var(--line)}

/* compare */
.cmp-wrap{overflow-x:auto}
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th{font-weight:500;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.cmp td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.cmp tr.me td{background:var(--tile)}
.cmp tr.me td:first-child{border-radius:10px 0 0 10px}
.cmp tr.me td:last-child{border-radius:0 10px 10px 0}
.cmp tr[data-open]{cursor:pointer}
.cmp .d{display:block;font-size:11px}
.cmp .up{color:var(--accent)}
.cmp .down{color:var(--ok)}

/* reviews */
.rv-head{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:12px 14px}
.rv-score{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1}
.stars{color:var(--tag);letter-spacing:1px;font-size:13px}
.stars b{color:var(--line);font-weight:400}
.rv-note{font-size:12px;color:var(--muted);margin-top:2px}
.rv{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:#FFFFFF}
.rv-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rv-top b{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-meta{font-size:12px;color:var(--muted)}
.rv p{margin:4px 0 0;font-size:14px;line-height:1.6}
.follow{margin-top:8px;background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.55}
.follow em{font-style:normal;color:var(--accent);font-weight:500;margin-right:4px}

.actions{display:flex;gap:10px;margin-top:20px}
.btn{appearance:none;border:0;cursor:pointer;font-weight:700;border-radius:14px;padding:11px 18px;background:var(--accent);color:var(--accent-ink);flex:1;text-align:center;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:46px;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px;border-radius:10px;flex:none}
.btn.wide{width:100%;flex:none}
.btn[disabled]{opacity:.6;cursor:default}
.btn:focus-visible,.chip-btn:focus-visible,.opt:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cart */
.line{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .art{border-radius:12px}
.line .nm{min-height:0}
.line .meta{margin:2px 0 4px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;font-size:18px}
.step span{min-width:22px;text-align:center;font-family:var(--f-num)}
.sum{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:14px 14px 14px 18px;background:var(--surface);border-radius:18px;border:1px solid var(--line)}
.sum .total{font-family:var(--f-num);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.sum .label{font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:56px 0 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.empty svg{width:120px;height:auto}

/* checkout */
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.mini li span:last-child{font-family:var(--f-num);white-space:nowrap}
.mini li small{color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.opt b{font-size:14px}
.opt small{color:var(--muted);font-size:12px}
.opt[aria-checked="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.pay{position:relative;height:168px;margin-top:18px}
.cardface{position:absolute;top:0;left:50%;margin-left:-110px;width:220px;height:134px;border-radius:16px;padding:14px 16px;color:#FFFFFF;background:linear-gradient(135deg,#0B7F86,#3FB6C2);display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px rgba(23,32,58,.18);z-index:1}
.cardface .t{display:flex;justify-content:space-between;align-items:flex-start;font-family:var(--f-display);font-size:18px}
.cardface .t b{font-family:var(--f-num);font-size:30px;line-height:.9}
.cardface .num{font-family:var(--f-num);letter-spacing:2px;font-size:15px}
.cardface .lim{font-size:11px;opacity:.9}
.cardface.swipe{animation:swipe .95s ease-in-out}
@keyframes swipe{0%{transform:translateY(0)}45%{transform:translateY(62px)}100%{transform:translateY(0)}}
.reader{position:absolute;bottom:0;left:50%;margin-left:-125px;width:250px;height:50px;background:var(--ink);border-radius:12px 12px 16px 16px;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--bg);font-size:12px}
.reader::before{content:"";position:absolute;top:7px;left:18px;right:18px;height:4px;border-radius:2px;background:var(--bg);opacity:.35}
.reader i{width:11px;height:11px;border-radius:50%;background:var(--tag);transition:background .2s,box-shadow .2s}
.reader.ok i{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.fine{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0}
.ok-title{font-family:var(--f-display);font-size:28px;text-align:center;margin:8px 0 12px}
.receipt{background:var(--bg);border-radius:14px 14px 0 0;padding:14px 16px 18px;position:relative;margin-bottom:16px}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:radial-gradient(circle at 7px 10px,var(--surface) 6px,var(--bg) 6.5px) 0 0/14px 10px repeat-x}
.r-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.r-row:last-child{border-bottom:0}
.r-row span{color:var(--muted)}
.r-row b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.r-row.big b{font-size:24px;font-weight:700;color:var(--accent)}

/* parcels */
.sec-title{font-family:var(--f-display);font-weight:400;font-size:22px;margin:10px 0 4px}
.parcel{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;overflow:hidden}
.parcel::before{content:"";position:absolute;top:0;bottom:0;right:28px;width:30px;background:var(--kraft);opacity:.16}
.p-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative}
.no{font-family:var(--f-num);font-size:13px;color:var(--muted);letter-spacing:.5px;margin-right:auto}
.st{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--tile)}
.st.go{background:var(--tag);color:var(--tag-ink)}
.st.done{background:var(--ok);color:var(--accent-ink)}
.demo{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:0 6px}
.thumbs{display:flex;gap:8px;margin:12px 0 0;position:relative}
.thumbs .art{width:56px;border-radius:12px}
.bar{position:relative;height:8px;border-radius:4px;background:var(--tile);margin:30px 0 8px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--kraft);transition:width 1s linear}
.truck{position:absolute;top:-24px;width:32px;height:22px;transform:translateX(-50%);transition:left 1s linear}
.truck svg{display:block;width:100%;height:100%}
.kr{fill:var(--kraft)} .krd{fill:var(--kraft-dark)} .tink{fill:var(--ink)} .tapef{fill:var(--tag);opacity:.9}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));font-size:11px;color:var(--muted);text-align:center}
.stages li.done{color:var(--ink);font-weight:500}
.where{font-size:13px;margin:10px 0 0;color:var(--muted);position:relative}
.where b{color:var(--ink);font-weight:500}
.parcel .btn{margin-top:12px;position:relative}

/* unboxing */
.stage{position:relative;height:236px;width:220px;margin:4px auto 0}
.boxf,.lid,.pop,.glow{position:absolute}
.boxf{left:30px;bottom:0;width:160px;height:110px;z-index:2}
.lid{left:22px;bottom:104px;width:176px;height:32px;z-index:3;transform-origin:20% 100%}
.pop{left:50%;bottom:24px;z-index:1;display:flex;gap:6px;transform:translate(-50%,40px) scale(.45);opacity:0}
.pop svg{width:104px;height:104px}
.pop.many svg{width:72px;height:72px}
.pop img.ph{width:104px;height:104px;object-fit:cover;border-radius:14px}
.pop.many img.ph{width:72px;height:72px}
.glow{left:50%;top:10px;width:180px;height:180px;margin-left:-90px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--tag) 55%,transparent),transparent 65%);opacity:0;transform:scale(.6)}
.stage.open .lid{transform:translate(-26px,-74px) rotate(-30deg);opacity:0;transition:transform .55s cubic-bezier(.3,.7,.3,1),opacity .4s .25s}

/* home */

.hint{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.keep{font-size:12px;color:var(--ok)}

.sw{flex:none;cursor:pointer;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;border:0;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .2s}

.reset{margin-top:12px}
.coupon{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 14px;align-items:center;border:1.5px dashed var(--accent);border-radius:14px;padding:12px 16px;margin:16px 0}
.coupon .pct{grid-row:span 2;font-family:var(--f-display);font-size:32px;color:var(--accent);line-height:1}

.coupon small{color:var(--muted);font-size:12px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:40;max-width:calc(100% - 32px)}

/* product page */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;background:var(--bg);padding-block:10px}
.ptitle{flex:1;min-width:0;text-align:center;font-weight:500;color:var(--muted);font-size:14px}

.icon-btn svg{width:20px;height:20px}
.icon-btn:focus-visible,.pf-ic:focus-visible,.like:focus-visible,.ask:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[data-fav][aria-pressed="true"]{color:var(--accent)}

.like{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:8px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-family:var(--f-num)}

.del{all:unset;cursor:pointer;font-size:12px;color:var(--muted);margin-top:8px}

.ask{all:unset;cursor:pointer;font-size:12px;color:var(--accent);margin:6px 0 0 28px}
.starpick{display:flex;gap:8px;justify-content:center;margin:14px 0}

.minip{display:flex;gap:12px;align-items:center}

.del.in{margin:0 0 0 8px}

.board-note{font-size:12px;color:var(--muted);margin:10px 0 0}
.adm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:13px}

.adm .meta{font-size:12px;color:var(--muted)}

/* pieces that only wide screens show */
[hidden]{display:none!important}
.hbar{display:contents}
.gthumbs,.pg-buy{display:none}

  .pbar{position:static;padding-block:6px 14px}

  .sheet-wrap{align-items:center;padding:24px}

const HR=3600e3, DAY=24*HR, COOL=7*DAY, ACCEL=720;
const SPEEDS={flash:{name:"闪电达",sub:"1 分钟",fee:30,ms:60e3},today:{name:"当日达",sub:"2 小时",fee:12,ms:2*HR},std:{name:"标准",sub:"2 天",fee:0,ms:2*DAY}};

const now=()=>Date.now();
const dur=o=>{const ms=SPEEDS[o.speed].ms;return (S.fast&&o.speed!=="flash")?Math.max(30e3,ms/ACCEL):ms};
const prog=o=>Math.min(1,Math.max(0,(now()-o.placedAt)/dur(o)));
const coolDur=()=>S.fast?COOL/ACCEL:COOL;
const coolLeft=x=>x.at+coolDur()-now();
const pad=n=>String(n).padStart(2,"0");
function fmtDur(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;
 if(d)return `${d} 天 ${h} 时`; if(h)return `${h} 时 ${m} 分`; if(m)return `${m} 分 ${sec} 秒`; return `${sec} 秒`;}
function whenText(t){const d=new Date(t),n=new Date(),hm=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
 const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(); const diff=Math.round((day(d)-day(n))/DAY);
 if(diff===0)return "今天 "+hm; if(diff===1)return "明天 "+hm; return `${d.getMonth()+1}月${d.getDate()}日 ${hm}`;}
const fmt=n=>n.toLocaleString("zh-CN");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

{const fix=i=>{const p=BY[i.id];if(p&&!p.colors[i.ci||0])i.ci=0;};S.cart.forEach(fix);S.orders.forEach(o=>(o.items||[]).forEach(fix));(S.owned||[]).forEach(fix);

const API="";/*__API__*/
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};

let ADM=lsGet("gjj-admin")||"",admList=null;

async function api(path,method,body){const h={};if(body)h["content-type"]="application/json";if(ME&&ME.token)h.authorization="Bearer "+ME.token;if(ADM)h["x-admin"]=ADM;
 let r;try{r=await fetch(API+path,{method:method||"GET",headers:h,body:body?JSON.stringify(body):undefined});}catch(e){throw new Error("连不上，稍后再试");}
 const j=await r.json().catch(()=>({}));
 if(r.status===401&&ME){ME=null;saveMe();}
 if(!r.ok){const e=new Error(r.status===401?"再试一次":j.error||"出了点问题");e.status=r.status;throw e;}return j;}
let meP=null;
function ensureMe(){if(ME&&ME.token)return Promise.resolve(ME);
 if(!meP)meP=api("/api/me","POST").then(j=>{ME={token:j.token,nick:j.nick,color:j.color,counts:{r:0,q:0,a:0},reviewed:[]};S.synced=[];save();saveMe();return ME;}).finally(()=>{meP=null});return meP;}
async function syncOwned(){await ensureMe();const need=[...new Set(S.owned.map(x=>x.id))].filter(id=>!S.synced.includes(id));
 if(need.length){await api("/api/orders","POST",{pids:need});S.synced.push(...need);save();}}
function refreshMe(){if(!API||!ME)return;api("/api/me").then(j=>{Object.assign(ME,{nick:j.nick,color:j.color,counts:j.counts,reviewed:j.reviewed});saveMe();if(tab==="me"&&!cur&&sheetWrap.hidden)rerenderKeep();},()=>{});}
function loadBoard(pid){if(!API)return;const c=RC[pid]||(RC[pid]={});if(c.loading)return;c.loading=true;
 api("/api/p/"+encodeURIComponent(pid)).then(j=>{c.posts=j.posts;c.likes=j.likes;c.liked=new Set(j.liked);c.err=false;},()=>{c.err=true;})
 .finally(()=>{c.loading=false;if(cur&&cur.id===pid)refreshBoard();});}
const okColor=c=>/^#[0-9A-Fa-f]{6}$/.test(c||"")?c:AVC[0];
function board(pid){
 if(!API){const L=k=>S.likes[k]?1:0;return{reviews:S.myReviews.filter(r=>r.id===pid).map(r=>({id:"me:"+r.at,stars:r.stars,ci:r.ci,text:r.text,t:r.at,nick:"我",mine:true})),
  qs:S.myQs.filter(x=>x.id===pid).map(x=>({id:"me:"+x.at,text:x.text,t:x.at,nick:"我",mine:true})),
  ans:S.myAns.filter(a=>a.pid===pid).map(a=>({id:"me:"+a.at,parent:a.qkey,text:a.text,ci:a.ci,t:a.at,nick:"我",mine:true})),
  likeN:L,liked:k=>!!S.likes[k],err:false};}
 const c=RC[pid]||{},ps=(c.posts||[]).filter(x=>!S.rep.includes(x.id));
 return{reviews:ps.filter(x=>x.kind==="r"),qs:ps.filter(x=>x.kind==="q"),ans:ps.filter(x=>x.kind==="a").sort((a,b)=>a.t-b.t),
  likeN:k=>(c.likes&&c.likes[k])||0,liked:k=>!!(c.liked&&c.liked.has(k)),err:!!c.err&&!c.posts};}
function refreshBoard(){const b=$("board");if(b&&cur){const p=BY[cur.id];b.innerHTML=reviewsSection(p)+qaSection(p);}}
const transient=e=>!e.status||e.status===401||e.status===429||e.status>=500;
// Posts written before the board went shared move up once, then leave this browser.
async function migrate(){if(!API||!(S.myReviews.length||S.myQs.length||S.myAns.length))return;
 try{await syncOwned();}catch(e){return;}
 const map={},post=(pid,b)=>api(`/api/p/${encodeURIComponent(pid)}/posts`,"POST",b);
 for(const r of [...S.myReviews].reverse()){try{await post(r.id,{kind:"r",stars:r.stars,ci:r.ci,text:r.text});}catch(e){if(transient(e))continue;}S.myReviews=S.myReviews.filter(x=>x!==r);}
 for(const x of [...S.myQs].reverse()){try{const j=await post(x.id,{kind:"q",text:x.text});map["me:"+x.at]="q:"+j.post.id;}catch(e){if(transient(e))continue;}S.myQs=S.myQs.filter(y=>y!==x);}
 for(const a of [...S.myAns]){const parent=map[a.qkey]||a.qkey;
  if(parent.startsWith("me:")){if(!S.myQs.some(x=>"me:"+x.at===a.qkey))S.myAns=S.myAns.filter(y=>y!==a);continue;}
  try{await post(a.pid,{kind:"a",parent,text:a.text,ci:a.ci});}catch(e){if(transient(e))continue;}S.myAns=S.myAns.filter(y=>y!==a);}
 save();refreshMe();}

/* track */
function stageOf(p){let c=0;STAGES.forEach((s,i)=>{if(p>=s.t)c=i});return c;}
function parcel(o){
 const p=prog(o),c=stageOf(p),done=p>=1;
 const st=!done?`<span class="st go">${STAGES[c].label}</span>`:o.unboxed?`<span class="st">已拆箱</span>`:`<span class="st done">待拆箱</span>`;
 return `<article class="parcel" data-no="${o.no}"><div class="p-head"><span class="no">${o.no}</span>${o.demo?'<span class="demo">示例</span>':""}${st}</div>
 <div class="thumbs">${o.items.map(i=>`<div class="art">${art(BY[i.id],i.ci)}</div>`).join("")}</div>
 <div class="bar"><i style="width:${p*100}%"></i><b class="truck" style="left:${p*100}%">${TRUCK}</b></div>
 <ol class="stages">${STAGES.map((s,i)=>`<li class="${i<=c?"done":""}">${s.label}</li>`).join("")}</ol>
 <p class="where">${whereText(o)}</p>
 ${done&&!o.unboxed?`<button class="btn wide" data-unbox="${o.no}">拆箱</button>`:""}</article>`;
}
function whereText(o){const p=prog(o),c=stageOf(p);return p<1?`<b>${STAGES[c].place}</b> · 还要 ${fmtDur(o.placedAt+dur(o)-now())}`:o.unboxed?`已收进家当`:`<b>到门口了</b> · 去拆吧`;}

 return `<svg viewBox="0 0 96 112" aria-hidden="true"><defs><clipPath id="jc"><path d="M20 26 h56 v70 a10 10 0 0 1 -10 10 h-36 a10 10 0 0 1 -10 -10z"/></clipPath></defs><rect x="24" y="6" width="48" height="13" rx="4" class="lidc"/><path d="M18 22 h60 v74 a12 12 0 0 1 -12 12 h-36 a12 12 0 0 1 -12 -12z" class="glass"/><g clip-path="url(#jc)"><rect x="18" y="${108-h}" width="60" height="${h}" class="coins"/>${edges}</g></svg>`;}

function compareSet(p){let g=P.filter(x=>x.group===p.group&&x.id!==p.id);if(!g.length)g=P.filter(x=>x.cat===p.cat&&x.id!==p.id).sort((a,b)=>Math.abs(a.price-p.price)-Math.abs(b.price-p.price)).slice(0,2);return g.slice(0,3);}
const AVC=["#E2793A","#3D7BE0","#169E70","#B36AD6","#8A9A2B","#C79661","#2F8F9D","#7A6CE0"];
function stars(n){return `<span class="stars" aria-label="${n} 星">${"★".repeat(n)}<b>${"★".repeat(5-n)}</b></span>`;}
const hashStr=t=>[...t].reduce((a,ch)=>(a*31+ch.charCodeAt(0))>>>0,7);
function agoText(t){const d=now()-t;if(d<60e3)return "刚刚";if(d<HR)return Math.floor(d/60e3)+" 分钟前";if(d<DAY)return Math.floor(d/HR)+" 小时前";return Math.floor(d/DAY)+" 天前";}
function likeBtn(k,base,B,off){const on=B.liked(k);return `<button class="like" data-like="${k}" aria-pressed="${on}" aria-label="有用"${off?" disabled":""}>${SV_THUMB}<span>${base+B.likeN(k)}</span></button>`;}
// Your own posts get 删除; other people's get 举报 on the shared board; the admin can remove anything.
function postTool(x,kind,inline){const c=inline?"del in":"del";
 if(x.mine||(API&&ADM))return `<button class="${c}" data-del="${x.id}" data-dk="${kind}">删除</button>`;
 return API?`<button class="${c}" data-rep="${x.id}">举报</button>`:"";}
const MINE='<span class="mine">我的</span>',SAMPLE=''; // the shop's own reviews and answers carry no tag; one line above the reviews says they are made up
function rvHtml(nick,av,s,meta,text,follow,chip,act){return `<div class="rv"><div class="av" style="background:${av}">${esc([...nick][0]||"客")}</div><div><div class="rv-top"><b>${esc(nick)}${chip}</b>${stars(s)}</div><div class="rv-meta">${esc(meta)}</div><p>${esc(text)}</p>${follow?`<div class="follow"><em>追评</em>${esc(follow)}</div>`:""}<div class="rv-act">${act}</div></div></div>`;}
function reviewsSection(p){const B=board(p.id),o=owns(p.id),done=B.reviews.some(r=>r.mine)||(API&&reviewed(p.id));
 const act=o&&!done?`<button class="btn sm" data-write="${p.id}" data-wci="${o.ci||0}">写评价</button>`:(!o?`<span class="note">收到包裹后能写评价</span>`:"");
 return `<div class="sec-head"><h3>买家评价 <small>${p.sold} 条</small></h3>${act}</div><div class="rv-head"><div class="rv-score">${p.rating.toFixed(1)}</div><div>${stars(Math.round(p.rating))}<div class="rv-note">商品名均为谐音，自带的评价和问答是虚构的</div></div></div>`+
  (B.err?`<p class="board-note">大家的评价暂时没连上</p>`:"")+
  B.reviews.map(r=>{const k=API?"r:"+r.id:r.id;return rvHtml(r.nick,API?okColor(r.color):AVC[hashStr(r.nick)%AVC.length],r.stars,agoText(r.t)+(p.colors.length>1?" · "+colorName(p,r.ci):""),r.text,"",r.mine?MINE:"",likeBtn(k,0,B,API&&r.mine)+postTool(r,"r"));}).join("")+
  p.reviews.map((r,i)=>{const k=`s:${p.id}:${i}`;return rvHtml(r.nick,AVC[hashStr(r.nick)%AVC.length],r.stars,(r.ago||"")+(r.color?" · "+r.color:""),r.text,r.follow,SAMPLE,likeBtn(k,3+hashStr(p.id+i)%160,B));}).join("");}
function qaItem(p,B,qkey,x){const o=owns(p.id),ans=B.ans.filter(a=>a.parent===qkey),answered=ans.some(a=>a.mine);
 const seed=(x.sample||[]).map(a=>`<div class="qa-a"><i>答</i><div>${esc(a.text)} <small>${esc(a.nick)}${a.color?" · "+esc(a.color):""}</small></div></div>`).join("");
 const user=ans.map(a=>`<div class="qa-a"><i>答</i><div>${esc(a.text)} <small>${esc(a.nick)}${p.colors.length>1?" · "+esc(colorName(p,a.ci)):""}${a.mine?MINE:""}</small>${postTool(a,"a",true)}</div></div>`).join("");
 const meta=x.sample?`${esc(x.nick)} · ${esc(x.ago)}${SAMPLE}`:`${esc(x.nick)} · ${agoText(x.t)}${x.mine?MINE:""}${postTool(x,"q",true)}`;

 (async()=>{await ensureMe();if(kind!=="q")await syncOwned();return api(`/api/p/${encodeURIComponent(pid)}/posts`,"POST",{kind,text,...extra});})()

  save();toast("删了");refreshBoard();return;}
 api("/api/posts/"+id,"DELETE").then(()=>{const c=RC[pid],n=+id;if(c&&c.posts){const x=c.posts.find(y=>y.id===n);c.posts=c.posts.filter(y=>y.id!==n&&y.parent!=="q:"+n);

function toggleLike(k){const pid=cur&&cur.id;if(!pid)return;

 const c=RC[pid];if(!c||!c.posts)return;c.busy=c.busy||new Set();if(c.busy.has(k))return;c.busy.add(k);
 const on=!c.liked.has(k),flip=v=>{v?c.liked.add(k):c.liked.delete(k);c.likes[k]=Math.max(0,(c.likes[k]||0)+(v?1:-1));};
